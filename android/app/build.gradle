plugins {
    id 'com.android.application'
}

// The release key comes from GitHub secrets (see .github/workflows/android-reader.yml); it is never in the repo.
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'io.github.gabrielmacsantos.leitor'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.gabrielmacsantos.leitor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'leitor'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
