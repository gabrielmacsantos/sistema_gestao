# Builds the Android notification reader (android/) and, on main with the signing key set, publishes it as a Release.
# Secrets (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64 (the .p12 file in base64) and
# ANDROID_KEYSTORE_PASSWORD. Without them it builds a debug APK as an artifact only, to check that it compiles.
# Paste the file contents into the secrets, not the command that prints them (the key is a few thousand characters).
name: Leitor Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-reader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            # Pasting into the secrets page may add spaces or line breaks; base64 has none of them.
            clean=$(printf '%s' "$KEYSTORE" | tr -d ' \r\n\t')
            if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/leitor.p12" 2> /dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 não é um base64 válido (${#clean} caracteres). Copie de novo o conteúdo de leitor.p12.base64.txt."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/leitor.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem a chave de assinatura: gerando só um APK de teste."
          fi

      - name: Montar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          task=assembleDebug; out=app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ANDROID_KEYSTORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
            export ANDROID_KEYSTORE_PASSWORD
            if ! keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD não abre a chave. Copie de novo o conteúdo de senha.txt."
              exit 1
            fi
            task=assembleRelease; out=app/build/outputs/apk/release/app-release.apk
          fi
          # Build errors also become annotations, readable on the run page.
          if ! gradle "$task" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -E "error:|What went wrong|Exception|> " "$RUNNER_TEMP/build.log" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cp "$out" ../minhas-financas-leitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-financas-leitor
          path: minhas-financas-leitor.apk

      - name: Publicar no Releases
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          tag="leitor-v$version"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Leitor de notificações $version" \
              --notes "App Android que leva as notificações do banco para o Minhas Finanças. Veja como instalar no README."
          fi
          gh release upload "$tag" minhas-financas-leitor.apk --clobber
