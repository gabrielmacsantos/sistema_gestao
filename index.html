/** Saves what is pending to GitHub and then clears this browser, so another person can use it. */
/** "Sincronizar agora": brings the account's copy in (asking about a conflict), sends ours and the photos, with progress and a result on the button. */
async function syncNow(btn) {
  if (!sync) return;
  if (!navigator.onLine) return toast("Sem internet. Suas alterações estão salvas neste aparelho e sobem quando a conexão voltar.");
  if (isGoogle() && !sync.dkey) return createPassphraseDialog();
  btn.disabled = true; btn.setAttribute("aria-busy", "true");
  btn.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>Sincronizando…</span>`;
  clearTimeout(pushTimer); pushTimer = null;
  while (pushing) await new Promise((r) => setTimeout(r, 200));
  let ok = false;
  try { await pullIfNewer(); ok = (await syncPhotos()) && syncStatus === "ok"; } catch { ok = false; }
  if (!btn.isConnected) return;
  btn.removeAttribute("aria-busy"); btn.disabled = false;
  btn.innerHTML = syncNowLabel(); // "Sincronizado" stays while nothing is pending; a failure goes back to "Sincronizar agora"
  if (ok) document.getElementById("live").textContent = "Sincronizado";
}

function logoutForm() {
  openModal({
    title: "Sair desta conta?", sub: esc(accountLabel()),
    body: `<p class="muted">Seus dados continuam salvos no ${providerName()} e voltam quando você entrar de novo ${isGoogle() ? "com o Google" : "com seu usuário e senha"}. Os dados da conta saem deste navegador, pronto para outra pessoa usar.</p>`,
    foot: `<button type="button" class="btn btn-secondary btn-sm" data-act="close">Cancelar</button><button type="submit" class="btn btn-primary btn-sm" id="logout-btn">Salvar e sair</button>`,
    onSubmit: async () => {
      if (!navigator.onLine) return toast("Sem internet. Conecte-se para salvar suas alterações na conta antes de sair.");
      const btn = document.getElementById("logout-btn"); btn.disabled = true; btn.textContent = "Salvando…";
      // Wait for an upload already in flight, then send the latest state.
      while (pushing) await new Promise((r) => setTimeout(r, 200));
      // Google's access may have run out: on the site this tap renews it before the last upload
      // (in the app the upload renews it by itself).
      if (isGoogle() && !NATIVE && !(sync.token && sync.token.expiresAt > Date.now())) {
        try { await reconnectGoogle(); } catch (e) { btn.disabled = false; btn.textContent = "Salvar e sair"; return toast(e.message); }
      }
      const photosOk = await syncPhotos();
      await pushNow();
      if (syncStatus === "key" || syncStatus === "conflict") {
        btn.disabled = false; btn.textContent = "Salvar e sair";
        return toast(syncStatus === "key" ? "Crie a senha de criptografia antes de sair, ou seus dados não serão salvos na conta." : "Resolva o conflito de dados antes de sair.");
      }
      if (syncStatus === "error" || syncStatus === "reauth" || !photosOk) {
        btn.disabled = false; btn.textContent = "Salvar e sair";
        return toast(`Não foi possível salvar no ${providerName()}. Verifique a internet e tente de novo.`);
      }
      const where = providerName(); // read before the account is cleared
      if (isGoogle() && NATIVE && NativePlugins.SocialLogin) nativeSocialLogin().then(() => NativePlugins.SocialLogin.logout({ provider: "google" })).catch(() => {});
      // The account's copy leaves this device (photos and records, under its own scope); what was made
      // without an account, if anything, is a separate scope and stays.
      await clearPhotos();
      wsWipeCaches(); // the personal copy and every shared panel's copy of this account leave the device together
      storeSync(null); syncStatus = "off"; setLocalMode(false);
      replaceState(load());
      closeModal(); location.hash = href("entrar"); render();
      toast(`Você saiu. Seus dados estão salvos no ${where}.`);
    },
  });
}

// ---------- Import (OFX / CSV) ----------
function decodeFile(buffer) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
  catch { return new TextDecoder("windows-1252").decode(buffer); }
}
function hashString(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
}
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function parseOfx(text) {
  const tag = (block, name) => { const m = block.match(new RegExp(`<${name}>([^<\\r\\n]*)`, "i")); return m ? m[1].trim() : null; };
  const account = tag(text, "ACCTID") || "";
  return text.split(/<STMTTRN>/i).slice(1).flatMap((raw) => {
    const block = raw.split(/<\/STMTTRN>/i)[0], amount = parseMoneyToCents(tag(block, "TRNAMT") || ""), posted = tag(block, "DTPOSTED") || "";
    if (amount === null || amount === 0 || !/^\d{8}/.test(posted)) return [];
    const date = `${posted.slice(0, 4)}-${posted.slice(4, 6)}-${posted.slice(6, 8)}`, fitid = tag(block, "FITID");
    return [{ type: amount < 0 ? "EXPENSE" : "INCOME", description: (tag(block, "MEMO") || tag(block, "NAME") || "Lançamento importado").slice(0, 120), amountCents: Math.abs(amount), date: isDate(date) ? date : "", externalId: fitid ? `ofx:${account}:${fitid}` : null }];
  });
}
function splitCsv(text) {
  const firstLine = text.split(/\r?\n/)[0] || "", delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') quoted = false; else cell += ch; }
    else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); if (row.some((c) => c.trim())) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); if (row.some((c) => c.trim())) rows.push(row);
  return rows;
}
function parseCsv(text, signMode) {
  const [headers, ...rows] = splitCsv(text.replace(/^﻿/, ""));
  if (!headers) throw new Error("Arquivo vazio.");
  const find = (cands) => { const h = headers.map(norm); const e = h.findIndex((x) => cands.includes(x)); return e >= 0 ? e : h.findIndex((x) => cands.some((c) => x.startsWith(c))); };
  const dc = find(["data", "date", "data lancamento", "data da compra"]), sc = find(["descricao", "description", "historico", "lancamento", "title", "estabelecimento", "memo"]), vc = find(["valor", "amount", "valor (r$)", "value"]);
  if (dc < 0 || sc < 0 || vc < 0) throw new Error("Não encontramos as colunas de data, descrição e valor. Use um cabeçalho como: Data;Descrição;Valor");
  const seen = new Map();
  return rows.flatMap((row) => {
    const amount = parseMoneyToCents(row[vc] || ""), description = (row[sc] || "").trim().slice(0, 120);
    if (amount === null || amount === 0 || !description) return [];
    const v = (row[dc] || "").trim(), br = v.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    let date = br ? `${br[3]}-${br[2]}-${br[1]}` : /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : "";
    if (!isDate(date)) date = "";
    const isExpense = signMode === "negative-expense" ? amount < 0 : amount > 0;
    const base = `${date}|${amount}|${norm(description)}`, occ = (seen.get(base) || 0) + 1; seen.set(base, occ);
    return [{ type: isExpense ? "EXPENSE" : "INCOME", description, amountCents: Math.abs(amount), date, externalId: `csv:${hashString(`${base}|${occ}`)}` }];
  });
}
async function handleImportFile(file) {
  if (!file) return;
  if ((file.type && /^image\/|pdf$/.test(file.type)) || /\.(jpe?g|png|heic|heif|webp|pdf)$/i.test(file.name)) {
    return toast("Isso é uma foto ou PDF. Para guardar um comprovante, abra o lançamento e use “Anexar comprovante”. Aqui entram só extratos .ofx ou .csv.");
  }
  if (file.size > 5 * 1024 * 1024) return toast("Arquivo grande demais (máximo 5 MB).");
  try {
    const text = decodeFile(await file.arrayBuffer());
    const isOfx = /\.ofx$/i.test(file.name) || /<OFX>/i.test(text);
    const drafts = isOfx ? parseOfx(text) : parseCsv(text, document.getElementById("signmode")?.value || "negative-expense");
    if (!drafts.length) return toast("Nenhuma transação encontrada no arquivo.");
    const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
    importInboxIds = null;
    importDrafts = drafts.map((d) => ({ ...d, categoryId: "", duplicate: !!(d.externalId && known.has(d.externalId)), include: !(d.externalId && known.has(d.externalId)) }));
    render();
  } catch (e) { toast(e.message || "Não foi possível ler o arquivo."); }
}
function confirmImport() {
  const chosen = importDrafts.filter((d) => d.include);
  const bad = chosen.findIndex((d) => !d.description.trim() || !(d.amountCents > 0) || !isDate(d.date));
  if (bad >= 0) return toast(`Confira a linha ${importDrafts.indexOf(chosen[bad]) + 1}: descrição, valor e data são obrigatórios.`);
  const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
  let added = 0, ignored = 0;
  for (const d of chosen) {
    if (d.externalId && known.has(d.externalId)) { ignored++; continue; }
    state.transactions.push({ id: uid(), type: d.type, description: d.description.trim(), amountCents: d.amountCents, date: d.date, status: "PAID", categoryId: d.categoryId || null, source: d.source || "BANK_IMPORT", externalId: d.externalId, recurringId: null, period: null, notes: "", createdAt: Date.now() });
    if (d.externalId) known.add(d.externalId); added++;
  }
  if (importInboxIds) { const done = new Set(importInboxIds); state.inbox = state.inbox.filter((x) => !done.has(x.id)); }
  save(); importDrafts = null; importInboxIds = null;
  location.hash = href("lancamentos", { mes: chosen[0]?.date.slice(0, 7) });
  render();
  toast(`${added} lançamento(s) importado(s)${ignored ? `, ${ignored} já existiam` : ""}.`);
}

// ---------- Bank notifications ----------
// They arrive pasted on the Importar page or through "#/notificacao?t=<text>" opened by an automation app
// (MacroDroid on Android, Atalhos on iPhone). Linked ones wait in state.inbox; everything goes through the review.
const INCOMING_KEY = "mf-incoming";
const notifKey = (e) => `notif:${hashString(`${norm(e.text)}|${e.date}`)}`;
const dayDiff = (a, b) => Math.round((Date.parse(`${a}T00:00:00Z`) - Date.parse(`${b}T00:00:00Z`)) / 86400000);

function notificationDrafts(entries) {
  const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
  const live = state.transactions.filter((t) => t.status !== "SKIPPED");
  const seen = new Set(), drafts = [];
  for (const e of entries) {
    const key = notifKey(e);
    if (seen.has(key)) continue;
    seen.add(key);
    const p = parseBankNotification(e.text, e.date);
    if (p.kind === "IGNORE") continue;
    const type = p.kind || "EXPENSE", already = known.has(key);
    // Same value and kind within a day: probably already typed by hand or imported from the statement.
    const same = (t) => t.type === type && t.amountCents === p.amountCents && Math.abs(dayDiff(t.date, p.date)) <= 1;
    // Also against the other notifications in this review: the wallet and the card's bank both notify one purchase.
    const near = !already && !!p.amountCents && (live.some(same) || drafts.some(same));
    drafts.push({
      type, description: p.description || e.text.slice(0, 120), amountCents: p.amountCents || 0, date: p.date,
      categoryId: p.description ? parseSpokenTransaction.guessCategory(p.description, state.categories, type) || "" : "",
      externalId: key, source: "NOTIFICATION", original: e.text,
      duplicate: already, maybeDuplicate: near, unclear: !p.kind, cardBill: p.cardBill,
      include: !already && !near && !!p.kind && !p.cardBill,
    });
  }
  return drafts;
}
function readPastedNotifications() {
  const entries = splitNotifications(document.getElementById("notif-text")?.value || "", todayISO());
  if (!entries.length) return toast("Cole o texto de pelo menos uma notificação.");
  const drafts = notificationDrafts(entries);
  if (!drafts.length) return toast("Nenhum lançamento encontrado: eram avisos de saldo, fatura ou código.");
  importInboxIds = null; importDrafts = drafts; render(); window.scrollTo(0, 0);
}
function reviewInbox() {
  if (!ENABLE_IMPORT_FEATURE || !state.inbox.length) return;
  importInboxIds = state.inbox.map((x) => x.id);
  importDrafts = notificationDrafts(state.inbox);
  if (route().path !== "importar") location.hash = href("importar");
  render(); window.scrollTo(0, 0);
}

// "#/notificacao?t=..." -> kept in sessionStorage until the user is in and the latest data was pulled.
function captureIncoming() {
  const h = location.hash;
  if (!/^#\/?notificacao\b/.test(h)) return;
  if (!ENABLE_IMPORT_FEATURE || !ENABLE_BANK_NOTIFICATIONS) { history.replaceState(null, "", href("painel")); return; }
  const i = h.indexOf("?t="), raw = i < 0 ? "" : h.slice(i + 3);
  let text = raw;
  try { text = decodeURIComponent(raw.replace(/\+/g, " ")); } catch { /* sent without encoding */ }
  history.replaceState(null, "", href("importar"));
  if (!text.trim()) return;
  try { sessionStorage.setItem(INCOMING_KEY, joinIncoming(sessionStorage.getItem(INCOMING_KEY), text)); }
  catch { pendingIncoming = joinIncoming(pendingIncoming, text); }
}
let pendingIncoming = "", flushingIncoming = false;
const joinIncoming = (a, b) => (a ? `${a}\n---\n${b}` : b);
function takeIncoming() {
  let text = pendingIncoming; pendingIncoming = "";
  try { const s = sessionStorage.getItem(INCOMING_KEY); if (s) { text = joinIncoming(text, s); sessionStorage.removeItem(INCOMING_KEY); } } catch {}
  return text;
}
function hasIncoming() {
  if (pendingIncoming) return true;
  try { return !!sessionStorage.getItem(INCOMING_KEY); } catch { return false; }
}
// quiet: nothing to say when nothing new arrived (the app checks its native queue on every open).
async function flushIncoming({ quiet = false } = {}) {
  if (flushingIncoming || !hasIncoming() || !(sync || isLocalMode())) return;
  flushingIncoming = true;
  try {
    // Pull first so saving the inbox never overwrites what another device saved meanwhile.
    await pullIfNewer();
    const text = takeIncoming(); if (!text) return;
    const known = new Set([...state.inbox.map(notifKey), ...state.transactions.map((t) => t.externalId).filter(Boolean)]);
    const fresh = [];
    for (const e of splitNotifications(text, todayISO())) {
      const key = notifKey(e);
      // Balances, bill reminders and codes never become transactions, so they do not wait in the queue.
      if (known.has(key) || parseBankNotification(e.text, e.date).kind === "IGNORE") continue;
      known.add(key); fresh.push(e);
    }
    if (!fresh.length) {
      render();
      if (!quiet) toast("Nada novo: a notificação já estava na fila, já foi lançada ou era só aviso (saldo, fatura, código).");
      return;
    }
    // Automatic mode (the user's own choice in the app): what was read with certainty is saved right away,
    // anything unclear or possibly duplicated still waits for review.
    const auto = notifAutoMode() ? notificationDrafts(fresh).filter((d) => d.include) : [];
    const autoKeys = new Set(auto.map((d) => d.externalId));
    for (const d of auto) {
      state.transactions.push({ id: uid(), type: d.type, description: d.description, amountCents: d.amountCents, date: d.date, status: "PAID", categoryId: d.categoryId || null, source: "NOTIFICATION", externalId: d.externalId, recurringId: null, period: null, notes: "", createdAt: Date.now() });
    }
    const queued = fresh.filter((e) => !autoKeys.has(notifKey(e)));
    for (const e of queued) state.inbox.push({ id: uid(), text: e.text, date: e.date, at: Date.now() });
    save();
    const savedMsg = auto.length ? `${auto.length} ${auto.length === 1 ? "lançamento adicionado" : "lançamentos adicionados"} das notificações` : "";
    if (queued.length) {
      reviewInbox();
      toast(`${savedMsg ? `${savedMsg}. ` : ""}${queued.length} ${queued.length === 1 ? "notificação para conferir" : "notificações para conferir"}.`);
    } else { render(); toast(`${savedMsg}.`); }
  } finally { flushingIncoming = false; }
}

// ---------- Bank notifications inside the Android app ----------
// The app reads notifications natively (BankListener, mobile/android) only after the user says yes here, and they
// choose whether clear ones are saved right away or everything waits for review. Both choices live on this phone.
const NOTIF_ASKED_KEY = "mf-notif-asked";
const NOTIF_AUTO_KEY = "mf-notif-auto";
let notifStatus = null; // { access, watching, apps, pending, readerInstalled } from the native side
const BankNotif = () => NativePlugins.BankNotifications;
function notifAutoMode() { try { return localStorage.getItem(NOTIF_AUTO_KEY) === "1"; } catch { return false; } }
function setNotifAutoMode(on) { try { localStorage.setItem(NOTIF_AUTO_KEY, on ? "1" : "0"); } catch {} }
function notifAsked() { try { return localStorage.getItem(NOTIF_ASKED_KEY) === "1"; } catch { return true; } }
function setNotifAsked() { try { localStorage.setItem(NOTIF_ASKED_KEY, "1"); } catch {} }
const dayOf = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

async function refreshNotifStatus() {
  if (!BankNotif()) return;
  const before = JSON.stringify(notifStatus);
  notifStatus = await BankNotif().status().catch(() => notifStatus);
  if (JSON.stringify(notifStatus) !== before && route().path === "configuracoes") render();
}

// Takes what the native side collected and sends it through the usual path (pull, inbox or auto, review).
async function pullNativeNotifications() {
  if (!BankNotif() || !notifStatus?.watching || !(sync || isLocalMode())) return;
  const { items = [] } = await BankNotif().takeQueue().catch(() => ({}));
  if (!items.length) return;
  pendingIncoming = joinIncoming(pendingIncoming, items.map((i) => `[${dayOf(i.at)}] ${i.text}`).join("\n---\n"));
  flushIncoming({ quiet: true });
}

async function onAppForeground() {
  await refreshNotifStatus();
  await pullNativeNotifications();
  maybeAskNotifications();
}

// Asked once, on its own, when the app opens; afterwards only from the card in Importar.
function maybeAskNotifications() {
  if (!BankNotif() || notifAsked() || notifStatus?.watching || !(sync || isLocalMode())) return;
  if (AUTH_PAGES.includes(route().path) || document.querySelector(".overlay")) return;
  askNotifications();
}

const NOTIF_HINT_AUTO = "O que for lido com certeza vira lançamento na hora. O que estiver confuso ou parecer repetido espera a sua conferência.";
const NOTIF_HINT_REVIEW = "Tudo espera a sua conferência: um toque em “Importar” salva. Recomendado no começo.";
function askNotifications() {
  let auto = notifAutoMode();
  openModal({
    title: "Ler as notificações do banco?",
    sub: "Você decide. Dá para mudar quando quiser em Configurações.",
    body: `<div class="form-grid">
      <ul class="muted" style="margin:0;padding-left:20px;display:grid;gap:6px">
        <li>O app passa a ler as notificações dos <b>bancos e carteiras que você marcar</b> (Pix, compras, depósitos), só as que têm valor em R$.</li>
        <li>As outras notificações são ignoradas e nunca guardadas.</li>
        <li>O texto lido fica neste celular até virar lançamento nos seus dados, que só você acessa.</li>
        <li>Depois, o Android vai pedir para você ativar o <b>acesso às notificações</b> do Nexus Financy IA.</li>
      </ul>
      <div class="field"><span class="field-label">Quando chegar uma movimentação</span>
        ${tabsHtml({ kind: "radio", key: "notif-ask-mode", label: "Quando chegar uma movimentação", fill: true, active: auto ? "auto" : "review", items: [{ value: "review", label: "Revisar antes", attrs: 'data-act="notif-ask-mode" data-mode="review"' }, { value: "auto", label: "Lançar sozinho", attrs: 'data-act="notif-ask-mode" data-mode="auto"' }] })}
        <span class="hint" id="notif-ask-hint">${auto ? NOTIF_HINT_AUTO : NOTIF_HINT_REVIEW}</span>
      </div>
    </div>`,
    foot: `<button type="button" class="btn btn-secondary btn-sm" data-act="notif-not-now">Agora não</button><button type="submit" class="btn btn-primary btn-sm">${icon("bell")} Habilitar</button>`,
    onSubmit: () => enableNotifications(auto),
  });
  askNotifications.setMode = (m) => { auto = m === "auto"; paintModeTabs("notif-ask-mode", "notif-ask-hint", auto); };
}
// Marks the chosen mode button and swaps the hint without redrawing anything.
function paintModeTabs(act, hintId, auto) {
  const modeBar = document.querySelector(`[data-act="${act}"]`)?.closest(".t-tabs");
  selectTab(modeBar, modeBar?.querySelector(`[data-mode="${auto ? "auto" : "review"}"]`));
  const hint = document.getElementById(hintId);
  if (hint) hint.textContent = auto ? NOTIF_HINT_AUTO : NOTIF_HINT_REVIEW;
}

async function enableNotifications(auto) {
  setNotifAsked(); setNotifAutoMode(auto); closeModal();
  await BankNotif().setWatching({ on: true });
  await BankNotif().requestPermissions().catch(() => {}); // to show "movimentações do banco"
  await refreshNotifStatus();
  if (!notifStatus?.access) {
    toast("Na próxima tela, ative “Nexus Financy IA” na lista.");
    setTimeout(() => BankNotif().openAccessSettings(), 1200);
  } else toast("Leitura de notificações ligada.");

function loadDemo() {
  clearPhotos();

  const cur = currentMonth(), start = addMonths(cur, -5), today = Number(todayISO().slice(8, 10));
  fresh.recurrings = [
    { id: uid(), type: "EXPENSE", description: "Aluguel", amountCents: 240000, dayOfMonth: 5, startMonth: start, endMonth: null, categoryId: cat("Moradia") },
    { id: uid(), type: "EXPENSE", description: "Energia elétrica", amountCents: 38000, dayOfMonth: 24, startMonth: start, endMonth: null, categoryId: cat("Contas e serviços") },
    { id: uid(), type: "EXPENSE", description: "Internet fibra", amountCents: 14900, dayOfMonth: 10, startMonth: start, endMonth: null, categoryId: cat("Assinaturas") },
    { id: uid(), type: "INCOME", description: "Salário", amountCents: 720000, dayOfMonth: 5, startMonth: start, endMonth: null, categoryId: cat("Salário", "INCOME") },
  ];
  replaceState(fresh); ensureOccurrences();
  const vars = [["Pão de Açúcar", 34280, "Mercado"], ["Posto Ipiranga", 21000, "Transporte"], ["Restaurante", 16850, "Alimentação"], ["Farmácia", 8790, "Saúde"], ["Uber", 4320, "Transporte"], ["Cinema", 6400, "Lazer"]];
  for (let i = 0; i < 6; i++) {
    const m = addMonths(start, i), last = m === cur, maxDay = last ? Math.max(1, today) : 28;
    vars.forEach(([d, a, c], j) => state.transactions.push({ id: uid(), type: "EXPENSE", description: d, amountCents: a + i * 650 * (j + 1), date: `${m}-${pad(Math.min(3 + j * 4, maxDay))}`, status: "PAID", categoryId: cat(c), source: "MANUAL", recurringId: null, period: null, notes: "", createdAt: Date.now() }));
    if (i % 2) state.transactions.push({ id: uid(), type: "INCOME", description: "Freelance", amountCents: 130000, date: `${m}-${pad(Math.min(15, maxDay))}`, status: "PAID", categoryId: cat("Renda extra", "INCOME"), source: "MANUAL", recurringId: null, period: null, notes: "", createdAt: Date.now() });
  }
  // Past occurrences of fixed items are paid; the current month keeps some pending.
  for (const t of state.transactions) if (t.recurringId && (t.period < cur || t.date <= todayISO())) t.status = "PAID";
  state.budgets = [{ id: uid(), categoryId: cat("Alimentação"), amountCents: 30000 }, { id: uid(), categoryId: cat("Transporte"), amountCents: 35000 }];
  state.goals = [{ id: uid(), name: "Reserva de emergência", targetCents: 2000000, savedCents: 640000, deadline: null }];
  const tm = addMonths(cur, -1), tripId = uid();
  state.trips = [{ id: tripId, name: "Férias em Florianópolis", destination: "Florianópolis, SC", startDate: `${tm}-10`, endDate: `${tm}-15`, budgetCents: 300000, includeInMain: false, createdAt: Date.now() }];
  [["Passagens aéreas", 98000, "Transporte", 10], ["Hotel (5 noites)", 125000, "Moradia", 10], ["Restaurante na praia", 18900, "Alimentação", 12], ["Passeio de barco", 22000, "Lazer", 13], ["Uber", 6400, "Transporte", 14]]
    .forEach(([d, a, c, day]) => state.transactions.push({ id: uid(), type: "EXPENSE", description: d, amountCents: a, date: `${tm}-${pad(day)}`, status: "PAID", categoryId: cat(c), source: "MANUAL", recurringId: null, period: null, notes: "", tripId, createdAt: Date.now() }));
  // Everything in the state at this point is sample data: mark it so leaving removes only these.
  state.demo = true;
  for (const k of ["transactions", "recurrings", "budgets", "goals", "trips"]) state[k].forEach((x) => { x.demo = true; });
  save(); location.hash = href("painel"); render(); toast("Dados de exemplo carregados.");
}
/** Leaves the sample: removes only the records marked as sample, for good, and never offers it again. */
function exitDemo(opts) {
  // From the banner (on the Painel) it stays there; from a "new entry" button it must keep the current screen, or the
  // form opens over a different page than the one the person was on.
  const stay = opts && opts.stay === true;
  replaceState(withoutDemo(state)); save(); if (!stay) location.hash = href("painel"); render();
  toast("Exemplo removido. Sua gestão começa do zero.");
}
/** Real data must not mix with the sample: ask to leave it first, then continue. */
function leaveDemoThen(proceed) {
  if (!state.demo) return proceed();
  // The next form replaces this dialog in place (no close, no second backdrop), so the screen behind never blinks.
  openModal({
    title: "Sair do exemplo?",
    body: `<p class="muted">Você está vendo dados de exemplo. Para lançar dados reais, saia do exemplo primeiro: os dados fictícios serão removidos.</p>`,
    foot: `<button type="button" class="btn btn-secondary btn-sm" data-act="close">Cancelar</button><button type="submit" class="btn btn-danger btn-sm">Sair do exemplo e continuar</button>`,
    onSubmit: () => { exitDemo({ stay: true }); proceed(); },

// ---------- Test version (beta): notice and end screen ----------

{ // keeps the count right while the app stays open, and ends the test on time

// ---------- Product tour (first access) ----------
const tourState = { el: null, list: TOUR_STEPS, nav: null, retry: null, i: -1, prevFocus: null, prevOverflow: "", startTimer: null, trackRaf: 0, layoutRaf: 0, onKey: null, onLayout: null, adjusted: false };
const tourReduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function tourDone() { try { return localStorage.getItem(tourKey(scopeOf(sync))) === "1"; } catch { return true; } } // no storage: never nag
const firstVisible = (sel) => [...document.querySelectorAll(sel)].find((el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }) || null;

function tourCanStart(r) {

/** Called after every render: starts the tour once the Painel has settled, or keeps an open one in place. */
function maybeStartTour(r) {
  if (tourState.el) {
    if (tourState.nav && r.path === tourState.nav.path) { const i = tourState.nav.i; tourState.nav = null; setTimeout(() => showTourStep(i), 120); return; }
    const cur = tourState.list[tourState.i];

function startTour() {
  if (tourState.el) return;

  el.innerHTML = `<div class="tour-block"></div><svg class="tour-scrim" aria-hidden="true"><defs><mask id="tour-mask" maskUnits="userSpaceOnUse"><rect width="100%" height="100%" fill="white"/><g id="tour-holes"></g></mask></defs><rect class="tour-scrim-fill" width="100%" height="100%" mask="url(#tour-mask)"/></svg><div id="tour-rings"></div><div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text" tabindex="-1"></div>`;
  document.body.appendChild(el);

    if (act === "start") showTourStep(0);
    else if (act === "next" || act === "skip-step") showTourStep(tourState.i + 1);
    else if (act === "prev") showTourStep(tourState.i - 1, -1);
    else if (act === "skip-all") endTour({ save: true });

    if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); endTour({ save: true }); return; }
    if (e.key !== "Tab") return;

  };

  document.addEventListener("keydown", tourState.onKey, true);
  window.addEventListener("resize", tourState.onLayout);
  window.addEventListener("orientationchange", tourState.onLayout);
  window.addEventListener("scroll", tourState.onLayout, { passive: true });
  window.visualViewport?.addEventListener("resize", tourState.onLayout);
  window.visualViewport?.addEventListener("scroll", tourState.onLayout);

  card.className = "tour-card center";
  card.innerHTML = `<h2 class="h-card" id="tour-title">Bem-vindo ao Nexus Financy IA 👋</h2>
    <p class="muted" id="tour-text" style="margin-top:8px">Vamos passear por todas as telas, passo a passo, explicando o que cada coisa faz. Leva uns 3 minutos e você pode pular quando quiser.</p>
    <div class="tour-actions"><button type="button" class="btn btn-primary" data-tour="start">Começar tour</button></div>
    <button type="button" class="btn btn-ghost tour-skip" data-tour="skip-all">Pular tutorial</button>`;
  card.focus({ preventScroll: true });
}
function showTourStep(from, dir = 1) {
  const card = document.getElementById("tour-card"); if (!card) return;
  const list = tourState.list, here = route().path;
  // On this page a step needs its target on screen; a step of another page is reached by going there first.
  const usable = (n) => stepPath(list[n]) !== here || !list[n].sel || !!tourTarget(list[n]);
  const idx = dir < 0 ? resolveTourStepBack(from, usable) : resolveTourStep(list.length, from, usable);
  if (idx < 0) return dir < 0 ? showTourStep(0) : endTour({ save: true, home: true });

  const isLast = idx === list.length - 1;
  tourState.i = idx; tourState.adjusted = false;

    <h2 class="h-card" id="tour-title" style="margin-top:4px">${esc(s.title)}</h2>

    <div class="tour-actions">${idx > 0 ? '<button type="button" class="btn btn-secondary" data-tour="prev">Voltar</button>' : ""}<button type="button" class="btn btn-primary" data-tour="next">${isLast ? "Concluir" : "Próximo"}</button></div>

/** Lays out the cut-out, the rings and the card from the current position of the target. */
function tourLayout() {
