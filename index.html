<style>
/* ===== Sovereign Financial design tokens (Design-google/sovereign_financial/DESIGN.md) ===== */
:root {
  --bg: #f8f9ff; --surface: #f8f9ff; --card: #ffffff;
  --c-low: #eff4ff; --c: #e5eeff; --c-high: #dce9ff; --c-highest: #d3e4fe;
  --on: #0b1c30; --on-var: #3d4947; --outline: #6d7a77; --outline-var: #bcc9c6;
  --hairline: rgb(226 232 240 / .8); --scrim: rgb(15 23 42 / .35);
  --primary: #00685f; --on-primary: #fff; --primary-c: #008378; --on-primary-c: #f4fffc;
  --primary-fixed: #89f5e7; --on-primary-fixed: #00201d;
  --secondary: #565e74; --secondary-c: #dae2fd; --on-secondary-c: #5c647a;
  --tertiary: #006947; --on-tertiary: #fff; --tertiary-c: #00855b; --tertiary-fixed: #6ffbbe; --on-tertiary-fixed: #002113;
  --success: #059669; --success-c: #ecfdf5; --warning: #d97706; --warning-c: #fffbeb; --danger: #e11d48; --danger-c: #fff1f2;
  --chart-in: #059669; --chart-out: #94a3b8; --chart-grid: #e2e8f0;
  --shadow: 0 1px 2px rgb(15 23 42 / .05);
  --shadow-3: 0 20px 25px -5px rgb(15 23 42 / .06), 0 8px 10px -6px rgb(15 23 42 / .04);
  --font: "Inter", ui-sans-serif, system-ui, sans-serif;
  --display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
  --rail: 260px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #0e1626; --card: #111a2b;
  --c-low: #152035; --c: #1a273d; --c-high: #203049; --c-highest: #273a56;
  --on: #e6edf8; --on-var: #b4c2c0; --outline: #8a9896; --outline-var: #34455e;
  --hairline: rgb(52 69 94 / .7); --scrim: rgb(2 6 23 / .6);
  --primary: #6bd8cb; --on-primary: #00201d; --primary-c: #4fc3b6; --on-primary-c: #00201d;
  --primary-fixed: #005049; --on-primary-fixed: #89f5e7;
  --secondary: #a9b3cc; --secondary-c: #2a3550; --on-secondary-c: #c6cee6;
  --tertiary: #4edea3; --on-tertiary: #002113; --tertiary-c: #3cc58e; --tertiary-fixed: #005236; --on-tertiary-fixed: #6ffbbe;
  --success: #34d399; --success-c: rgb(16 185 129 / .14); --warning: #fbbf24; --warning-c: rgb(245 158 11 / .14);
  --danger: #fb7185; --danger-c: rgb(225 29 72 / .16);
  --chart-in: #34d399; --chart-out: #64748b; --chart-grid: #233149;
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--on); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--primary-fixed); color: var(--on-primary-fixed); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.t-income { color: var(--success); } .t-danger { color: var(--danger); } .t-warning { color: var(--warning); } .t-primary { color: var(--primary); } .t-tertiary { color: var(--tertiary); }

/* ===== Shell ===== */
.rail { display: none; position: fixed; inset: 0 auto 0 0; width: 80px; z-index: 30; background: var(--card); border-right: 1px solid var(--hairline); padding: 16px; flex-direction: column; justify-content: space-between; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; justify-content: center; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-c); color: var(--on-primary-c); flex: none; box-shadow: var(--shadow); }
.brand-text { display: none; min-width: 0; }
.brand-name { font: 700 18px/24px var(--display); letter-spacing: -.01em; color: var(--primary); }
.brand-sub { font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; color: var(--secondary); }
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; }
.nav a { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border-radius: 8px; color: var(--secondary); font-weight: 600; transition: background .15s, color .15s; }
.nav a:hover { background: var(--c-low); color: var(--on); }
.nav a.active { background: var(--c-high); color: var(--primary); }
.nav .lbl { display: none; }
.rail .btn-new { margin-top: 24px; width: 100%; padding: 0; }
.rail .btn-new .lbl { display: none; }
.rail-foot { border-top: 1px solid var(--hairline); padding-top: 16px; margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
.page { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); padding-top: env(safe-area-inset-top); }
.topbar-in { max-width: 1280px; margin: 0 auto; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.trail { display: none; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--secondary); }
.trail b { color: var(--primary); font-weight: 600; }
.mob-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mob-brand .brand-logo { width: 36px; height: 36px; border-radius: 10px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--hairline); background: transparent; color: var(--secondary); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--c-low); color: var(--on); }
main { width: 100%; max-width: 1280px; margin: 0 auto; flex: 1; padding: 24px 16px 112px; }
.bottomnav { position: fixed; inset: auto 0 0 0; z-index: 40; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--hairline); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgb(15 23 42 / .06); }
.bottomnav ul { list-style: none; margin: 0; padding: 0 4px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .02em; color: var(--secondary); }
.bottomnav a.active { color: var(--primary); }
.bottomnav svg.i { width: 22px; height: 22px; }
.fab { display: grid !important; place-items: center; width: 52px; height: 52px; margin: -20px auto 4px; border-radius: 999px; background: var(--primary); color: var(--on-primary) !important; box-shadow: 0 6px 16px rgb(0 104 95 / .35); border: 4px solid var(--card); padding: 0 !important; }
.fab svg.i { width: 24px !important; height: 24px !important; }

@media (min-width: 768px) {
  .rail { display: flex; }
  .page { padding-left: 80px; }
  .bottomnav, .mob-only { display: none !important; }
  .topbar-in { padding: 0 24px; }
  main { padding: 24px 24px 40px; }
}
@media (min-width: 1024px) {
  .rail { width: var(--rail); }
  .page { padding-left: var(--rail); }
  .brand { justify-content: flex-start; }
  .brand-text, .nav .lbl, .rail .btn-new .lbl { display: block; }
  .nav a { justify-content: flex-start; padding: 10px 12px; }
  .rail .btn-new { padding: 0 16px; }
  .trail { display: flex; }
  .mob-brand { display: none; }
  .topbar-in { padding: 0 40px; }
  main { padding: 24px 40px 40px; }
}
@media (max-width: 767px) { .desk-only { display: none !important; } }

/* ===== Components ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 14px; letter-spacing: .01em; white-space: nowrap; transition: background .15s, transform .15s, color .15s; }
.btn:active { transform: scale(.99); }
.btn:focus-visible, .icon-btn:focus-visible, .nav a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 12px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }
.btn-primary:hover { background: var(--primary-c); }
.btn-income { background: var(--tertiary); color: var(--on-tertiary); box-shadow: var(--shadow); }
.btn-income:hover { background: var(--tertiary-c); }
.btn-secondary { background: var(--card); border-color: color-mix(in srgb, var(--outline-var) 60%, transparent); color: var(--on); }
.btn-secondary:hover { background: var(--c-low); }
.btn-ghost { background: transparent; color: var(--secondary); }
.btn-ghost:hover { background: var(--c-low); color: var(--on); }
.btn-danger { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .6; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.h-page { font-size: 22px; line-height: 28px; letter-spacing: -.015em; }
.h-card { font-size: 18px; line-height: 24px; letter-spacing: -.01em; }
.sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--secondary); }
.page-head { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
.page-head .desc { margin-top: 2px; color: var(--secondary); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (min-width: 640px) {
  .page-head { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .h-page { font-size: 28px; line-height: 36px; letter-spacing: -.02em; }
}
.stack { display: flex; flex-direction: column; gap: 24px; }
.stack > .page-head { margin-bottom: 0; }
.grid-kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-kpi > .span2 { grid-column: span 2; }
.grid-3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 > .span2 { grid-column: span 2; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 640px) { .grid-kpi, .grid-3 { gap: 16px; } }
@media (min-width: 1024px) {
  .grid-kpi { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .grid-kpi > .span2, .grid-3 > .span2 { grid-column: auto; }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.metric { display: flex; flex-direction: column; justify-content: space-between; }
.metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.metric-label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .02em; color: var(--secondary); }
.chip { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.metric-value { margin-top: 12px; font: 700 22px/28px var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 2px 8px; border-radius: 999px; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.pill svg.i { width: 12px; height: 12px; }
.meter { margin-top: 12px; height: 6px; border-radius: 999px; background: var(--c-high); overflow: hidden; }
.meter > div { height: 100%; border-radius: 999px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.badge.nodot::before { display: none; }
.b-success { background: var(--success-c); color: var(--success); }
.b-warning { background: var(--warning-c); color: var(--warning); }
.b-neutral { background: var(--c); color: var(--secondary); }
.cat { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 8px; border-radius: 999px; background: var(--c); color: var(--secondary); font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; }
.dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
.empty { border: 1px dashed var(--outline-var); border-radius: 12px; padding: 24px; text-align: center; color: var(--secondary); }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); background: var(--warning-c); }
.insight { display: flex; gap: 10px; margin-top: 24px; padding: 16px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--c-low); color: var(--on-var); }
.month { display: inline-flex; align-items: center; gap: 4px; padding: 2px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--card); }
.month a { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--secondary); }
.month a:hover { background: var(--c-low); color: var(--on); }
.month span { min-width: 150px; text-align: center; font-weight: 600; }
.seg { display: inline-flex; align-items: center; padding: 4px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface); font-size: 12px; font-weight: 500; }
.seg a { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; color: var(--secondary); }
.seg a.on { background: var(--card); color: var(--primary); font-weight: 600; box-shadow: var(--shadow); }
.seg a:hover:not(.on) { color: var(--on); }

/* Ledger */
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border-bottom: 1px solid var(--c-low); }
.ledger li:last-child { border-bottom: 0; }
.ledger li.income { background: color-mix(in srgb, var(--success-c) 45%, transparent); }
.ledger .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.ledger .row-main:hover .row-title { color: var(--primary); }
.row-icon { position: relative; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex: none; overflow: hidden; }
.row-icon::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .12; }
.row-title { font-weight: 600; transition: color .15s; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--secondary); }
.row-cat { display: none; width: 180px; }
.row-date { display: none; width: 72px; color: var(--on-var); }
.row-status { display: none; width: 96px; }
.row-amount { text-align: right; flex: none; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-amount small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--secondary); }
@media (min-width: 768px) {
  .ledger li { min-height: 56px; }
  .row-cat, .row-date, .row-status { display: block; }
  .row-amount { width: 130px; }
  .row-amount small, .row-meta .m-mob { display: none; }
}
.toggle { width: 28px; height: 28px; border-radius: 999px; border: 2px solid var(--outline-var); background: transparent; color: transparent; display: grid; place-items: center; flex: none; transition: all .15s; }
.toggle:hover { border-color: var(--primary); }
.toggle.on { border-color: var(--success); background: var(--success); color: #fff; }
.toggle svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
.list-head { display: none; }
@media (min-width: 768px) {
  .list-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--hairline); font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--secondary); }
}
.section-head { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-bottom: 1px solid var(--hairline); }
@media (min-width: 640px) { .section-head { flex-direction: row; align-items: center; justify-content: space-between; } }
.section-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--secondary); }

/* Chart */
.flow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 16px 0; }
@media (min-width: 640px) { .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.flow > div { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface); }
.flow > div.hl { background: var(--c-low); }
.flow b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { position: relative; height: 224px; }
.chart-grid { position: absolute; inset: 0 0 40px 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.chart-grid div { border-top: 1px solid var(--chart-grid); }
.chart-cols { position: relative; display: flex; height: 100%; gap: 6px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 2px 0; border-radius: 12px; }
.chart-col.cur { background: var(--c-low); }
.bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.bars div { width: 14px; border-radius: 3px 3px 0 0; }
.chart-lbl { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .02em; color: var(--secondary); text-align: center; }
.chart-lbl span:first-child { text-transform: capitalize; }
.chart-col.cur .chart-lbl { color: var(--primary); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.dist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.dist-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.bar { height: 8px; border-radius: 999px; background: var(--c-high); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; list-style: none; }
.hscroll > li { flex: none; width: 168px; scroll-snap-align: start; }

    if (!who && wallet && kind === "EXPENSE" && index > 0) {
      const head = raw.slice(0, index).replace(WALLET_WORDS, " ").replace(/[\s:|•·–—-]+/g, " ").replace(/\b(de|no valor de)\s*$/i, "").trim();
      if (/\p{L}{2}/u.test(head) && !NOT_NAME.test(norm(head))) who = titleCase(head).slice(0, 80);

      else who = cleanName(raw.slice(index).replace(/^(?:R\$|BRL)?\s*-?\s*[\d.,]+\s*/i, ""));
    }
    let description = label;
    if (who) {
      if (/^(Pix|Transferência)/.test(label)) description = `${label.split(" ")[0]} ${kind === "INCOME" ? "de" : "para"} ${who}`;
      else if (label === "Estorno" || label === "Cashback") description = `${label}: ${who}`;
      else description = who;
    }
    return { kind, amountCents: cents, date: dateOf(raw, fallbackDate), description: description.slice(0, 120), cardBill: kind === "EXPENSE" && /fatura/.test(n) };
  }

  /**
   * Pasted or linked text -> one entry per notification. Notifications are separated by a blank line or a
   * line with "---"; each may start with the day it arrived ("[2026-11-09]", "09/11/2026 14:32 -").
   */
  function splitNotifications(input, today) {
    const PREFIX = /^\s*\[?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4})(?:[ T,]+\d{1,2}:\d{2}(?::\d{2})?)?\s*\]?\s*[-–:|]?\s*/;
    return String(input ?? "").replace(/\r/g, "").split(/\n\s*(?:-{3,}\s*)?\n|\n-{3,}\n?/).map((chunk) => {
      let text = chunk.trim(), date = today;
      const m = PREFIX.exec(text);
      if (m && text.length > m[0].length) {
        let y, mo, d;
        if (m[1].includes("-")) [y, mo, d] = m[1].split("-").map(Number);
        else { [d, mo, y] = m[1].split("/").map(Number); y = fullYear(y); }
        if (validDate(y, mo, d)) { date = iso(y, mo, d); text = text.slice(m[0].length).trim(); }
      }
      return { text: text.replace(/\s+/g, " "), date };
    }).filter((e) => e.text.length >= 8);
  }

  return { parseBankNotification, splitNotifications };
})();

// ---------- Store ----------
const KEY = "minhas-financas:v1";
const DEFAULT_CATEGORIES = [
  ["EXPENSE", "Moradia", "#6366f1"], ["EXPENSE", "Alimentação", "#f59e0b"], ["EXPENSE", "Mercado", "#84cc16"],
  ["EXPENSE", "Transporte", "#06b6d4"], ["EXPENSE", "Saúde", "#ef4444"], ["EXPENSE", "Educação", "#8b5cf6"],
  ["EXPENSE", "Lazer", "#ec4899"], ["EXPENSE", "Assinaturas", "#14b8a6"], ["EXPENSE", "Contas e serviços", "#0ea5e9"],
  ["EXPENSE", "Compras", "#f97316"], ["EXPENSE", "Outros", "#64748b"],
  ["INCOME", "Salário", "#22c55e"], ["INCOME", "Renda extra", "#10b981"], ["INCOME", "Investimentos", "#0d9488"], ["INCOME", "Outros", "#64748b"],
].map(([type, name, color]) => ({ id: uid(), type, name, color }));

const emptyState = () => ({ version: 1, categories: DEFAULT_CATEGORIES.map((c) => ({ ...c, id: uid() })), transactions: [], recurrings: [], budgets: [], goals: [], trips: [], inbox: [] });
let state = load();
let storageOk = true;
let needsOccurrences = true;
let occurrencesMonth = "";

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.version === 1) return { ...emptyState(), ...s }; }
  } catch (e) { /* first run or private mode */ }
  return emptyState();
}
/** Writes to this browser only. */
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; toast("Não foi possível salvar no navegador. Exporte um backup."); }
}
/** A user change: stamps it, saves locally and schedules the encrypted copy on GitHub. */
function save() {
  state.savedAt = Date.now();
  persist();
  schedulePush();
}
/** Replaces everything (demo, restore, wipe, data from GitHub). */
function replaceState(next) {
  state = { ...emptyState(), ...next };
  needsOccurrences = true;
}
const catById = (id) => state.categories.find((c) => c.id === id);
const tripById = (id) => state.trips.find((x) => x.id === id);
/** Trip expenses stay out of the monthly management unless that trip is set to be summed. */
const inMain = (t) => { const trip = t.tripId && tripById(t.tripId); return !trip || trip.includeInMain; };
// Visible transactions grouped by month; rebuilt once per render instead of rescanning per widget.
let monthIndex = null;
function ofMonth(month) {
  if (!monthIndex) {
    monthIndex = new Map();
    for (const t of state.transactions) {
      if (t.status === "SKIPPED" || !inMain(t)) continue;
      const m = t.date.slice(0, 7);
      if (!monthIndex.has(m)) monthIndex.set(m, []);
      monthIndex.get(m).push(t);
    }
  }
  return (monthIndex.get(month) || []).slice();
}
const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0));

/** Months a recurring template is active between from..to (inclusive). */
function activeMonths(r, from, to) {
  const start = r.startMonth > from ? r.startMonth : from;
  const end = r.endMonth && r.endMonth < to ? r.endMonth : to;
  const out = []; for (let m = start; m <= end; m = addMonths(m, 1)) out.push(m);
  return out;
}
/** Creates the PENDING occurrence of each fixed item for every month up to the current one. */
function ensureOccurrences() {
  const cur = currentMonth(); let changed = false;
  const existing = new Set(state.transactions.filter((t) => t.recurringId).map((t) => `${t.recurringId}:${t.period}`));
  for (const r of state.recurrings) {
    for (const m of activeMonths(r, r.startMonth, cur)) {
      if (existing.has(`${r.id}:${m}`)) continue;
      state.transactions.push({ id: uid(), type: r.type, description: r.description, amountCents: r.amountCents, date: occurrenceDate(m, r.dayOfMonth), status: "PENDING", categoryId: r.categoryId, source: "RECURRING", recurringId: r.id, period: m, notes: "", createdAt: Date.now() });
      changed = true;
    }
  }
  if (changed) save();
}
/** Future months are never stored: fixed items only appear as projections. */
function projected(month) {
  if (month <= currentMonth()) return [];
  return state.recurrings.filter((r) => activeMonths(r, month, month).length).map((r) => ({ type: r.type, amountCents: r.amountCents, recurringId: r.id, description: r.description, date: occurrenceDate(month, r.dayOfMonth), categoryId: r.categoryId }));
}

// ---------- Accounts (GitHub) ----------
// No server: each person's account lives in their own GitHub. Sign-up takes a GitHub access
// token (gist scope) and a password; the data, together with the token, is encrypted with
// AES-256-GCM (key from the password via PBKDF2) and stored in a gist of that person. The gist
// is public so that logging in on another device needs only GitHub username + password: anyone
// can download the file, but without the password it is unreadable ciphertext.
const SYNC_KEY = "minhas-financas:github";
const LOCAL_KEY = "minhas-financas:local";
const GIST_FILE = "minhas-financas.json";
const API = "https://api.github.com";
const PBKDF2_ITERATIONS = 310000;
const MIN_PASSWORD = 10;
let sync = loadSync();
let syncStatus = sync ? "ok" : "off"; // off | ok | saving | error
let pushTimer = null;
let pushing = false;

function loadSync() { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); } catch { return null; } }
function storeSync(value) { sync = value; try { value ? localStorage.setItem(SYNC_KEY, JSON.stringify(value)) : localStorage.removeItem(SYNC_KEY); } catch {} }
/** "Usar sem conta": data only in this browser. Older installs with data but no account count as local. */
function isLocalMode() {
  try { if (localStorage.getItem(LOCAL_KEY) === "1") return true; } catch {}
  return state.transactions.length > 0 || state.recurrings.length > 0;
}
function setLocalMode(on) { try { on ? localStorage.setItem(LOCAL_KEY, "1") : localStorage.removeItem(LOCAL_KEY); } catch {} }

function toB64(bytes) { let s = ""; const a = new Uint8Array(bytes); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); }

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
const importKey = (raw) => crypto.subtle.importKey("raw", fromB64(raw), "AES-GCM", false, ["encrypt", "decrypt"]);
const exportKey = async (key) => toB64(await crypto.subtle.exportKey("raw", key));
/** File format 2: { state, token } encrypted. Format 1 (older backups) held only the state. */
async function encryptState(key, salt, token) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify({ state, token })));
  return JSON.stringify({ app: "minhas-financas", format: 2, kdf: "PBKDF2-SHA256", iterations: PBKDF2_ITERATIONS, salt: toB64(salt), iv: toB64(iv), savedAt: state.savedAt || 0, data: toB64(data) });
}
async function decryptFile(file, key) {
  const plain = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(file.iv) }, key, fromB64(file.data))));
  const { state: data, token } = file.format >= 2 ? plain : { state: plain, token: null };
  if (!data || data.version !== 1 || !Array.isArray(data.transactions)) throw new Error("Arquivo de dados inválido.");
  return { data, token };
}

async function gh(path, token, options = {}) {
  let res;
  const headers = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(options.body ? { "Content-Type": "application/json" } : {}) };
  try { res = await fetch(API + path, { ...options, headers }); }
  catch { throw new Error("Sem conexão com o GitHub. Verifique a internet."); }
  if (res.status === 401) throw new Error("Código de acesso inválido ou expirado. Gere um novo no GitHub.");
  if (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0") throw new Error("Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.");
  if (res.status === 403) throw new Error("O código não tem permissão para gists. Gere um novo marcando a opção “gist”.");
  if (res.status === 404) throw Object.assign(new Error("Não encontrado no GitHub."), { notFound: true });
  if (!res.ok) throw new Error(`O GitHub respondeu com erro (${res.status}). Tente de novo em instantes.`);
  return res.json();
}
/** Reads our file from a gist object, following raw_url when GitHub truncates large content. */
async function readGistFile(gist) {
  const f = gist.files?.[GIST_FILE];
  if (!f) return null;
  const text = typeof f.content === "string" && !f.truncated ? f.content : await (await fetch(f.raw_url)).text();
  return JSON.parse(text);
}
const ownGist = (list) => list.find((g) => g.files && g.files[GIST_FILE] && g.public) || list.find((g) => g.files && g.files[GIST_FILE]);

function setSyncStatus(status) {
  syncStatus = status;
  const el = document.querySelector(".sync");
  if (el) el.outerHTML = syncBadge();
}
function syncBadge() {
  if (!sync) return "";
  const map = { ok: ["ok", "checkCircle", "Salvo no GitHub"], saving: ["", "cloud", "Salvando…"], error: ["err", "alert", "Erro ao salvar"] };
  const [cls, ic, txt] = map[syncStatus] || map.ok;
  return `<a class="sync ${cls}" href="${href("backup")}" title="${txt}" aria-label="${txt}">${icon(ic)}<span class="txt">${txt}</span></a>`;
}
function schedulePush() {
  if (!sync) return;
  clearTimeout(pushTimer);
  setSyncStatus("saving");
  pushTimer = setTimeout(pushNow, 1500);
}
async function pushNow() {
  if (!sync) return;
  clearTimeout(pushTimer); pushTimer = null;
  if (pushing) { pushTimer = setTimeout(pushNow, 800); return; }
  pushing = true; setSyncStatus("saving");
  try {
    const content = await encryptState(await importKey(sync.key), fromB64(sync.salt), sync.token);
    await gh(`/gists/${sync.gistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
    storeSync({ ...sync, lastPush: Date.now() });
    setSyncStatus("ok");
  } catch (e) {
    setSyncStatus("error");
    toast(e.message);
  } finally { pushing = false; }
}
/** On open / when the tab comes back: take the GitHub copy if it is newer (e.g. saved from the phone). */
async function pullIfNewer() {
  if (!sync || pushTimer || pushing) return;
  try {
    const file = await readGistFile(await gh(`/gists/${sync.gistId}`, sync.token));
    if (file && (file.savedAt || 0) > (state.savedAt || 0)) {
      replaceState((await decryptFile(file, await importKey(sync.key))).data);
      persist(); render(); toast("Dados atualizados com o que foi salvo no GitHub.");
    } else if (file && ((state.savedAt || 0) > (file.savedAt || 0) || (file.format || 1) < 2)) {
      pushNow();
    }
    setSyncStatus("ok");
  } catch (e) { setSyncStatus("error"); }
}

/** Login on any device: GitHub username + password. The token comes out of the decrypted file. */
async function logIn(username, password) {
  let gists;
  try { gists = await gh(`/users/${encodeURIComponent(username)}/gists?per_page=100`); }
  catch (e) { if (e.notFound) throw new Error("Usuário do GitHub não encontrado. Confira como ele aparece no seu perfil (github.com/usuario)."); throw e; }
  const found = ownGist(gists);
  if (!found) throw new Error(`Não encontramos uma conta do Minhas Finanças para @${username}. Use “Criar conta”.`);
  const file = await readGistFile(await gh(`/gists/${found.id}`));
  const salt = fromB64(file.salt), key = await deriveKey(password, salt);
  let opened;
  try { opened = await decryptFile(file, key); } catch { throw new Error("Usuário ou senha incorretos."); }
  if (!opened.token) throw new Error("Esta conta foi criada numa versão anterior. Use “Criar conta” uma vez, com o código de acesso e a mesma senha.");
  const user = await gh("/user", opened.token);
  return { settings: { token: opened.token, gistId: found.id, login: user.login, salt: file.salt, key: await exportKey(key) }, data: opened.data };
}

/** Sign-up: token + password. Reuses an existing file (same password) or creates the account gist. */
async function signUp(token, password) {
  const user = await gh("/user", token);
  const found = ownGist(await gh("/gists?per_page=100", token));
  if (found) {
    const file = await readGistFile(await gh(`/gists/${found.id}`, token));
    const key = await deriveKey(password, fromB64(file.salt));
    let opened;
    try { opened = await decryptFile(file, key); } catch { throw Object.assign(new Error(`Você já tem uma conta (@${user.login}). Entre com seu usuário e a senha que criou.`), { exists: true }); }
    const settings = { token, gistId: found.id, login: user.login, salt: file.salt, key: await exportKey(key) };
    if (found.public) return { settings, data: opened.data, existed: true };
    // Older secret backup: move it to a public account gist so username + password login works.
    replaceState(opened.data);
    const gist = await gh("/gists", token, { method: "POST", body: JSON.stringify({ description: "Minhas Finanças: dados criptografados (não apague)", public: true, files: { [GIST_FILE]: { content: await encryptState(key, fromB64(file.salt), token) } } }) });
    return { settings: { ...settings, gistId: gist.id }, data: opened.data, existed: true };
  }
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(password, salt);
  if (!state.savedAt) state.savedAt = Date.now();
  const gist = await gh("/gists", token, { method: "POST", body: JSON.stringify({ description: "Minhas Finanças: dados criptografados (não apague)", public: true, files: { [GIST_FILE]: { content: await encryptState(key, salt, token) } } }) });
  return { settings: { token, gistId: gist.id, login: user.login, salt: toB64(salt), key: await exportKey(key) }, data: null, existed: false };
}

// ---------- Receipt photos ----------
// Photos are shrunk on the device (max 1600px JPEG) and kept in IndexedDB. With an account, each
// one is also encrypted with the same key as the data and stored as its own file in a second gist
// ("comprovantes"), so the main data file stays small. Other devices download a photo only when it
// is opened, straight from the gist's raw URL.
const PHOTO_MAX_SIDE = 1600;
const photoDb = (() => {
  let opening;
  const open = () => (opening ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("minhas-financas", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction("photos", mode), req = fn(t.objectStore("photos"));
      t.oncomplete = () => resolve(req?.result);
      t.onerror = () => reject(t.error);
    });
  };
  return {
    get: (id) => run("readonly", (st) => st.get(id)),
    all: () => run("readonly", (st) => st.getAll()),
    put: (rec) => run("readwrite", (st) => st.put(rec)),
    del: (id) => run("readwrite", (st) => st.delete(id)),
    clear: () => run("readwrite", (st) => st.clear()),
  };
})();

async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}
/** Phone photo -> JPEG of at most 1600px (usually 150 to 400 KB). */
async function compressImage(file) {
  if (file.size > 30 * 1024 * 1024) throw new Error("Foto grande demais (máximo 30 MB).");
  if (file.type && !file.type.startsWith("image/")) throw new Error("Escolha uma foto (da câmera ou da galeria).");
  let img;
  try { img = await decodeImage(file); } catch { throw new Error("Não foi possível abrir essa imagem. Tente tirar a foto de novo."); }
  const w0 = img.width, h0 = img.height, scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(w0, h0));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w0 * scale); canvas.height = Math.round(h0 * scale);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.72));
  if (!blob) throw new Error("Não foi possível processar a foto.");
  return blob;
}

const photoFile = (id) => `${id}.bin`;
async function encryptPhoto(blob) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await importKey(sync.key), await blob.arrayBuffer()));
  const out = new Uint8Array(12 + data.length); out.set(iv); out.set(data, 12);
  return toB64(out);
}
async function decryptPhoto(text) {
  const bytes = fromB64(text.trim());
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, await importKey(sync.key), bytes.subarray(12));
  return new Blob([plain], { type: "image/jpeg" });
}

/** The photo as a Blob: from this device, or downloaded and decrypted from the user's gist. */
async function getPhoto(id) {
  try { const rec = await photoDb.get(id); if (rec) return rec.blob; } catch {}
  if (!sync || !state.photosGistId) return null;
  try {
    const res = await fetch(`https://gist.githubusercontent.com/${encodeURIComponent(sync.login)}/${state.photosGistId}/raw/${photoFile(id)}`);
    if (!res.ok) return null;
    const blob = await decryptPhoto(await res.text());
    photoDb.put({ id, blob, uploaded: true }).catch(() => {});
    return blob;
  } catch { return null; }
}

/** Sends photos not uploaded yet. Returns false if something could not be sent. */
let photoSync = null;
function syncPhotos() {
  if (!sync) return Promise.resolve(true);
  return (photoSync ||= (async () => {
    try {
      const pending = (await photoDb.all()).filter((r) => !r.uploaded);
      for (const rec of pending) {
        const files = { [photoFile(rec.id)]: { content: await encryptPhoto(rec.blob) } };
        if (!state.photosGistId) {
          const gist = await gh("/gists", sync.token, { method: "POST", body: JSON.stringify({ description: "Minhas Finanças: comprovantes criptografados (não apague)", public: true, files }) });
          state.photosGistId = gist.id; save();
        } else {
          await gh(`/gists/${state.photosGistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files }) });
        }
        await photoDb.put({ ...rec, uploaded: true });
      }
      return true;
    } catch (e) { toast(e.message || "Não foi possível enviar a foto ao GitHub."); return false; }

  })());
}
/** Removes a photo here and (best effort) from the gist. */
async function deletePhoto(id) {
  try { await photoDb.del(id); } catch {}
  if (sync && state.photosGistId) gh(`/gists/${state.photosGistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files: { [photoFile(id)]: null } }) }).catch(() => {});
}
async function clearPhotos() { try { await photoDb.clear(); } catch {} }

function viewPhoto(blob) {
  const url = URL.createObjectURL(blob), el = document.createElement("div");
  el.className = "viewer"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Comprovante");
  el.innerHTML = `<img src="${url}" alt="Foto do comprovante"><button type="button" class="icon-btn" aria-label="Fechar">${icon("x")}</button>`;
  el.addEventListener("click", () => { URL.revokeObjectURL(url); el.remove(); });
  document.body.appendChild(el);
}

// ---------- Reports ----------
function monthSummary(month) {
  const list = ofMonth(month), proj = projected(month);
  const s = (type, status) => sum(list.filter((t) => t.type === type && t.status === status));
  const incomePaid = s("INCOME", "PAID"), expensePaid = s("EXPENSE", "PAID");
  const incomePending = s("INCOME", "PENDING") + sum(proj.filter((p) => p.type === "INCOME"));
  const expensePending = s("EXPENSE", "PENDING") + sum(proj.filter((p) => p.type === "EXPENSE"));
  return { incomePaid, incomePending, expensePaid, expensePending, income: incomePaid + incomePending, expense: expensePaid + expensePending, forecast: incomePaid + incomePending - expensePaid - expensePending };
}
function splitExpenses(month) {
  const out = { fixedCents: 0, fixedCount: 0, fixedPaid: 0, variableCents: 0, variableCount: 0 };
  for (const t of ofMonth(month)) {
    if (t.type !== "EXPENSE") continue;
    if (t.recurringId) { out.fixedCents += t.amountCents; out.fixedCount++; if (t.status === "PAID") out.fixedPaid++; }
    else { out.variableCents += t.amountCents; out.variableCount++; }
  }
  for (const p of projected(month)) if (p.type === "EXPENSE") { out.fixedCents += p.amountCents; out.fixedCount++; }
  return out;
}
function expensesByCategory(month) {
  const map = new Map();
  for (const t of ofMonth(month)) if (t.type === "EXPENSE") map.set(t.categoryId || "", (map.get(t.categoryId || "") || 0) + t.amountCents);
  return [...map.entries()].map(([id, total]) => { const c = catById(id); return { id, name: c?.name || "Sem categoria", color: c?.color || "#94a3b8", total }; }).sort((a, b) => b.total - a.total);
}
function monthlySeries(month, count = 6) {
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const m = addMonths(month, -i), list = ofMonth(m);
    out.push({ month: m, income: sum(list.filter((t) => t.type === "INCOME")), expense: sum(list.filter((t) => t.type === "EXPENSE")) });
  }
  return out;
}
function budgetStatus(month) {
  const spent = new Map(expensesByCategory(month).map((c) => [c.id, c.total]));
  return state.budgets.map((b) => { const c = catById(b.categoryId); const s = spent.get(b.categoryId) || 0; return { ...b, name: c?.name || "Categoria removida", color: c?.color || "#94a3b8", spent: s, ratio: ratio(s, b.amountCents) }; }).filter((b) => catById(b.categoryId));
}

const AUTH_PAGES = ["entrar", "cadastro"];
function route() {

// ---------- Trips ----------
const tripTx = (id) => state.transactions.filter((t) => t.tripId === id && t.status !== "SKIPPED").sort(byDateDesc);
function tripTotals(trip) {
  const list = tripTx(trip.id), spent = sum(list.filter((t) => t.type === "EXPENSE")), refunds = sum(list.filter((t) => t.type === "INCOME"));
  const days = Math.max(1, Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1);
  return { list, spent, refunds, net: spent - refunds, days, perDay: Math.round((spent - refunds) / days) };
}
function tripStatus(trip) {
  const today = todayISO();
  if (today < trip.startDate) return ["Planejada", "b-neutral"];
  if (today > trip.endDate) return ["Concluída", "b-success"];
  return ["Em andamento", "b-warning"];
}
const tripDates = (trip) => {
  const y1 = trip.startDate.slice(0, 4), y2 = trip.endDate.slice(0, 4);
  return `${dayMonth(trip.startDate)}${y1 !== y2 ? ` de ${y1}` : ""} a ${dayMonth(trip.endDate)} de ${y2}`;
};
/** Painel: how much of this month went to trips that are kept apart. */
function tripNote(month) {
  const out = state.transactions.filter((t) => t.tripId && !inMain(t) && t.status !== "SKIPPED" && t.type === "EXPENSE" && t.date.slice(0, 7) === month);
  if (!out.length) return "";
  return `<a class="card trip-note" href="${href("viagens")}"><span class="chip" style="background:var(--c-high);color:var(--primary)">${icon("plane")}</span><span style="flex:1"><b>${fmt(sum(out))}</b> em gastos de viagem neste mês ficaram <b>separados</b> desta gestão.</span><span class="t-primary" style="display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap">Ver viagens ${icon("right", 'style="width:16px;height:16px"')}</span></a>`;
}

function viewViagens(r) {
  const id = r.params.get("id"), trip = id && tripById(id);
  if (trip) return viewTrip(trip);
  const trips = [...state.trips].sort((a, b) => (a.startDate < b.startDate ? 1 : -1));

  ${pageHead(`${esc(trip.name)} <span class="badge ${cls}" style="vertical-align:middle">${label}</span>`, `${trip.destination ? esc(trip.destination) + " · " : ""}${tripDates(trip)} · ${tot.days} ${tot.days === 1 ? "dia" : "dias"}`,
    `<button class="btn btn-secondary btn-sm" data-act="edit-trip" data-id="${trip.id}">${icon("edit")} Editar</button><button class="btn btn-primary btn-sm" data-act="new-trip-tx" data-id="${trip.id}">${icon("plusCircle")} Novo gasto da viagem</button>`)}
  <label class="card switch-card">

    <span class="switch"><input type="checkbox" data-trip-include="${trip.id}" ${trip.includeInMain ? "checked" : ""} aria-label="Somar os gastos desta viagem à gestão do mês"><span></span></span>
  </label>
  <div class="grid-3" style="margin:16px 0">
    ${metric({ label: "Total da viagem", ic: "plane", chip: "background:var(--c-high);color:var(--primary)", value: fmt(tot.net), pill: tot.refunds ? pill("background:var(--success-c);color:var(--success)", "down", `${fmt(tot.refunds)} de reembolsos`) : "" })}
    ${trip.budgetCents
      ? metric({ label: left >= 0 ? "Ainda pode gastar" : "Acima do orçamento", ic: "piggy", chip: "background:var(--tertiary-fixed);color:var(--on-tertiary-fixed)", value: fmt(Math.abs(left)), valueCls: left >= 0 ? "t-tertiary" : "t-danger", pill: pill("background:var(--c);color:var(--secondary)", "", `${fmtPct(r0)} de ${fmt(trip.budgetCents)}`), meter: { r: r0, color: r0 > 1 ? "var(--danger)" : r0 >= 0.8 ? "var(--warning)" : "var(--tertiary)" } })
      : metric({ label: "Orçamento", ic: "piggy", chip: "background:var(--c);color:var(--secondary)", value: "Sem limite", pill: `<button class="pill" style="border:0;background:var(--c-high);color:var(--primary);cursor:pointer" data-act="edit-trip" data-id="${trip.id}">Definir orçamento</button>` })}
    ${metric({ label: "Média por dia", ic: "calendar", chip: "background:var(--secondary-c);color:var(--on-secondary-c)", value: fmt(tot.perDay), cls: "span2" })}
  </div>
  <div class="grid-main">
    <section class="card card-flush">
      <div class="section-head"><div><h2 class="h-card">Gastos da viagem</h2><p class="sub">${tot.list.length} ${tot.list.length === 1 ? "lançamento" : "lançamentos"}</p></div></div>
      ${tot.list.length ? `${listHead(true)}<ul class="ledger">${tot.list.map((t) => ledgerRow(t, { toggle: true, inTrip: true })).join("")}</ul>` : `<div style="padding:20px"><p class="empty">Nenhum gasto lançado nesta viagem.</p></div>`}

}

function deleteTripDialog(trip) {
  const n = tripTx(trip.id).length;
  openModal({
    title: `Excluir "${esc(trip.name)}"?`,
    body: n ? `<p class="muted">Esta viagem tem ${n} ${n === 1 ? "lançamento" : "lançamentos"}. O que fazer com ${n === 1 ? "ele" : "eles"}?</p>` : `<p class="muted">A viagem não tem lançamentos.</p>`,
    foot: `<button type="button" class="btn btn-secondary btn-sm" data-act="close">Cancelar</button>${n ? `<button type="button" class="btn btn-secondary btn-sm" id="trip-keep">Excluir só a viagem (gastos vão para a gestão)</button>` : ""}<button type="button" class="btn btn-danger btn-sm" id="trip-all">${n ? "Excluir viagem e gastos" : "Excluir"}</button>`,
  });
  const finish = (keep) => {
    for (const t of tripTx(trip.id)) {
      if (keep) t.tripId = null;
      else if (t.attachmentId) deletePhoto(t.attachmentId);
    }
    if (!keep) state.transactions = state.transactions.filter((t) => t.tripId !== trip.id);
    state.trips = state.trips.filter((x) => x.id !== trip.id);
    save(); closeModal(); location.hash = href("viagens"); render(); toast("Viagem excluída.");
  };
  document.getElementById("trip-all").onclick = () => finish(false);
  document.getElementById("trip-keep")?.addEventListener("click", () => finish(true));
}

const VIEWS = { painel: viewPainel, lancamentos: viewLancamentos, fixos: viewFixos, orcamentos: viewOrcamentos, viagens: viewViagens, categorias: viewCategorias, importar: viewImportar, backup: viewBackup };
function render() {
  // Fixed items only need materializing after a change to them, a data swap or a new month.
  if (needsOccurrences || occurrencesMonth !== currentMonth()) {
    ensureOccurrences();
    needsOccurrences = false;
    occurrencesMonth = currentMonth();
  }
  monthIndex = null;
  captureIncoming();
  let r = route();
  // Logged in: the auth pages lead to the app. Not logged in and not "sem conta": show the login.
  if (AUTH_PAGES.includes(r.path) && sync) { history.replaceState(null, "", href("painel")); r = route(); }
  if (!AUTH_PAGES.includes(r.path) && !sync && !isLocalMode()) { history.replaceState(null, "", href("entrar")); r = route(); }
  if (AUTH_PAGES.includes(r.path)) {
    document.getElementById("app").innerHTML = viewAuth(r.path);
    document.title = `${r.path === "entrar" ? "Entrar" : "Criar conta"} · Minhas Finanças`;
    return;
  }
  document.getElementById("app").innerHTML = shell(r, VIEWS[r.path](r));
  if (hasIncoming()) flushIncoming();
  document.title = `${ROUTES.find((x) => x.path === r.path).label} · Minhas Finanças`;
}

  clearTimeout(toastTimer);

}
function showErrors(errors, root = document.getElementById("modal")) {

const moneyInput = (name, cents) => `<div class="money"><span>R$</span><input class="input" id="f-${name}" name="${name}" inputmode="decimal" placeholder="0,00" value="${cents ? centsToInput(cents) : ""}"></div>`;
const catSelect = (type, sel, name = "categoryId") => `<select class="input" id="f-${name}" name="${name}"><option value="">Sem categoria</option>${state.categories.filter((c) => c.type === type).sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`;

        if (Object.keys(errors).length) return showErrors(errors);

}

// ---------- Native app (Capacitor) ----------
// mobile/ bundles this same file into the Android/iOS app. Everything below only switches on there;
// in a browser NATIVE is false and the site behaves as before.
const NATIVE = !!window.Capacitor?.isNativePlatform?.();
// Native plugins are reachable only through Capacitor.registerPlugin, which comes from capacitor.js; the app copy
// loads it (mobile/scripts/copy-web.mjs). Only plugins the app actually ships (PluginHeaders) are registered.
const NativePlugins = {};
if (NATIVE) {
  const cap = window.Capacitor, register = cap.registerPlugin || window.capacitorExports?.registerPlugin;
  const shipped = new Set((cap.PluginHeaders || []).map((h) => h.name));
  for (const name of ["App", "Browser", "Filesystem", "Share", "SpeechRecognition"]) {
    if (register && shipped.has(name)) NativePlugins[name] = register(name);
  }
}

// The app's WebView has no SpeechRecognition, so the native plugin stands in with the same small interface.
// Partial results show the words while the person speaks, but the Android plugin has two quirks in that mode:
// it reports "stopped" before the final text, and its errors (nothing heard, no network) never reach us because
// start() already resolved. So: wait a moment after "stopped" for the final text, stop by ourselves after a
// silence, and always end within a hard limit, so the button never stays on "Ouvindo".
const SPEECH_SILENCE_MS = 2500;      // quiet after the last words: done
const SPEECH_NOTHING_MS = 7000;      // no words at all since the start: give up
const SPEECH_FINAL_GRACE_MS = 1500;  // after stopping, wait this long for the final text
class NativeSpeech {
  start() {
    const P = NativePlugins.SpeechRecognition, handles = [];
    let heard = false, stopping = false, quiet = 0, grace = 0;
    this._end = () => {
      if (this._ended) return;
      this._ended = true; clearTimeout(quiet); clearTimeout(grace);
      handles.forEach((h) => h.remove?.());
      P.stop().catch(() => {});
      this.onend?.();
    };
    // Ends shortly after stopping; a final text arriving meanwhile ends it sooner.
    this._finishSoon = (ms = SPEECH_FINAL_GRACE_MS) => { stopping = true; clearTimeout(quiet); clearTimeout(grace); grace = setTimeout(() => this._end(), ms); };
    const waitQuiet = () => { clearTimeout(quiet); quiet = setTimeout(() => this.stop(), heard ? SPEECH_SILENCE_MS : SPEECH_NOTHING_MS); };
    (async () => {
      try {
        const perm = await P.requestPermissions();
        if (perm.speechRecognition !== "granted") { this.onerror?.({ error: "not-allowed" }); return this._end(); }
        handles.push(await P.addListener("partialResults", (d) => {
          const t = d.matches?.[0];
          if (!t || this._aborted || this._ended) return;
          heard = true;
          this.onresult?.({ results: [[{ transcript: t }]] });
          if (stopping) this._finishSoon(400); else waitQuiet();
        }));
        handles.push(await P.addListener("listeningState", (d) => {
          if (d.status === "stopped" && !stopping) this._finishSoon();
        }));
        await P.start({ language: "pt-BR", maxResults: 1, partialResults: true, popup: false });
        if (!this._ended) waitQuiet();
      } catch (e) {
        const msg = String(e?.message || e);
        this.onerror?.({ error: /permission/i.test(msg) ? "not-allowed" : /network/i.test(msg) ? "network" : /audio/i.test(msg) ? "audio-capture" : "no-speech" });
        this._end();
      }
    })();
  }
  stop() {
    if (this._ended) return;
    NativePlugins.SpeechRecognition.stop().catch(() => {});
    this._finishSoon?.();
  }
  abort() { this._aborted = true; this._end?.(); }
}

// App updates: CI publishes every Android build as the pre-release "app-latest", with "<!-- build:N -->" in its
// notes. On open and on return to the app (at most once an hour) we compare N with the installed versionCode.
const APP_RELEASE_API = "https://api.github.com/repos/gabrielmacsantos/sistema_gestao/releases/tags/app-latest";
const UPDATE_KEY = "mf-app-update";
const UPDATE_EVERY = 3600 * 1000;
let appUpdate = null; // { build, url, notes } while a newer build is waiting

function readUpdateState() { try { return JSON.parse(localStorage.getItem(UPDATE_KEY) || "{}"); } catch { return {}; } }
function writeUpdateState(s) { try { localStorage.setItem(UPDATE_KEY, JSON.stringify(s)); } catch {} }

async function checkAppUpdate() {
  if (!NATIVE || !NativePlugins.App?.getInfo) return;
  const info = await NativePlugins.App.getInfo().catch(() => null);
  const installed = Number(info?.build) || 0;
  let s = readUpdateState();
  if (!s.checkedAt || Date.now() - s.checkedAt > UPDATE_EVERY) {
    try {
      const res = await fetch(APP_RELEASE_API, { headers: { Accept: "application/vnd.github+json" } });
      if (res.ok) {
        const rel = await res.json(), body = rel.body || "";
        const url = (rel.assets || []).find((a) => a.name === "minhas-financas.apk")?.browser_download_url;
        const notes = body.split("\n").filter((l) => /^- /.test(l)).slice(0, 5).map((l) => l.slice(2).trim());
        s = { ...s, checkedAt: Date.now(), build: Number(/build:(\d+)/.exec(body)?.[1]) || 0, url, notes };
        writeUpdateState(s);
      }
    } catch { /* offline: try again next time */ }
  }
  const next = s.build > installed && s.url && s.dismissed !== s.build ? { build: s.build, url: s.url, notes: s.notes || [] } : null;
  if ((next?.build || 0) !== (appUpdate?.build || 0)) { appUpdate = next; render(); }
}
function updateBanner() {
  if (!appUpdate) return "";
  return `<div class="notice" style="margin-bottom:16px"><span class="t-primary" style="display:flex">${icon("down")}</span>
    <div style="flex:1;min-width:180px"><p><b>Nova versão do app disponível</b></p>${appUpdate.notes.length ? `<ul class="hint" style="margin:4px 0 0;padding-left:18px">${appUpdate.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
    <span class="actions"><button class="btn btn-ghost btn-sm" data-act="update-later">Agora não</button><button class="btn btn-primary btn-sm" data-act="update-app">Atualizar</button></span></div>`;
}

  document.addEventListener("click", (e) => {

    if (!a || !/^https?:/.test(a.href) || a.origin === location.origin) return;

}

// ---------- Voice entry ----------
// The browser's speech service (Google in Chrome/Android, Apple in Safari) turns the audio into text;
// parseSpokenTransaction only fills the form, and nothing is saved until the user taps Salvar.
// In the app always the native plugin: the Android WebView exposes webkitSpeechRecognition, but it never hears anything.
const SpeechRec = NATIVE
  ? (NativePlugins.SpeechRecognition ? NativeSpeech : null)
  : window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICE_OK_KEY = "mf-voice-ok";
const VOICE_ERRORS = {
  "not-allowed": NATIVE
    ? "O microfone está bloqueado. Libere em Configurações → Apps → Minhas Finanças → Permissões."
    : "O microfone está bloqueado. Libere o acesso nas configurações do navegador.",
  "service-not-allowed": "O reconhecimento de voz está bloqueado neste navegador.",
  "audio-capture": "Nenhum microfone encontrado neste aparelho.",
  "network": "O reconhecimento de voz precisa de internet.",
  "language-not-supported": "Este navegador não reconhece fala em português.",
};
let voice = null; // { rec, text, error } while listening
let voiceUi = { mode: "idle", text: "" }; // idle | consent | listening | done

function renderVoiceSlot() {
  const slot = document.getElementById("voice-slot"); if (!slot) return;
  const { mode, text } = voiceUi;
  if (mode === "consent") {
    slot.innerHTML = `<div class="voice-note"><p><b>Antes de falar:</b> quem transforma sua fala em texto é o serviço de voz do navegador (Google no Chrome e no Android, Apple no Safari), que recebe o áudio. Os campos são só preenchidos: nada é salvo sem você conferir.</p>
      <div class="actions"><button type="button" class="btn btn-secondary btn-sm" data-act="voice-cancel">Agora não</button><button type="button" class="btn btn-primary btn-sm" data-act="voice-accept">${icon("mic")} Entendi, falar</button></div></div>`;
    return;
  }
  const listening = mode === "listening";
  const hint = listening ? text || "Fale o gasto, o valor e quando foi…" : mode === "done" ? `Ouvi: “${text}”. Confira os campos antes de salvar.` : "Ex.: “gastei 52,30 no mercado ontem”";
  slot.innerHTML = `<button type="button" class="voice-btn ${listening ? "on" : ""}" data-act="voice" aria-pressed="${listening}">${icon("mic")}<span><b>${listening ? "Ouvindo… toque para parar" : mode === "done" ? "Falar de novo" : "Falar o lançamento"}</b><span class="hint voice-text">${esc(hint)}</span></span></button>`;
}

function voiceButton() {
  if (voice) { try { voice.rec.stop(); } catch {} return; }
  let ok = false; try { ok = localStorage.getItem(VOICE_OK_KEY) === "1"; } catch {}
  if (ok) startVoice(); else { voiceUi = { mode: "consent", text: "" }; renderVoiceSlot(); }
}

function startVoice() {
  let rec;
  try { rec = new SpeechRec(); } catch { return toast("Não foi possível usar o microfone neste navegador."); }
  rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  const session = { rec, text: "", error: "" };
  rec.onresult = (e) => {
    if (voice !== session) return;
    session.text = Array.from(e.results, (r) => r[0].transcript).join(" ").replace(/\s+/g, " ").trim();
    const el = document.querySelector("#voice-slot .voice-text"); if (el) el.textContent = session.text;
  };
  rec.onerror = (e) => { session.error = e.error; };
  rec.onend = () => { if (voice === session) { voice = null; finishVoice(session); } };
  voice = session;
  voiceUi = { mode: "listening", text: "" }; renderVoiceSlot();
  try { rec.start(); } catch { voice = null; voiceUi = { mode: "idle", text: "" }; renderVoiceSlot(); toast("Não foi possível usar o microfone neste navegador."); }
}

// Ends listening without filling anything (form closed or type switched by hand).
function stopVoice() {
  if (!voice) return;
  const s = voice; voice = null; voiceUi = { mode: "idle", text: "" };
  try { s.rec.abort(); } catch {}
}

function finishVoice(session) {
  if (!document.getElementById("voice-slot")) return;
  if (!session.text) {
    voiceUi = { mode: "idle", text: "" }; renderVoiceSlot();
    if (session.error !== "aborted") toast(VOICE_ERRORS[session.error] || "Não ouvi nada. Toque no microfone e fale de novo.");
    return;
  }
  const p = parseSpokenTransaction(session.text, state.categories, todayISO());
  voiceUi = { mode: "done", text: session.text };
  if (p.type !== txForm.getType()) txForm.setType(p.type); else renderVoiceSlot();
  const fill = (name, value) => {
    const el = document.querySelector(`#modal [name="${name}"]`); if (!el || value == null) return;
    el.value = value; el.classList.add("voice-filled"); el.removeAttribute("aria-invalid");
    el.closest(".field")?.querySelector(".err")?.remove();
  };
  fill("description", p.description);
  fill("amount", p.amountCents ? centsToInput(p.amountCents) : null);
  fill("date", p.date);
  fill("categoryId", p.categoryId);
  fill("status", p.status);
}

async function submitAuth(form) {
  const page = form.dataset.page, v = Object.fromEntries(new FormData(form).entries()), errors = {};

  if (page === "entrar") {
    if (!/^[a-z\d](?:[a-z\d-]{0,38})$/i.test(v.username.trim().replace(/^@/, ""))) errors.username = "Informe seu usuário do GitHub (o nome que aparece em github.com/usuario).";
    if (!v.password) errors.password = "Informe sua senha.";
  } else {
    if (!/^(ghp_|github_pat_|gho_)\w{20,}$/.test(v.token.trim())) errors.token = "Cole o código completo gerado no GitHub (começa com ghp_).";
    if (v.password.length < MIN_PASSWORD) errors.password = `Use pelo menos ${MIN_PASSWORD} caracteres.`;
    else if (v.password !== v.password2) errors.password2 = "As senhas não são iguais.";
  }
  if (Object.keys(errors).length) return showErrors(errors, form);
  const label = btn.textContent; btn.disabled = true; btn.textContent = page === "entrar" ? "Entrando…" : "Criando conta…";
  try {
    if (page === "entrar") {

// ---------- Import (OFX / CSV) ----------
function decodeFile(buffer) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
  catch { return new TextDecoder("windows-1252").decode(buffer); }
}
function hashString(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }

const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function parseOfx(text) {
  const tag = (block, name) => { const m = block.match(new RegExp(`<${name}>([^<\\r\\n]*)`, "i")); return m ? m[1].trim() : null; };
  const account = tag(text, "ACCTID") || "";
  return text.split(/<STMTTRN>/i).slice(1).flatMap((raw) => {
    const block = raw.split(/<\/STMTTRN>/i)[0], amount = parseMoneyToCents(tag(block, "TRNAMT") || ""), posted = tag(block, "DTPOSTED") || "";
    if (amount === null || amount === 0 || !/^\d{8}/.test(posted)) return [];
    const date = `${posted.slice(0, 4)}-${posted.slice(4, 6)}-${posted.slice(6, 8)}`, fitid = tag(block, "FITID");
    return [{ type: amount < 0 ? "EXPENSE" : "INCOME", description: (tag(block, "MEMO") || tag(block, "NAME") || "Lançamento importado").slice(0, 120), amountCents: Math.abs(amount), date: isDate(date) ? date : "", externalId: fitid ? `ofx:${account}:${fitid}` : null }];
  });
}
function splitCsv(text) {
  const firstLine = text.split(/\r?\n/)[0] || "", delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') quoted = false; else cell += ch; }
    else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); if (row.some((c) => c.trim())) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); if (row.some((c) => c.trim())) rows.push(row);
  return rows;
}
function parseCsv(text, signMode) {
  const [headers, ...rows] = splitCsv(text.replace(/^﻿/, ""));
  if (!headers) throw new Error("Arquivo vazio.");
  const find = (cands) => { const h = headers.map(norm); const e = h.findIndex((x) => cands.includes(x)); return e >= 0 ? e : h.findIndex((x) => cands.some((c) => x.startsWith(c))); };
  const dc = find(["data", "date", "data lancamento", "data da compra"]), sc = find(["descricao", "description", "historico", "lancamento", "title", "estabelecimento", "memo"]), vc = find(["valor", "amount", "valor (r$)", "value"]);
  if (dc < 0 || sc < 0 || vc < 0) throw new Error("Não encontramos as colunas de data, descrição e valor. Use um cabeçalho como: Data;Descrição;Valor");
  const seen = new Map();
  return rows.flatMap((row) => {
    const amount = parseMoneyToCents(row[vc] || ""), description = (row[sc] || "").trim().slice(0, 120);
    if (amount === null || amount === 0 || !description) return [];
    const v = (row[dc] || "").trim(), br = v.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    let date = br ? `${br[3]}-${br[2]}-${br[1]}` : /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : "";
    if (!isDate(date)) date = "";
    const isExpense = signMode === "negative-expense" ? amount < 0 : amount > 0;
    const base = `${date}|${amount}|${norm(description)}`, occ = (seen.get(base) || 0) + 1; seen.set(base, occ);
    return [{ type: isExpense ? "EXPENSE" : "INCOME", description, amountCents: Math.abs(amount), date, externalId: `csv:${hashString(`${base}|${occ}`)}` }];

}
async function handleImportFile(file) {
  if (!file) return;
  if ((file.type && /^image\/|pdf$/.test(file.type)) || /\.(jpe?g|png|heic|heif|webp|pdf)$/i.test(file.name)) {
    return toast("Isso é uma foto ou PDF. Para guardar um comprovante, abra o lançamento e use “Anexar comprovante”. Aqui entram só extratos .ofx ou .csv.");
  }
  if (file.size > 5 * 1024 * 1024) return toast("Arquivo grande demais (máximo 5 MB).");
  try {
    const text = decodeFile(await file.arrayBuffer());
    const isOfx = /\.ofx$/i.test(file.name) || /<OFX>/i.test(text);
    const drafts = isOfx ? parseOfx(text) : parseCsv(text, document.getElementById("signmode")?.value || "negative-expense");
    if (!drafts.length) return toast("Nenhuma transação encontrada no arquivo.");
    const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
    importInboxIds = null;
    importDrafts = drafts.map((d) => ({ ...d, categoryId: "", duplicate: !!(d.externalId && known.has(d.externalId)), include: !(d.externalId && known.has(d.externalId)) }));
    render();
  } catch (e) { toast(e.message || "Não foi possível ler o arquivo."); }
}
function confirmImport() {
  const chosen = importDrafts.filter((d) => d.include);
  const bad = chosen.findIndex((d) => !d.description.trim() || !(d.amountCents > 0) || !isDate(d.date));
  if (bad >= 0) return toast(`Confira a linha ${importDrafts.indexOf(chosen[bad]) + 1}: descrição, valor e data são obrigatórios.`);
  const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
  let added = 0, ignored = 0;
  for (const d of chosen) {
    if (d.externalId && known.has(d.externalId)) { ignored++; continue; }
    state.transactions.push({ id: uid(), type: d.type, description: d.description.trim(), amountCents: d.amountCents, date: d.date, status: "PAID", categoryId: d.categoryId || null, source: d.source || "BANK_IMPORT", externalId: d.externalId, recurringId: null, period: null, notes: "", createdAt: Date.now() });
    if (d.externalId) known.add(d.externalId); added++;
  }
  if (importInboxIds) { const done = new Set(importInboxIds); state.inbox = state.inbox.filter((x) => !done.has(x.id)); }
  save(); importDrafts = null; importInboxIds = null;
  location.hash = href("lancamentos", { mes: chosen[0]?.date.slice(0, 7) });
  render();
  toast(`${added} lançamento(s) importado(s)${ignored ? `, ${ignored} já existiam` : ""}.`);
}

// ---------- Bank notifications ----------
// They arrive pasted on the Importar page or through "#/notificacao?t=<text>" opened by an automation app
// (MacroDroid on Android, Atalhos on iPhone). Linked ones wait in state.inbox; everything goes through the review.
const INCOMING_KEY = "mf-incoming";
const notifKey = (e) => `notif:${hashString(`${norm(e.text)}|${e.date}`)}`;
const dayDiff = (a, b) => Math.round((Date.parse(`${a}T00:00:00Z`) - Date.parse(`${b}T00:00:00Z`)) / 86400000);

function notificationDrafts(entries) {
  const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
  const live = state.transactions.filter((t) => t.status !== "SKIPPED");
  const seen = new Set(), drafts = [];
  for (const e of entries) {
    const key = notifKey(e);
    if (seen.has(key)) continue;
    seen.add(key);
    const p = parseBankNotification(e.text, e.date);
    if (p.kind === "IGNORE") continue;
    const type = p.kind || "EXPENSE", already = known.has(key);
    // Same value and kind within a day: probably already typed by hand or imported from the statement.
    const same = (t) => t.type === type && t.amountCents === p.amountCents && Math.abs(dayDiff(t.date, p.date)) <= 1;
    // Also against the other notifications in this review: the wallet and the card's bank both notify one purchase.
    const near = !already && !!p.amountCents && (live.some(same) || drafts.some(same));
    drafts.push({
      type, description: p.description || e.text.slice(0, 120), amountCents: p.amountCents || 0, date: p.date,
      categoryId: p.description ? parseSpokenTransaction.guessCategory(p.description, state.categories, type) || "" : "",
      externalId: key, source: "NOTIFICATION", original: e.text,
      duplicate: already, maybeDuplicate: near, unclear: !p.kind, cardBill: p.cardBill,
      include: !already && !near && !!p.kind && !p.cardBill,
    });
  }
  return drafts;
}
function readPastedNotifications() {
  const entries = splitNotifications(document.getElementById("notif-text")?.value || "", todayISO());
  if (!entries.length) return toast("Cole o texto de pelo menos uma notificação.");
  const drafts = notificationDrafts(entries);
  if (!drafts.length) return toast("Nenhum lançamento encontrado: eram avisos de saldo, fatura ou código.");
  importInboxIds = null; importDrafts = drafts; render(); window.scrollTo(0, 0);
}
function reviewInbox() {
  if (!state.inbox.length) return;
  importInboxIds = state.inbox.map((x) => x.id);
  importDrafts = notificationDrafts(state.inbox);
  if (route().path !== "importar") location.hash = href("importar");
  render(); window.scrollTo(0, 0);
}

// "#/notificacao?t=..." -> kept in sessionStorage until the user is in and the latest data was pulled.
function captureIncoming() {
  const h = location.hash;
  if (!/^#\/?notificacao\b/.test(h)) return;
  const i = h.indexOf("?t="), raw = i < 0 ? "" : h.slice(i + 3);
  let text = raw;
  try { text = decodeURIComponent(raw.replace(/\+/g, " ")); } catch { /* sent without encoding */ }
  history.replaceState(null, "", href("importar"));
  if (!text.trim()) return;
  try { sessionStorage.setItem(INCOMING_KEY, joinIncoming(sessionStorage.getItem(INCOMING_KEY), text)); }
  catch { pendingIncoming = joinIncoming(pendingIncoming, text); }
}
let pendingIncoming = "", flushingIncoming = false;
const joinIncoming = (a, b) => (a ? `${a}\n---\n${b}` : b);
function takeIncoming() {
  let text = pendingIncoming; pendingIncoming = "";
  try { const s = sessionStorage.getItem(INCOMING_KEY); if (s) { text = joinIncoming(text, s); sessionStorage.removeItem(INCOMING_KEY); } } catch {}
  return text;
}
function hasIncoming() {
  if (pendingIncoming) return true;
  try { return !!sessionStorage.getItem(INCOMING_KEY); } catch { return false; }
}
async function flushIncoming() {
  if (flushingIncoming || !hasIncoming() || !(sync || isLocalMode())) return;
  flushingIncoming = true;
  try {
    // Pull first so saving the inbox never overwrites what another device saved meanwhile.
    await pullIfNewer();
    const text = takeIncoming(); if (!text) return;
    const known = new Set([...state.inbox.map(notifKey), ...state.transactions.map((t) => t.externalId).filter(Boolean)]);
    let added = 0;
    for (const e of splitNotifications(text, todayISO())) {
      const key = notifKey(e);
      // Balances, bill reminders and codes never become transactions, so they do not wait in the queue.
      if (known.has(key) || parseBankNotification(e.text, e.date).kind === "IGNORE") continue;
      known.add(key); state.inbox.push({ id: uid(), text: e.text, date: e.date, at: Date.now() }); added++;
    }
    if (!added) { render(); return toast("Nada novo: a notificação já estava na fila, já foi lançada ou era só aviso (saldo, fatura, código)."); }
    save(); reviewInbox();
    toast(`${added} ${added === 1 ? "notificação recebida" : "notificações recebidas"}. Confira e confirme.`);
  } finally { flushingIncoming = false; }
}

    "wipe": () => confirmDialog("Apagar todos os dados?", `Todos os lançamentos, fixos, orçamentos e metas serão removidos.${sync ? " Os dados salvos na sua conta do GitHub também serão apagados." : ""} Essa ação não pode ser desfeita.`, "Apagar tudo", () => {
      if (sync && state.photosGistId) gh(`/gists/${state.photosGistId}`, sync.token, { method: "DELETE" }).catch(() => {});
      clearPhotos(); replaceState(emptyState()); save(); location.hash = href("painel"); toast("Dados apagados."); }),
  };
  if (actions[act]) { e.preventDefault(); actions[act](); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "modal") { e.preventDefault(); modalSubmit?.(); }
  else if (e.target.id === "auth-form") { e.preventDefault(); submitAuth(e.target); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.querySelector(".overlay")) closeModal(); });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.tripInclude) {
    const trip = tripById(t.dataset.tripInclude); trip.includeInMain = t.checked; save(); render();
    toast(t.checked ? "Os gastos desta viagem agora entram na gestão do mês." : "Os gastos desta viagem ficam separados da gestão do mês.");
  } else if (t.dataset.filter) {
    const r = route(), p = Object.fromEntries(r.params.entries()); p[t.dataset.filter] = t.value; p.mes = r.month;
    location.hash = href("lancamentos", p);
  } else if (t.id === "file") handleImportFile(t.files[0]);
  else if (t.id === "photo-input") {
    const file = t.files[0]; t.value = ""; if (!file) return;
    const slot = document.getElementById("photo-slot"); if (slot) slot.innerHTML = `<p class="hint">Preparando a foto…</p>`;
    compressImage(file).then((blob) => { formPhoto.blob = blob; formPhoto.removed = false; renderPhotoSlot(); })
      .catch((err) => { toast(err.message); renderPhotoSlot(); });
  }
  else if (t.id === "restore") {
    const file = t.files[0]; if (!file) return;
    file.text().then((text) => {
      const data = JSON.parse(text);
      if (!data || data.version !== 1 || !Array.isArray(data.transactions) || !Array.isArray(data.categories)) throw new Error();
      confirmDialog("Restaurar backup?", `O arquivo tem ${data.transactions.length} lançamentos. Os dados atuais deste navegador serão substituídos.`, "Restaurar", () => { replaceState(data); save(); toast("Backup restaurado."); });
    }).catch(() => toast("Arquivo de backup inválido."));
  } else if (t.dataset.draft !== undefined) {
    const d = importDrafts[Number(t.dataset.draft)], k = t.dataset.k;
    if (k === "include") d.include = t.checked;
    else if (k === "amount") { const c = parseMoneyToCents(t.value); d.amountCents = c === null ? 0 : Math.abs(c); }
    else if (k === "type") { d.type = t.value; d.categoryId = ""; }
    else d[k] = t.value;
    if (k === "include" || k === "type") render();
  }
});
document.addEventListener("input", (e) => { const t = e.target; if (t.dataset.draft !== undefined && t.dataset.k === "description") importDrafts[Number(t.dataset.draft)].description = t.value; });
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleImportFile(e.dataTransfer.files[0]); } });
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });
window.addEventListener("storage", (e) => { if (e.key === KEY) { replaceState(load()); render(); } });

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullIfNewer(); else if (pushTimer) pushNow(); });
window.addEventListener("beforeunload", (e) => { if (pushTimer || pushing) { pushNow(); e.preventDefault(); e.returnValue = ""; } });

render();
pullIfNewer();
checkAppUpdate();
</script>
</body>
</html>
