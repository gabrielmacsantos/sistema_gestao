<style>
/* ===== Sovereign Financial design tokens (Design-google/sovereign_financial/DESIGN.md) ===== */
:root {
  --bg: #f8f9ff; --surface: #f8f9ff; --card: #ffffff;
  --c-low: #eff4ff; --c: #e5eeff; --c-high: #dce9ff; --c-highest: #d3e4fe;
  --on: #0b1c30; --on-var: #3d4947; --outline: #6d7a77; --outline-var: #bcc9c6;
  --hairline: rgb(226 232 240 / .8); --scrim: rgb(15 23 42 / .35);
  --primary: #00685f; --on-primary: #fff; --primary-c: #008378; --on-primary-c: #f4fffc;
  --primary-fixed: #89f5e7; --on-primary-fixed: #00201d;
  --secondary: #565e74; --secondary-c: #dae2fd; --on-secondary-c: #5c647a;
  --tertiary: #006947; --on-tertiary: #fff; --tertiary-c: #00855b; --tertiary-fixed: #6ffbbe; --on-tertiary-fixed: #002113;
  --success: #059669; --success-c: #ecfdf5; --warning: #d97706; --warning-c: #fffbeb; --danger: #e11d48; --danger-c: #fff1f2;
  --chart-in: #059669; --chart-out: #94a3b8; --chart-grid: #e2e8f0;
  --shadow: 0 1px 2px rgb(15 23 42 / .05);
  --shadow-3: 0 20px 25px -5px rgb(15 23 42 / .06), 0 8px 10px -6px rgb(15 23 42 / .04);
  --font: "Inter", ui-sans-serif, system-ui, sans-serif;
  --display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
  --rail: 260px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #0e1626; --card: #111a2b;
  --c-low: #152035; --c: #1a273d; --c-high: #203049; --c-highest: #273a56;
  --on: #e6edf8; --on-var: #b4c2c0; --outline: #8a9896; --outline-var: #34455e;
  --hairline: rgb(52 69 94 / .7); --scrim: rgb(2 6 23 / .6);
  --primary: #6bd8cb; --on-primary: #00201d; --primary-c: #4fc3b6; --on-primary-c: #00201d;
  --primary-fixed: #005049; --on-primary-fixed: #89f5e7;
  --secondary: #a9b3cc; --secondary-c: #2a3550; --on-secondary-c: #c6cee6;
  --tertiary: #4edea3; --on-tertiary: #002113; --tertiary-c: #3cc58e; --tertiary-fixed: #005236; --on-tertiary-fixed: #6ffbbe;
  --success: #34d399; --success-c: rgb(16 185 129 / .14); --warning: #fbbf24; --warning-c: rgb(245 158 11 / .14);
  --danger: #fb7185; --danger-c: rgb(225 29 72 / .16);
  --chart-in: #34d399; --chart-out: #64748b; --chart-grid: #233149;
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--on); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--primary-fixed); color: var(--on-primary-fixed); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.t-income { color: var(--success); } .t-danger { color: var(--danger); } .t-warning { color: var(--warning); } .t-primary { color: var(--primary); } .t-tertiary { color: var(--tertiary); }

/* ===== Shell ===== */
.rail { display: none; position: fixed; inset: 0 auto 0 0; width: 80px; z-index: 30; background: var(--card); border-right: 1px solid var(--hairline); padding: 16px; flex-direction: column; justify-content: space-between; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; justify-content: center; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-c); color: var(--on-primary-c); flex: none; box-shadow: var(--shadow); }
.brand-text { display: none; min-width: 0; }
.brand-name { font: 700 18px/24px var(--display); letter-spacing: -.01em; color: var(--primary); }
.brand-sub { font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; color: var(--secondary); }
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; }
.nav a { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border-radius: 8px; color: var(--secondary); font-weight: 600; transition: background .15s, color .15s; }
.nav a:hover { background: var(--c-low); color: var(--on); }
.nav a.active { background: var(--c-high); color: var(--primary); }
.nav .lbl { display: none; }
.rail .btn-new { margin-top: 24px; width: 100%; padding: 0; }
.rail .btn-new .lbl { display: none; }
.rail-foot { border-top: 1px solid var(--hairline); padding-top: 16px; margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
.page { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); }
.topbar-in { max-width: 1280px; margin: 0 auto; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.trail { display: none; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--secondary); }
.trail b { color: var(--primary); font-weight: 600; }
.mob-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mob-brand .brand-logo { width: 36px; height: 36px; border-radius: 10px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--hairline); background: transparent; color: var(--secondary); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--c-low); color: var(--on); }
main { width: 100%; max-width: 1280px; margin: 0 auto; flex: 1; padding: 24px 16px 112px; }
.bottomnav { position: fixed; inset: auto 0 0 0; z-index: 40; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--hairline); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgb(15 23 42 / .06); }
.bottomnav ul { list-style: none; margin: 0; padding: 0 4px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .02em; color: var(--secondary); }
.bottomnav a.active { color: var(--primary); }
.bottomnav svg.i { width: 22px; height: 22px; }
.fab { display: grid !important; place-items: center; width: 52px; height: 52px; margin: -20px auto 4px; border-radius: 999px; background: var(--primary); color: var(--on-primary) !important; box-shadow: 0 6px 16px rgb(0 104 95 / .35); border: 4px solid var(--card); padding: 0 !important; }
.fab svg.i { width: 24px !important; height: 24px !important; }

@media (min-width: 768px) {
  .rail { display: flex; }
  .page { padding-left: 80px; }
  .bottomnav, .mob-only { display: none !important; }
  .topbar-in { padding: 0 24px; }
  main { padding: 24px 24px 40px; }
}
@media (min-width: 1024px) {
  .rail { width: var(--rail); }
  .page { padding-left: var(--rail); }
  .brand { justify-content: flex-start; }
  .brand-text, .nav .lbl, .rail .btn-new .lbl { display: block; }
  .nav a { justify-content: flex-start; padding: 10px 12px; }
  .rail .btn-new { padding: 0 16px; }
  .trail { display: flex; }
  .mob-brand { display: none; }
  .topbar-in { padding: 0 40px; }
  main { padding: 24px 40px 40px; }
}
@media (max-width: 767px) { .desk-only { display: none !important; } }

/* ===== Components ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 14px; letter-spacing: .01em; white-space: nowrap; transition: background .15s, transform .15s, color .15s; }
.btn:active { transform: scale(.99); }
.btn:focus-visible, .icon-btn:focus-visible, .nav a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 12px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }
.btn-primary:hover { background: var(--primary-c); }
.btn-income { background: var(--tertiary); color: var(--on-tertiary); box-shadow: var(--shadow); }
.btn-income:hover { background: var(--tertiary-c); }
.btn-secondary { background: var(--card); border-color: color-mix(in srgb, var(--outline-var) 60%, transparent); color: var(--on); }
.btn-secondary:hover { background: var(--c-low); }
.btn-ghost { background: transparent; color: var(--secondary); }
.btn-ghost:hover { background: var(--c-low); color: var(--on); }
.btn-danger { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .6; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.h-page { font-size: 22px; line-height: 28px; letter-spacing: -.015em; }
.h-card { font-size: 18px; line-height: 24px; letter-spacing: -.01em; }
.sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--secondary); }
.page-head { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
.page-head .desc { margin-top: 2px; color: var(--secondary); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (min-width: 640px) {
  .page-head { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .h-page { font-size: 28px; line-height: 36px; letter-spacing: -.02em; }
}
.stack { display: flex; flex-direction: column; gap: 24px; }
.stack > .page-head { margin-bottom: 0; }
.grid-kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-kpi > .span2 { grid-column: span 2; }
.grid-3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 > .span2 { grid-column: span 2; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 640px) { .grid-kpi, .grid-3 { gap: 16px; } }
@media (min-width: 1024px) {
  .grid-kpi { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .grid-kpi > .span2, .grid-3 > .span2 { grid-column: auto; }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.metric { display: flex; flex-direction: column; justify-content: space-between; }
.metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.metric-label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .02em; color: var(--secondary); }
.chip { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.metric-value { margin-top: 12px; font: 700 22px/28px var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 2px 8px; border-radius: 999px; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.pill svg.i { width: 12px; height: 12px; }
.meter { margin-top: 12px; height: 6px; border-radius: 999px; background: var(--c-high); overflow: hidden; }
.meter > div { height: 100%; border-radius: 999px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.badge.nodot::before { display: none; }
.b-success { background: var(--success-c); color: var(--success); }
.b-warning { background: var(--warning-c); color: var(--warning); }
.b-neutral { background: var(--c); color: var(--secondary); }
.cat { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 8px; border-radius: 999px; background: var(--c); color: var(--secondary); font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; }
.dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
.empty { border: 1px dashed var(--outline-var); border-radius: 12px; padding: 24px; text-align: center; color: var(--secondary); }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); background: var(--warning-c); }
.insight { display: flex; gap: 10px; margin-top: 24px; padding: 16px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--c-low); color: var(--on-var); }
.month { display: inline-flex; align-items: center; gap: 4px; padding: 2px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--card); }
.month a { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--secondary); }
.month a:hover { background: var(--c-low); color: var(--on); }
.month span { min-width: 150px; text-align: center; font-weight: 600; }
.seg { display: inline-flex; align-items: center; padding: 4px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface); font-size: 12px; font-weight: 500; }
.seg a { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; color: var(--secondary); }
.seg a.on { background: var(--card); color: var(--primary); font-weight: 600; box-shadow: var(--shadow); }
.seg a:hover:not(.on) { color: var(--on); }

/* Ledger */
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border-bottom: 1px solid var(--c-low); }
.ledger li:last-child { border-bottom: 0; }
.ledger li.income { background: color-mix(in srgb, var(--success-c) 45%, transparent); }
.ledger .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.ledger .row-main:hover .row-title { color: var(--primary); }
.row-icon { position: relative; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex: none; overflow: hidden; }
.row-icon::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .12; }
.row-title { font-weight: 600; transition: color .15s; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--secondary); }
.row-cat { display: none; width: 180px; }
.row-date { display: none; width: 72px; color: var(--on-var); }
.row-status { display: none; width: 96px; }
.row-amount { text-align: right; flex: none; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-amount small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--secondary); }
@media (min-width: 768px) {
  .ledger li { min-height: 56px; }
  .row-cat, .row-date, .row-status { display: block; }
  .row-amount { width: 130px; }
  .row-amount small, .row-meta .m-mob { display: none; }
}
.toggle { width: 28px; height: 28px; border-radius: 999px; border: 2px solid var(--outline-var); background: transparent; color: transparent; display: grid; place-items: center; flex: none; transition: all .15s; }
.toggle:hover { border-color: var(--primary); }
.toggle.on { border-color: var(--success); background: var(--success); color: #fff; }
.toggle svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
.list-head { display: none; }
@media (min-width: 768px) {
  .list-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--hairline); font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--secondary); }
}
.section-head { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-bottom: 1px solid var(--hairline); }
@media (min-width: 640px) { .section-head { flex-direction: row; align-items: center; justify-content: space-between; } }
.section-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--secondary); }

/* Chart */
.flow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 16px 0; }
@media (min-width: 640px) { .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.flow > div { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface); }
.flow > div.hl { background: var(--c-low); }
.flow b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { position: relative; height: 224px; }
.chart-grid { position: absolute; inset: 0 0 40px 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.chart-grid div { border-top: 1px solid var(--chart-grid); }
.chart-cols { position: relative; display: flex; height: 100%; gap: 6px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 2px 0; border-radius: 12px; }
.chart-col.cur { background: var(--c-low); }
.bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.bars div { width: 14px; border-radius: 3px 3px 0 0; }
.chart-lbl { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .02em; color: var(--secondary); text-align: center; }
.chart-lbl span:first-child { text-transform: capitalize; }
.chart-col.cur .chart-lbl { color: var(--primary); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.dist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.dist-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.bar { height: 8px; border-radius: 999px; background: var(--c-high); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; list-style: none; }
.hscroll > li { flex: none; width: 168px; scroll-snap-align: start; }
@media (min-width: 768px) { .hscroll { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; overflow: visible; } .hscroll > li { width: auto; } }
@media (min-width: 1024px) { .hscroll { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fixed-card { display: flex; flex-direction: column; gap: 4px; width: 100%; height: 100%; text-align: left; background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }

function parseMoneyToCents(input) {
  let s = String(input ?? "").replace(/R\$|\s| /g, "").trim();

async function encryptState(key, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(state)));
  return JSON.stringify({ app: "minhas-financas", format: 1, kdf: "PBKDF2-SHA256", iterations: PBKDF2_ITERATIONS, salt: toB64(salt), iv: toB64(iv), savedAt: state.savedAt || 0, data: toB64(data) });
}
async function decryptFile(file, key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(file.iv) }, key, fromB64(file.data));
  const data = JSON.parse(new TextDecoder().decode(plain));
  if (!data || data.version !== 1 || !Array.isArray(data.transactions)) throw new Error("Backup inválido.");
  return data;
}

async function gh(path, token, options = {}) {
  let res;
  try {
    res = await fetch(API + path, { ...options, headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "X-GitHub-Api-Version": "2022-11-28", ...(options.body ? { "Content-Type": "application/json" } : {}) } });
  } catch { throw new Error("Sem conexão com o GitHub. Verifique a internet."); }
  if (res.status === 401) throw new Error("Código de acesso inválido ou expirado. Gere um novo no GitHub.");
  if (res.status === 403 || res.status === 404) throw new Error("O código não tem permissão para gists. Gere um novo marcando a opção “gist”.");
  if (!res.ok) throw new Error(`O GitHub respondeu com erro (${res.status}). Tente de novo em instantes.`);
  return res.json();
}
/** Reads our file from a gist object, following raw_url when GitHub truncates large content. */
async function readGistFile(gist) {
  const f = gist.files?.[GIST_FILE];
  if (!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(text);
}

function setSyncStatus(status) {
  syncStatus = status;
  const el = document.querySelector(".sync");
  if (el) el.outerHTML = syncBadge();
}
function syncBadge() {
  if (!sync) return "";
  const map = { ok: ["ok", "checkCircle", "Salvo no GitHub"], saving: ["", "cloud", "Salvando…"], error: ["err", "alert", "Erro ao salvar"] };
  const [cls, ic, txt] = map[syncStatus] || map.ok;
  return `<a class="sync ${cls}" href="${href("backup")}" title="${txt}" aria-label="${txt}">${icon(ic)}<span class="txt">${txt}</span></a>`;
}
function schedulePush() {
  if (!sync) return;
  clearTimeout(pushTimer);
  setSyncStatus("saving");
  pushTimer = setTimeout(pushNow, 1500);
}
async function pushNow() {
  if (!sync) return;
  clearTimeout(pushTimer); pushTimer = null;
  if (pushing) { pushTimer = setTimeout(pushNow, 800); return; }
  pushing = true; setSyncStatus("saving");
  try {
    const content = await encryptState(await importKey(sync.key), fromB64(sync.salt));
    await gh(`/gists/${sync.gistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
    storeSync({ ...sync, lastPush: Date.now() });
    setSyncStatus("ok");
  } catch (e) {
    setSyncStatus("error");
    toast(e.message);
  } finally { pushing = false; }
}
/** On open / when the tab comes back: take the GitHub copy if it is newer (e.g. saved from the phone). */
async function pullIfNewer() {
  if (!sync || pushTimer || pushing) return;
  try {
    const file = await readGistFile(await gh(`/gists/${sync.gistId}`, sync.token));
    if (file && (file.savedAt || 0) > (state.savedAt || 0)) {
      replaceState(await decryptFile(file, await importKey(sync.key)));
      persist(); render(); toast("Dados atualizados com o backup do GitHub.");
    } else if (file && (state.savedAt || 0) > (file.savedAt || 0)) {
      pushNow();
    }
    setSyncStatus("ok");
  } catch (e) { setSyncStatus("error"); }
}

/** Connects with a token + password. Finds the existing backup or creates a new secret gist. */
async function connectGitHub(token, password) {
  const user = await gh("/user", token);
  const gists = await gh("/gists?per_page=100", token);
  const found = gists.find((g) => g.files && g.files[GIST_FILE]);
  if (found) {
    const file = await readGistFile(await gh(`/gists/${found.id}`, token));
    const salt = fromB64(file.salt), key = await deriveKey(password, salt);
    let remote;
    try { remote = await decryptFile(file, key); } catch { throw new Error("Senha incorreta para o backup que já existe no GitHub."); }
    const settings = { token, gistId: found.id, login: user.login, salt: file.salt, key: toB64(await crypto.subtle.exportKey("raw", key)) };
    return { settings, remote, remoteSavedAt: file.savedAt || 0 };
  }
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(password, salt);
  if (!state.savedAt) state.savedAt = Date.now();
  const content = await encryptState(key, salt);
  const gist = await gh("/gists", token, { method: "POST", body: JSON.stringify({ description: "Backup criptografado do Minhas Finanças (não edite)", public: false, files: { [GIST_FILE]: { content } } }) });
  return { settings: { token, gistId: gist.id, login: user.login, salt: toB64(salt), key: toB64(await crypto.subtle.exportKey("raw", key)) }, remote: null };
}

// ---------- Reports ----------
function monthSummary(month) {
  const list = ofMonth(month), proj = projected(month);
  const s = (type, status) => sum(list.filter((t) => t.type === type && t.status === status));
  const incomePaid = s("INCOME", "PAID"), expensePaid = s("EXPENSE", "PAID");
  const incomePending = s("INCOME", "PENDING") + sum(proj.filter((p) => p.type === "INCOME"));
  const expensePending = s("EXPENSE", "PENDING") + sum(proj.filter((p) => p.type === "EXPENSE"));
  return { incomePaid, incomePending, expensePaid, expensePending, income: incomePaid + incomePending, expense: expensePaid + expensePending, forecast: incomePaid + incomePending - expensePaid - expensePending };
}
function splitExpenses(month) {
  const out = { fixedCents: 0, fixedCount: 0, fixedPaid: 0, variableCents: 0, variableCount: 0 };
  for (const t of ofMonth(month)) {
    if (t.type !== "EXPENSE") continue;
    if (t.recurringId) { out.fixedCents += t.amountCents; out.fixedCount++; if (t.status === "PAID") out.fixedPaid++; }
    else { out.variableCents += t.amountCents; out.variableCount++; }
  }
  for (const p of projected(month)) if (p.type === "EXPENSE") { out.fixedCents += p.amountCents; out.fixedCount++; }
  return out;
}
function expensesByCategory(month) {
  const map = new Map();
  for (const t of ofMonth(month)) if (t.type === "EXPENSE") map.set(t.categoryId || "", (map.get(t.categoryId || "") || 0) + t.amountCents);
  return [...map.entries()].map(([id, total]) => { const c = catById(id); return { id, name: c?.name || "Sem categoria", color: c?.color || "#94a3b8", total }; }).sort((a, b) => b.total - a.total);
}
function monthlySeries(month, count = 6) {
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const m = addMonths(month, -i), list = ofMonth(m);
    out.push({ month: m, income: sum(list.filter((t) => t.type === "INCOME")), expense: sum(list.filter((t) => t.type === "EXPENSE")) });
  }
  return out;
}
function budgetStatus(month) {
  const spent = new Map(expensesByCategory(month).map((c) => [c.id, c.total]));
  return state.budgets.map((b) => { const c = catById(b.categoryId); const s = spent.get(b.categoryId) || 0; return { ...b, name: c?.name || "Categoria removida", color: c?.color || "#94a3b8", spent: s, ratio: ratio(s, b.amountCents) }; }).filter((b) => catById(b.categoryId));
}

// ---------- Router ----------
const ROUTES = [
  { path: "painel", label: "Painel", icon: "dashboard" },
  { path: "lancamentos", label: "Lançamentos", icon: "receipt" },
  { path: "fixos", label: "Gastos fixos", icon: "calendar" },
  { path: "orcamentos", label: "Orçamentos", icon: "piggy" },
  { path: "categorias", label: "Categorias", icon: "tag" },
  { path: "importar", label: "Importar extrato", icon: "upload" },
  { path: "backup", label: "Backup", icon: "save" },
];
function route() {
  const [p, q] = location.hash.replace(/^#\/?/, "").split("?");
  const params = new URLSearchParams(q || "");
  const path = ROUTES.some((r) => r.path === p) ? p : "painel";
  const mes = params.get("mes");
  return { path, params, month: isMonth(mes) ? mes : currentMonth() };
}
function href(path, params = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v));
  return `#/${path}${q.toString() ? "?" + q : ""}`;
}

        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--hairline);color:var(--secondary)">
          <span style="display:flex;align-items:center;gap:6px">${icon("trendUp", 'style="width:16px;height:16px"')} Taxa de poupança de <b class="t-income">${fmtPct(ratio(Math.max(s.forecast, 0), s.income))}</b> no mês.</span>

        ${s.expense > 0 ? `<div class="insight" style="margin-top:auto;margin-top:24px"><span class="t-primary" style="display:flex">${icon("bulb")}</span><p>Seus custos fixos representam <b class="t-primary">${fmtPct(ratio(split.fixedCents, s.expense))}</b> das saídas. ${s.forecast > 0 ? `Você ainda pode gastar até <b class="t-primary">${fmt(s.forecast)}</b> sem fechar o mês no negativo.` : "O mês está previsto para fechar no negativo."}</p></div>` : ""}

function viewLancamentos(r) {
  const m = r.month, tipo = r.params.get("tipo") || "", status = r.params.get("status") || "", cat = r.params.get("categoria") || "";
  let list = ofMonth(m);
  if (tipo === "despesas") list = list.filter((t) => t.type === "EXPENSE");
  if (tipo === "receitas") list = list.filter((t) => t.type === "INCOME");
  if (status === "pendentes") list = list.filter((t) => t.status === "PENDING");
  if (cat) list = list.filter((t) => t.categoryId === cat);
  list.sort(byDateDesc);
  const inc = sum(list.filter((t) => t.type === "INCOME")), exp = sum(list.filter((t) => t.type === "EXPENSE")), pen = sum(list.filter((t) => t.status === "PENDING"));
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`;
  return `${pageHead("Lançamentos", "Despesas e receitas do mês. Toque no círculo para marcar como pago.",
    `<button class="btn btn-income btn-sm" data-act="new-tx" data-type="INCOME">${icon("down")} Nova entrada</button><button class="btn btn-primary btn-sm" data-act="new-tx">${icon("plusCircle")} Novo gasto</button>`)}
  <div class="grid-3" style="margin-bottom:16px">
    ${metric({ label: "Entradas", ic: "down", chip: "background:var(--success-c);color:var(--success)", value: fmt(inc), valueCls: "t-income" })}
    ${metric({ label: "Saídas", ic: "up", chip: "background:var(--c-high);color:var(--primary)", value: fmt(exp) })}
    ${metric({ label: "Pendente", ic: "clock", chip: "background:var(--warning-c);color:var(--warning)", value: fmt(pen), valueCls: pen ? "t-warning" : "", cls: "span2" })}
  </div>
  <section class="card card-flush">
    <div class="section-head" style="padding:16px">
      ${monthPicker("lancamentos", m, { tipo, status, categoria: cat })}
      <div class="actions" style="display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:560px" id="filters">
        <select class="input input-sm" data-filter="tipo" aria-label="Tipo">${opt("", "Todos os tipos", tipo)}${opt("despesas", "Saídas", tipo)}${opt("receitas", "Entradas", tipo)}</select>
        <select class="input input-sm" data-filter="status" aria-label="Status">${opt("", "Todos os status", status)}${opt("pendentes", "Pendentes", status)}</select>
        <select class="input input-sm" data-filter="categoria" aria-label="Categoria" style="grid-column:1/-1">${opt("", "Todas as categorias", cat)}${state.categories.map((c) => opt(c.id, `${c.name} (${c.type === "EXPENSE" ? "despesa" : "receita"})`, cat)).join("")}</select>
      </div>
    </div>
    ${list.length ? `${listHead(true)}<ul class="ledger">${list.map((t) => ledgerRow(t, { toggle: true })).join("")}</ul>` : `<div style="padding:20px"><p class="empty">Nenhum lançamento em ${monthLabel(m).toLowerCase()}.</p></div>`}
  </section>`;
}

function viewFixos() {
  const cur = currentMonth(), active = state.recurrings.filter((x) => !x.endMonth || x.endMonth >= cur), ended = state.recurrings.filter((x) => x.endMonth && x.endMonth < cur);
  const total = (type) => sum(active.filter((x) => x.type === type && x.startMonth <= cur));
  const row = (x) => { const c = catById(x.categoryId); return `<li><button class="row-main" data-act="edit-rec" data-id="${x.id}">
    <span class="chip" style="background:var(--c-low);color:var(--primary);flex-direction:column;width:40px;height:40px;line-height:1"><span style="font-size:9px;color:var(--secondary)">dia</span><b>${x.dayOfMonth}</b></span>
    <span style="flex:1;min-width:0"><span class="row-title truncate" style="display:block">${esc(x.description)}</span><span class="row-meta">${c ? catChip(c) : ""}<span>desde ${monthShort(x.startMonth)}/${x.startMonth.slice(2, 4)}${x.endMonth ? ` até ${monthShort(x.endMonth)}/${x.endMonth.slice(2, 4)}` : " · sem fim"}</span></span></span>
    <span class="row-amount ${x.type === "INCOME" ? "t-income" : ""}">${x.type === "INCOME" ? "+ " : ""}${fmt(x.amountCents)}</span></button></li>`; };
  return `${pageHead("Gastos e receitas fixos", "Cada item gera automaticamente um lançamento pendente por mês, a partir do mês em que foi cadastrado.", `<button class="btn btn-primary btn-sm" data-act="new-rec">${icon("plus")} Novo fixo</button>`)}
  <div class="grid-3" style="margin-bottom:16px">
    ${metric({ label: "Despesas fixas/mês", ic: "lock", chip: "background:var(--secondary-c);color:var(--on-secondary-c)", value: fmt(total("EXPENSE")) })}
    ${metric({ label: "Receitas fixas/mês", ic: "down", chip: "background:var(--success-c);color:var(--success)", value: fmt(total("INCOME")), valueCls: "t-income" })}
  </div>
  ${state.recurrings.length ? `<section class="card card-flush"><ul class="ledger">${active.map(row).join("") || `<li><span class="muted">Nenhum fixo ativo.</span></li>`}</ul></section>
  ${ended.length ? `<section class="card card-flush" style="margin-top:16px"><div class="section-head"><h2 class="h-card">Encerrados</h2></div><ul class="ledger">${ended.map(row).join("")}</ul></section>` : ""}`
  : `<p class="empty">Nenhum gasto fixo cadastrado. Comece pelo aluguel, contas e assinaturas.</p>`}`;
}

function viewOrcamentos(r) {
  const m = r.month, budgets = budgetStatus(m);
  return `${pageHead("Orçamentos e metas", "Defina um limite mensal por categoria (alerta a partir de 80%) e acompanhe suas metas de economia.")}
  <div class="grid-2">
    <section class="card">
      <div class="card-head"><h2 class="h-card">Orçamento do mês</h2>${monthPicker("orcamentos", m)}</div>
      ${budgets.length ? `<ul class="dist">${budgets.map((b) => { const tone = b.ratio > 1 ? "var(--danger)" : b.ratio >= 0.8 ? "var(--warning)" : "var(--primary)"; return `<li>
        <div class="dist-row" style="align-items:center"><span style="display:flex;align-items:center;gap:8px;font-weight:600;min-width:0"><span class="dot" style="background:${esc(b.color)}"></span><span class="truncate">${esc(b.name)}</span></span>
        <span class="actions"><button class="btn btn-ghost btn-sm" data-act="edit-budget" data-id="${b.id}" aria-label="Editar">${icon("edit")}</button><button class="btn btn-ghost btn-sm" data-act="del-budget" data-id="${b.id}" aria-label="Remover">${icon("trash")}</button></span></div>
        <div class="bar" role="meter" aria-valuenow="${Math.round(clamp01(b.ratio) * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(b.name)}"><div style="width:${clamp01(b.ratio) * 100}%;background:${tone}"></div></div>
        <p class="hint" style="margin-top:6px">${fmt(b.spent)} de ${fmt(b.amountCents)}${b.ratio >= 0.8 ? ` · <b style="color:${tone}">${b.ratio > 1 ? "estourado" : Math.round(b.ratio * 100) + "% usado"}</b>` : ""}</p></li>`; }).join("")}</ul>` : `<p class="empty">Nenhum limite definido.</p>`}
      <button class="btn btn-primary btn-sm" style="margin-top:16px" data-act="new-budget">${icon("plus")} Definir limite</button>
    </section>
    <section class="card">
      <div class="card-head"><h2 class="h-card">Metas de economia</h2><button class="btn btn-primary btn-sm" data-act="new-goal">${icon("target")} Nova meta</button></div>
      ${state.goals.length ? `<ul class="dist">${state.goals.map((g) => { const rr = ratio(g.savedCents, g.targetCents); return `<li>
        <div class="dist-row" style="align-items:center"><span style="font-weight:600;min-width:0" class="truncate">${esc(g.name)}</span><span class="actions"><button class="btn btn-secondary btn-sm" data-act="deposit-goal" data-id="${g.id}">${icon("plus")} Guardar</button><button class="btn btn-ghost btn-sm" data-act="edit-goal" data-id="${g.id}" aria-label="Editar">${icon("edit")}</button></span></div>

        <p class="hint" style="margin-top:6px">${fmt(g.savedCents)} de ${fmt(g.targetCents)} · ${fmtPct(clamp01(rr))}${g.deadline ? ` · até ${formatDate(g.deadline)}` : ""}${rr >= 1 ? ' · <b class="t-income">meta atingida 🎉</b>' : ""}</p></li>`; }).join("")}</ul>` : `<p class="empty">Nenhuma meta ainda. Que tal uma reserva de emergência?</p>`}
    </section>
  </div>`;
}

function viewCategorias() {
  const group = (type, title) => `<section class="card card-flush"><div class="section-head"><h2 class="h-card">${title}</h2><button class="btn btn-secondary btn-sm" data-act="new-cat" data-type="${type}">${icon("plus")} Nova</button></div>
    <ul class="ledger">${state.categories.filter((c) => c.type === type).sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<li><button class="row-main" data-act="edit-cat" data-id="${c.id}"><span class="dot" style="background:${esc(c.color)};width:14px;height:14px"></span><span class="row-title" style="flex:1">${esc(c.name)}</span><span class="muted">${icon("edit")}</span></button></li>`).join("") || `<li class="muted">Nenhuma categoria.</li>`}</ul></section>`;
  return `${pageHead("Categorias", "Organize despesas e receitas. Ao excluir uma categoria, os lançamentos ficam sem categoria.")}
  <div class="grid-2">${group("EXPENSE", "Despesas")}${group("INCOME", "Receitas")}</div>`;
}

  if (importDrafts) return viewReview();
  return `${pageHead("Importar extrato", "Traga as transações do seu banco (OFX ou CSV). Você revisa tudo antes de salvar.")}
  <section class="card" style="max-width:720px">
    <label class="drop" id="drop" for="file">
      <span class="chip" style="background:var(--c-high);color:var(--primary);width:44px;height:44px">${icon("upload")}</span>
      <b>Clique para escolher ou arraste o arquivo aqui</b>
      <span class="hint">Arquivos .ofx (recomendado) ou .csv exportados do internet banking</span>
    </label>
    <input type="file" id="file" accept=".ofx,.csv,.txt" hidden />
    <div class="field" style="margin-top:16px">
      <label for="signmode">Para arquivos CSV, como os valores estão?</label>
      <select class="input" id="signmode"><option value="negative-expense">Extrato de conta: saídas são negativas</option><option value="positive-expense">Fatura de cartão: compras são positivas</option></select>
      <span class="hint">O CSV precisa ter colunas de data, descrição e valor (ex.: Data;Descrição;Valor).</span>
    </div>
  </section>

}
function viewReview() {
  const cats = (type, sel) => `<option value="">Sem categoria</option>` + state.categories.filter((c) => c.type === type).map((c) => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  const n = importDrafts.filter((d) => d.include).length;
  return `${pageHead("Revisar importação", `${importDrafts.length} transações encontradas. Confira, ajuste e confirme.`, `<button class="btn btn-ghost btn-sm" data-act="cancel-import">Cancelar</button><button class="btn btn-primary btn-sm" data-act="confirm-import">${icon("check")} Importar ${n} selecionada(s)</button>`)}
  <section class="card card-flush"><div style="overflow-x:auto"><table class="review"><thead><tr><th></th><th>Descrição</th><th>Valor</th><th>Data</th><th>Tipo</th><th>Categoria</th></tr></thead><tbody>
  ${importDrafts.map((d, i) => `<tr class="${d.include ? "" : "off"}">
    <td><input type="checkbox" data-draft="${i}" data-k="include" ${d.include ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--primary)" aria-label="Importar"></td>
    <td style="min-width:200px"><input class="input input-sm" data-draft="${i}" data-k="description" value="${esc(d.description)}">${d.duplicate ? '<span class="badge b-warning" style="margin-top:4px">já importado</span>' : ""}</td>
    <td style="min-width:120px"><input class="input input-sm num" data-draft="${i}" data-k="amount" value="${centsToInput(d.amountCents)}" inputmode="decimal"></td>
    <td style="min-width:150px"><input class="input input-sm" type="date" data-draft="${i}" data-k="date" value="${esc(d.date || "")}"></td>
    <td style="min-width:120px"><select class="input input-sm" data-draft="${i}" data-k="type"><option value="EXPENSE" ${d.type === "EXPENSE" ? "selected" : ""}>Saída</option><option value="INCOME" ${d.type === "INCOME" ? "selected" : ""}>Entrada</option></select></td>
    <td style="min-width:160px"><select class="input input-sm" data-draft="${i}" data-k="categoryId">${cats(d.type, d.categoryId)}</select></td>
  </tr>`).join("")}
  </tbody></table></div></section>`;
}

function viewBackup() {
  const n = state.transactions.filter((t) => t.status !== "SKIPPED").length;
  const last = sync?.lastPush ? new Date(sync.lastPush).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : null;
  const github = sync
    ? `<section class="card" style="grid-column:1/-1;border-color:color-mix(in srgb,var(--success) 35%,transparent)">
        <div class="card-head" style="margin-bottom:8px"><h2 class="h-card" style="display:flex;align-items:center;gap:8px">${icon("github")} Salvo no GitHub</h2><span class="badge ${syncStatus === "error" ? "b-warning" : "b-success"}">${syncStatus === "error" ? "Erro no último envio" : syncStatus === "saving" ? "Salvando…" : "Conectado"}</span></div>
        <p class="muted">Conta <b>@${esc(sync.login)}</b>. Cada alteração é criptografada com a sua senha e salva automaticamente num Gist secreto.${last ? ` Último envio: ${esc(last)}.` : ""}</p>
        <p class="hint" style="margin-top:6px">Em outro aparelho ou depois de limpar o navegador, abra o site, clique em <b>Entrar com meu GitHub</b> e informe o código de acesso e a senha. Em computador compartilhado, use <b>Sair desta conta</b> ao terminar.</p>
        <div class="actions" style="margin-top:16px"><button class="btn btn-primary btn-sm" data-act="push-now">${icon("cloud")} Salvar agora</button><button class="btn btn-ghost btn-sm" data-act="logout">Sair desta conta</button></div>
      </section>`
    : `<section class="card welcome" style="grid-column:1/-1">
        <h2 class="h-card" style="display:flex;align-items:center;gap:8px">${icon("github")} Salvar no GitHub</h2>
        <p class="muted" style="margin:6px 0 16px">Guarde uma cópia <b>criptografada com sua senha</b> na sua conta do GitHub. Ela é atualizada sozinha a cada alteração e permite recuperar tudo se você limpar o navegador, além de usar no celular e no computador.</p>
        <button class="btn btn-primary" data-act="connect">${icon("github")} ${state.transactions.length || state.recurrings.length ? "Conectar ao GitHub" : "Entrar com meu GitHub"}</button>
      </section>`;
  return `${pageHead("Backup e dados", "Por padrão, seus dados ficam só neste navegador. Conecte ao GitHub para não perder nada.")}
  <div class="grid-2">
    ${github}
    <section class="card"><h2 class="h-card">Exportar</h2><p class="muted" style="margin:6px 0 16px">Baixa um arquivo .json com tudo: ${n} lançamentos, ${state.recurrings.length} fixos, ${state.categories.length} categorias, orçamentos e metas.</p><button class="btn btn-primary" data-act="export">${icon("save")} Baixar backup</button></section>
    <section class="card"><h2 class="h-card">Restaurar</h2><p class="muted" style="margin:6px 0 16px">Carrega um backup exportado antes. <b>Substitui</b> os dados atuais deste navegador.</p><label class="btn btn-secondary" for="restore">${icon("upload")} Escolher arquivo</label><input type="file" id="restore" accept=".json,application/json" hidden></section>
    <section class="card"><h2 class="h-card">Dados de exemplo</h2><p class="muted" style="margin:6px 0 16px">Preenche 6 meses de lançamentos fictícios para você explorar o sistema.</p><button class="btn btn-secondary" data-act="demo">${icon("sparkles")} Carregar exemplo</button></section>
    <section class="card"><h2 class="h-card">Apagar tudo</h2><p class="muted" style="margin:6px 0 16px">Remove todos os dados deste navegador e recomeça do zero.</p><button class="btn btn-danger" data-act="wipe">${icon("trash")} Apagar dados</button></section>
  </div>
  ${storageOk ? "" : `<p class="alert" style="margin-top:16px">O navegador não está permitindo salvar (modo privado?). Exporte um backup antes de fechar.</p>`}`;
}

const VIEWS = { painel: viewPainel, lancamentos: viewLancamentos, fixos: viewFixos, orcamentos: viewOrcamentos, categorias: viewCategorias, importar: viewImportar, backup: viewBackup };
function render() {
  // Fixed items only need materializing after a change to them, a data swap or a new month.
  if (needsOccurrences || occurrencesMonth !== currentMonth()) {
    ensureOccurrences();
    needsOccurrences = false;
    occurrencesMonth = currentMonth();
  }
  monthIndex = null;
  const r = route();
  document.getElementById("app").innerHTML = shell(r, VIEWS[r.path](r));
  document.title = `${ROUTES.find((x) => x.path === r.path).label} · Minhas Finanças`;
}

// ---------- Modal & toast ----------
let modalSubmit = null;
function openModal({ title, sub = "", body, foot, wide = false, onSubmit }) {
  modalSubmit = onSubmit || null;
  document.getElementById("layer").innerHTML = `<div class="overlay" data-act="close-overlay"><form class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="mtitle" id="modal" novalidate>
    <div class="modal-head"><div><h3 class="h-card" id="mtitle">${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}</div><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">${icon("x")}</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ""}</form></div>`;
  const first = document.querySelector("#modal [autofocus]") || document.querySelector("#modal .modal-body input, #modal .modal-body select");

/** Saves what is pending to GitHub and then clears this browser, so another person can use it. */
function logoutForm() {
  openModal({
    title: "Sair desta conta?", sub: `@${esc(sync.login)}`,
    body: `<p class="muted">Seus dados continuam salvos no GitHub e voltam quando você entrar de novo. Este navegador fica vazio, pronto para outra pessoa usar.</p>`,
    foot: `<button type="button" class="btn btn-secondary btn-sm" data-act="close">Cancelar</button><button type="submit" class="btn btn-primary btn-sm" id="logout-btn">Salvar e sair</button>`,
    onSubmit: async () => {
      const btn = document.getElementById("logout-btn"); btn.disabled = true; btn.textContent = "Salvando…";
      // Wait for an upload already in flight, then send the latest state.
      while (pushing) await new Promise((r) => setTimeout(r, 200));
      await pushNow();
      if (syncStatus === "error") {
        btn.disabled = false; btn.textContent = "Salvar e sair";
        return toast("Não foi possível salvar no GitHub. Verifique a internet e tente de novo.");
      }
      storeSync(null); syncStatus = "off";

      closeModal(); location.hash = href("painel"); render();
      toast("Você saiu. Seus dados estão salvos no GitHub.");
    },
  });
}

// ---------- Import (OFX / CSV) ----------
function decodeFile(buffer) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
  catch { return new TextDecoder("windows-1252").decode(buffer); }
}
function hashString(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
}
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function parseOfx(text) {
  const tag = (block, name) => { const m = block.match(new RegExp(`<${name}>([^<\\r\\n]*)`, "i")); return m ? m[1].trim() : null; };
  const account = tag(text, "ACCTID") || "";
  return text.split(/<STMTTRN>/i).slice(1).flatMap((raw) => {
    const block = raw.split(/<\/STMTTRN>/i)[0], amount = parseMoneyToCents(tag(block, "TRNAMT") || ""), posted = tag(block, "DTPOSTED") || "";
    if (amount === null || amount === 0 || !/^\d{8}/.test(posted)) return [];
    const date = `${posted.slice(0, 4)}-${posted.slice(4, 6)}-${posted.slice(6, 8)}`, fitid = tag(block, "FITID");
    return [{ type: amount < 0 ? "EXPENSE" : "INCOME", description: (tag(block, "MEMO") || tag(block, "NAME") || "Lançamento importado").slice(0, 120), amountCents: Math.abs(amount), date: isDate(date) ? date : "", externalId: fitid ? `ofx:${account}:${fitid}` : null }];
  });
}
function splitCsv(text) {
  const firstLine = text.split(/\r?\n/)[0] || "", delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') quoted = false; else cell += ch; }
    else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); if (row.some((c) => c.trim())) rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); if (row.some((c) => c.trim())) rows.push(row);
  return rows;
}
function parseCsv(text, signMode) {
  const [headers, ...rows] = splitCsv(text.replace(/^﻿/, ""));
  if (!headers) throw new Error("Arquivo vazio.");
  const find = (cands) => { const h = headers.map(norm); const e = h.findIndex((x) => cands.includes(x)); return e >= 0 ? e : h.findIndex((x) => cands.some((c) => x.startsWith(c))); };
  const dc = find(["data", "date", "data lancamento", "data da compra"]), sc = find(["descricao", "description", "historico", "lancamento", "title", "estabelecimento", "memo"]), vc = find(["valor", "amount", "valor (r$)", "value"]);
  if (dc < 0 || sc < 0 || vc < 0) throw new Error("Não encontramos as colunas de data, descrição e valor. Use um cabeçalho como: Data;Descrição;Valor");
  const seen = new Map();
  return rows.flatMap((row) => {
    const amount = parseMoneyToCents(row[vc] || ""), description = (row[sc] || "").trim().slice(0, 120);
    if (amount === null || amount === 0 || !description) return [];
    const v = (row[dc] || "").trim(), br = v.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    let date = br ? `${br[3]}-${br[2]}-${br[1]}` : /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : "";
    if (!isDate(date)) date = "";
    const isExpense = signMode === "negative-expense" ? amount < 0 : amount > 0;
    const base = `${date}|${amount}|${norm(description)}`, occ = (seen.get(base) || 0) + 1; seen.set(base, occ);
    return [{ type: isExpense ? "EXPENSE" : "INCOME", description, amountCents: Math.abs(amount), date, externalId: `csv:${hashString(`${base}|${occ}`)}` }];
  });
}
async function handleImportFile(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast("Arquivo grande demais (máximo 5 MB).");
  try {
    const text = decodeFile(await file.arrayBuffer());
    const isOfx = /\.ofx$/i.test(file.name) || /<OFX>/i.test(text);
    const drafts = isOfx ? parseOfx(text) : parseCsv(text, document.getElementById("signmode")?.value || "negative-expense");
    if (!drafts.length) return toast("Nenhuma transação encontrada no arquivo.");
    const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
    importDrafts = drafts.map((d) => ({ ...d, categoryId: "", duplicate: !!(d.externalId && known.has(d.externalId)), include: !(d.externalId && known.has(d.externalId)) }));
    render();
  } catch (e) { toast(e.message || "Não foi possível ler o arquivo."); }
}
function confirmImport() {
  const chosen = importDrafts.filter((d) => d.include);
  const bad = chosen.findIndex((d) => !d.description.trim() || !(d.amountCents > 0) || !isDate(d.date));
  if (bad >= 0) return toast(`Confira a linha ${importDrafts.indexOf(chosen[bad]) + 1}: descrição, valor e data são obrigatórios.`);
  const known = new Set(state.transactions.map((t) => t.externalId).filter(Boolean));
  let added = 0, ignored = 0;
  for (const d of chosen) {
    if (d.externalId && known.has(d.externalId)) { ignored++; continue; }
    state.transactions.push({ id: uid(), type: d.type, description: d.description.trim(), amountCents: d.amountCents, date: d.date, status: "PAID", categoryId: d.categoryId || null, source: "BANK_IMPORT", externalId: d.externalId, recurringId: null, period: null, notes: "", createdAt: Date.now() });
    if (d.externalId) known.add(d.externalId); added++;
  }
  save(); importDrafts = null;
  location.hash = href("lancamentos", { mes: chosen[0]?.date.slice(0, 7) });
  render();
  toast(`${added} lançamento(s) importado(s)${ignored ? `, ${ignored} já existiam` : ""}.`);
}

// ---------- Demo data ----------
function loadDemo() {
  const fresh = emptyState(), cat = (name, type = "EXPENSE") => fresh.categories.find((c) => c.name === name && c.type === type).id;
  const cur = currentMonth(), start = addMonths(cur, -5), today = Number(todayISO().slice(8, 10));
  fresh.recurrings = [
    { id: uid(), type: "EXPENSE", description: "Aluguel", amountCents: 240000, dayOfMonth: 5, startMonth: start, endMonth: null, categoryId: cat("Moradia") },
    { id: uid(), type: "EXPENSE", description: "Energia elétrica", amountCents: 38000, dayOfMonth: 24, startMonth: start, endMonth: null, categoryId: cat("Contas e serviços") },
    { id: uid(), type: "EXPENSE", description: "Internet fibra", amountCents: 14900, dayOfMonth: 10, startMonth: start, endMonth: null, categoryId: cat("Assinaturas") },
    { id: uid(), type: "INCOME", description: "Salário", amountCents: 720000, dayOfMonth: 5, startMonth: start, endMonth: null, categoryId: cat("Salário", "INCOME") },
  ];
  replaceState(fresh); ensureOccurrences();
  const vars = [["Pão de Açúcar", 34280, "Mercado"], ["Posto Ipiranga", 21000, "Transporte"], ["Restaurante", 16850, "Alimentação"], ["Farmácia", 8790, "Saúde"], ["Uber", 4320, "Transporte"], ["Cinema", 6400, "Lazer"]];
  for (let i = 0; i < 6; i++) {
    const m = addMonths(start, i), last = m === cur, maxDay = last ? Math.max(1, today) : 28;
    vars.forEach(([d, a, c], j) => state.transactions.push({ id: uid(), type: "EXPENSE", description: d, amountCents: a + i * 650 * (j + 1), date: `${m}-${pad(Math.min(3 + j * 4, maxDay))}`, status: "PAID", categoryId: cat(c), source: "MANUAL", recurringId: null, period: null, notes: "", createdAt: Date.now() }));
    if (i % 2) state.transactions.push({ id: uid(), type: "INCOME", description: "Freelance", amountCents: 130000, date: `${m}-${pad(Math.min(15, maxDay))}`, status: "PAID", categoryId: cat("Renda extra", "INCOME"), source: "MANUAL", recurringId: null, period: null, notes: "", createdAt: Date.now() });
  }
  // Past occurrences of fixed items are paid; the current month keeps some pending.
  for (const t of state.transactions) if (t.recurringId && (t.period < cur || t.date <= todayISO())) t.status = "PAID";
  state.budgets = [{ id: uid(), categoryId: cat("Alimentação"), amountCents: 30000 }, { id: uid(), categoryId: cat("Transporte"), amountCents: 35000 }];
  state.goals = [{ id: uid(), name: "Reserva de emergência", targetCents: 2000000, savedCents: 640000, deadline: null }];
  save(); location.hash = href("painel"); render(); toast("Dados de exemplo carregados.");
}

// ---------- Events ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-overlay") { if (e.target === el) closeModal(); return; }
  // Menu links must keep their default navigation; only the sheet closes.
  if (act === "close-nav") { closeModal(); return; }
  const actions = {
    "theme": () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("mf-theme", t); } catch {} render(); },
    "menu": menuSheet, "close": closeModal,
    "new-tx": () => txForm(null, el.dataset.type),
    "edit-tx": () => txForm(state.transactions.find((t) => t.id === id)),
    "tx-type": () => txForm.setType(el.dataset.type),
    "toggle": () => { const t = state.transactions.find((x) => x.id === id); t.status = t.status === "PAID" ? "PENDING" : "PAID"; save(); render(); },
    "del-tx": () => { const t = state.transactions.find((x) => x.id === id); confirmDialog("Excluir lançamento?", `"${esc(t.description)}" será removido.`, "Excluir", () => {
      // Removed fixed occurrences become tombstones so they are not generated again.
      if (t.recurringId) t.status = "SKIPPED"; else state.transactions = state.transactions.filter((x) => x.id !== id);
      save(); toast("Lançamento excluído."); }); },
    "new-rec": () => recForm(null),
    "edit-rec": () => recForm(state.recurrings.find((x) => x.id === id)),
    "rec-type": () => recForm.setType(el.dataset.type),
    "del-rec": () => confirmDialog("Excluir gasto fixo?", "Os lançamentos já gerados continuam no histórico; os pendentes deste modelo serão removidos.", "Excluir", () => {
      state.recurrings = state.recurrings.filter((x) => x.id !== id);
      state.transactions = state.transactions.filter((t) => t.recurringId !== id || t.status === "PAID");
      save(); toast("Gasto fixo excluído."); }),
    "new-cat": () => catForm(null, el.dataset.type),
    "edit-cat": () => catForm(state.categories.find((c) => c.id === id)),
    "del-cat": () => confirmDialog("Excluir categoria?", "Os lançamentos dessa categoria ficarão sem categoria.", "Excluir", () => {
      state.categories = state.categories.filter((c) => c.id !== id);
      for (const t of state.transactions) if (t.categoryId === id) t.categoryId = null;
      for (const r of state.recurrings) if (r.categoryId === id) r.categoryId = null;
      state.budgets = state.budgets.filter((b) => b.categoryId !== id);
      save(); toast("Categoria excluída."); }),
    "new-budget": () => budgetForm(null),
    "edit-budget": () => budgetForm(state.budgets.find((b) => b.id === id)),
    "del-budget": () => { state.budgets = state.budgets.filter((b) => b.id !== id); save(); render(); toast("Limite removido."); },
    "new-goal": () => goalForm(null),
    "edit-goal": () => goalForm(state.goals.find((g) => g.id === id)),
    "deposit-goal": () => depositForm(state.goals.find((g) => g.id === id)),
    "del-goal": () => confirmDialog("Excluir meta?", "A meta será removida.", "Excluir", () => { state.goals = state.goals.filter((g) => g.id !== id); save(); toast("Meta excluída."); }),
    "connect": connectForm,
    "push-now": pushNow,
    "logout": logoutForm,
    "cancel-import": () => { importDrafts = null; render(); },
    "confirm-import": confirmImport,
    "export": () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `minhas-financas-backup-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
      toast("Backup baixado.");
    },
    "demo": () => { if (state.transactions.length || state.recurrings.length) confirmDialog("Carregar dados de exemplo?", "Isso <b>substitui</b> os dados atuais deste navegador. Exporte um backup antes se quiser guardá-los.", "Substituir", loadDemo); else loadDemo(); },
    "wipe": () => confirmDialog("Apagar todos os dados?", `Tudo deste navegador será removido.${sync ? " O backup no GitHub também será substituído pelos dados vazios." : ""} Essa ação não pode ser desfeita.`, "Apagar tudo", () => { replaceState(emptyState()); save(); location.hash = href("painel"); toast("Dados apagados."); }),
  };
  if (actions[act]) { e.preventDefault(); actions[act](); }
});
document.addEventListener("submit", (e) => { if (e.target.id === "modal") { e.preventDefault(); modalSubmit?.(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.querySelector(".overlay")) closeModal(); });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.filter) {
    const r = route(), p = Object.fromEntries(r.params.entries()); p[t.dataset.filter] = t.value; p.mes = r.month;
    location.hash = href("lancamentos", p);
  } else if (t.id === "file") handleImportFile(t.files[0]);
  else if (t.id === "restore") {
    const file = t.files[0]; if (!file) return;
    file.text().then((text) => {
      const data = JSON.parse(text);
      if (!data || data.version !== 1 || !Array.isArray(data.transactions) || !Array.isArray(data.categories)) throw new Error();
      confirmDialog("Restaurar backup?", `O arquivo tem ${data.transactions.length} lançamentos. Os dados atuais deste navegador serão substituídos.`, "Restaurar", () => { replaceState(data); save(); toast("Backup restaurado."); });
    }).catch(() => toast("Arquivo de backup inválido."));
  } else if (t.dataset.draft !== undefined) {
    const d = importDrafts[Number(t.dataset.draft)], k = t.dataset.k;
    if (k === "include") d.include = t.checked;
    else if (k === "amount") { const c = parseMoneyToCents(t.value); d.amountCents = c === null ? 0 : Math.abs(c); }
    else if (k === "type") { d.type = t.value; d.categoryId = ""; }
    else d[k] = t.value;
    if (k === "include" || k === "type") render();
  }
});
document.addEventListener("input", (e) => { const t = e.target; if (t.dataset.draft !== undefined && t.dataset.k === "description") importDrafts[Number(t.dataset.draft)].description = t.value; });
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleImportFile(e.dataTransfer.files[0]); } });
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });
window.addEventListener("storage", (e) => { if (e.key === KEY) { replaceState(load()); render(); } });

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullIfNewer(); else if (pushTimer) pushNow(); });
window.addEventListener("beforeunload", (e) => { if (pushTimer || pushing) { pushNow(); e.preventDefault(); e.returnValue = ""; } });

render();
pullIfNewer();
</script>
</body>
