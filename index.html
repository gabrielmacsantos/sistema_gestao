<script>
  // Apply the saved theme before paint. First visit, or nothing saved: the dark theme.
  try {
    var t = localStorage.getItem("mf-theme");
    if (t !== "light" && t !== "dark") t = "dark";
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#090d16" : "#f8fafc";
  } catch (e) {
    document.documentElement.dataset.theme = "dark";
  }
  // Same for a collapsed side menu, so the wide one never flashes on load.
  try { if (localStorage.getItem("mf-rail-collapsed") === "1") document.documentElement.dataset.rail = "collapsed"; } catch (e) {}
</script>
<style>
/* ===== Urban design tokens: dark (default) and light, the same in the site and in the app =====
   The spec names (--bg-primary, --brand-primary...) are the source of truth; the short names below them are what the
   rest of this file already reads, so they only point at the spec names. Hex colors live only in these two blocks. */
:root {
  --bg-primary: #f8fafc; --bg-card: #ffffff; --bg-elevated: #f1f5f9; --border-subtle: #e2e8f0;
  --brand-primary: #0f766e; --brand-primary-alt: #0d9488; --brand-secondary: #4f46e5; --brand-accent: #0284c7;
  --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
  --semantic-income: #059669; --semantic-expense: #e11d48; --semantic-warning: #d97706;
  --placeholder: #64748b; /* text-muted is for icons and inactive items; typed-text hints need 4.5:1 */
  --bg: var(--bg-primary); --surface: #f4f7fb; --card: var(--bg-card);
  --c-low: #f6f8fb; --c: var(--bg-elevated); --c-high: #e7ecf3; --c-highest: #dde4ee;
  --on: var(--text-primary); --on-var: var(--text-secondary); --outline: var(--text-muted); --outline-var: var(--border-subtle);
  --hairline: rgb(226 232 240 / .8); --scrim: rgb(15 23 42 / .35);
  --primary: var(--brand-primary); --on-primary: #fff; --primary-c: var(--brand-primary-alt); --on-primary-c: #f4fffc;
  --primary-fixed: #a7f3d0; --on-primary-fixed: #022c22;
  --secondary: var(--text-secondary); --secondary-c: #e2e8f0; --on-secondary-c: #475569;
  --tertiary: var(--semantic-income); --on-tertiary: #fff; --tertiary-c: #15803d; --tertiary-fixed: #bbf7d0; --on-tertiary-fixed: #052e16;
  --success: var(--semantic-income); --success-c: #f0fdf4; --warning: var(--semantic-warning); --warning-c: #fffbeb; --danger: var(--semantic-expense); --danger-c: #fff1f2; --on-danger: #fff;
  --chart-in: var(--semantic-income); --chart-out: var(--brand-secondary); --chart-grid: var(--border-subtle);
  --shadow: 0 1px 2px rgb(15 23 42 / .05);
  --shadow-3: 0 20px 25px -5px rgb(15 23 42 / .06), 0 8px 10px -6px rgb(15 23 42 / .04);
  --font: "Inter", ui-sans-serif, system-ui, sans-serif;
  --display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
  --rail: 260px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg-primary: #0b111e; --bg-card: #111a2e; --bg-elevated: #17233b; --border-subtle: #1c2842;
  --brand-primary: #14b8a6; --brand-primary-alt: #4fdbc8; --brand-secondary: #6366f1; --brand-accent: #38bdf8;
  --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #475569;
  --semantic-income: #34d399; --semantic-expense: #f43f5e; --semantic-warning: #fbbf24;
  --placeholder: #7c8ba1;
  --surface: #0d1526;
  --c-low: #131e35; --c-high: #1c2a46; --c-highest: #263756;
  --hairline: rgb(255 255 255 / .08); --scrim: rgb(2 6 23 / .6);
  --on-primary: #04201a; --on-primary-c: #04201a;
  --primary-fixed: #064e3b; --on-primary-fixed: #6ee7b7;
  --secondary-c: #1e293b; --on-secondary-c: #cbd5e1;
  --on-tertiary: #052e16; --tertiary-c: #16a34a; --tertiary-fixed: #14532d; --on-tertiary-fixed: #86efac;
  --success-c: rgb(34 197 94 / .14); --warning-c: rgb(245 158 11 / .14); --danger-c: rgb(244 63 94 / .16); --on-danger: #fff;
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--on); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
/* Switching theme fades the main surfaces instead of jumping. */
body, .card, .topbar, .bottomnav { transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
@media (prefers-reduced-motion: reduce) { body, .card, .topbar, .bottomnav, .input { transition: none; } }
h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
/* Toque: sem o quadrado azul do WebView; o feedback é o :active (escala e opacidade). O foco por teclado segue em :focus-visible. */
:root { --tap-scale: .96; --tap-scale-wide: .97; --tap-scale-icon: .92; --tap-opacity: .85; --tap-dur: 150ms; --tap-ease: cubic-bezier(.22,1,.36,1); }
a, button, [role="button"], [role="tab"], [role="radio"], label, summary, input, select, textarea { -webkit-tap-highlight-color: transparent; }
a, button, [role="button"], [role="tab"], [role="radio"], summary { touch-action: manipulation; }
button, .icon-btn, .nav a, .month a, .t-tab, .sync, .asst-trigger { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.btn:active, .t-tab:active, .month a:active, .month button:active, .sync:active, .nav a:active { transform: scale(var(--tap-scale)); opacity: var(--tap-opacity); }
.btn-google:active, .auth-google .btn:active { transform: scale(var(--tap-scale-wide)); opacity: var(--tap-opacity); }
.icon-btn:active, .rail-toggle:active .rail-disc, .asst[data-state="closed"] .asst-trigger:active { transform: scale(var(--tap-scale-icon)); opacity: var(--tap-opacity); }
.month a, .month button, .sync { transition: transform var(--tap-dur) var(--tap-ease), opacity var(--tap-dur) var(--tap-ease), background .15s, color .15s; }
.btn[disabled]:active, .btn:disabled:active { transform: none; opacity: .6; }
@media (prefers-reduced-motion: reduce) { .btn:active, .t-tab:active, .month a:active, .month button:active, .sync:active, .nav a:active, .btn-google:active, .auth-google .btn:active, .icon-btn:active, .rail-toggle:active .rail-disc, .asst[data-state="closed"] .asst-trigger:active { transform: none; } }
::selection { background: var(--primary-fixed); color: var(--on-primary-fixed); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.t-income { color: var(--success); } .t-danger { color: var(--danger); } .t-warning { color: var(--warning); } .t-primary { color: var(--primary); } .t-tertiary { color: var(--tertiary); }

/* ===== Shell ===== */
.rail { display: none; position: fixed; inset: 0 auto 0 0; width: 80px; z-index: 30; background: var(--card); border-right: 1px solid var(--hairline); padding: 16px; flex-direction: column; justify-content: space-between; overflow-y: auto; overflow-x: hidden; transition: width var(--rail-dur) var(--rail-ease); }
.brand { display: flex; align-items: center; gap: 12px; justify-content: center; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-c); color: var(--on-primary-c); flex: none; box-shadow: var(--shadow); }
.brand-text { display: none; min-width: 0; }
.brand-name { font: 700 18px/24px var(--display); letter-spacing: -.01em; color: var(--primary); }

.logo-full, .logo-mark { display: block; flex: none; background: center / contain no-repeat; }
.logo-full { background-image: var(--logo-full); height: 52px; aspect-ratio: 429 / 120; max-width: 100%; }
.logo-mark { background-image: var(--logo-mark); width: 44px; height: 44px; }
.brand .logo-full { display: none; }
.mob-brand .logo-full { height: 30px; }
.auth-brand { flex-direction: column; text-align: center; gap: 6px; }
.auth-brand h1 { margin: 0; }
.google-error { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--danger); background: var(--danger-c); color: var(--on); font-size: 13px; line-height: 18px; text-align: left; overflow-wrap: anywhere; }
.auth-brand .logo-full { height: 72px; margin-inline: auto; }
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; }
.nav a { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border-radius: 8px; color: var(--secondary); font-weight: 600; transition: background .15s, color .15s, transform var(--tap-dur) var(--tap-ease), opacity var(--tap-dur) var(--tap-ease); }
.nav a:hover { background: var(--c-low); color: var(--on); }
.nav a.active { background: var(--c-high); color: var(--primary); }
.nav .lbl { display: none; }
.rail .btn-new { margin-top: 24px; width: 100%; padding: 0; }
.rail .btn-new .lbl { display: none; }
.rail-foot { border-top: 1px solid var(--hairline); padding-top: 16px; margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
.page { min-height: 100dvh; display: flex; flex-direction: column; transition: padding-left var(--rail-dur) var(--rail-ease); }
/* Collapsible rail (>= 1024px; below that it is already an 80px icon dock). <html data-rail="collapsed"> is set
   before paint from localStorage, or by the toggle. The width is --rail-w, shared by the rail, the page padding
   and the toggle so they move together. Labels fade first and only then drop to zero width, so no text wraps
   or truncates while the rail narrows. */
:root { --rail-dur: 300ms; --rail-ease: cubic-bezier(.22,1,.36,1); --rail-w: var(--rail); }
:root[data-rail="collapsed"] { --rail-w: 80px; }
.rail-toggle { display: none; position: fixed; top: 18px; left: calc(var(--rail-w) - 22px); z-index: 31; width: 44px; height: 44px; padding: 0; border: 0; background: none; place-items: center; color: var(--secondary); transition: left var(--rail-dur) var(--rail-ease); }

/** The rings of faces lift and spring back (transitions.dev "Avatar group hover"): ease-in on the way up, a bouncy ease-out on the return. */
function avatarGroupShift(root, activeIdx, phase) {
  const cs = getComputedStyle(document.documentElement);
  const num = (name, fallback) => { const v = parseFloat(cs.getPropertyValue(name)); return Number.isFinite(v) ? v : fallback; };
  const lift = num("--avatar-lift", -4), falloff = num("--avatar-falloff", 0.45), scale = num("--avatar-scale", 1.05);
  const ease = (cs.getPropertyValue(phase === "out" ? "--avatar-ease-out" : "--avatar-ease-in") || "").trim();
  root.querySelectorAll(".t-avatar").forEach((el, i) => {
    if (ease) el.style.transitionTimingFunction = ease;
    if (activeIdx == null) { el.style.setProperty("--shift", "0px"); el.style.setProperty("--scale-active", "1"); return; }
    el.style.setProperty("--shift", `${(lift * Math.pow(falloff, Math.abs(i - activeIdx))).toFixed(3)}px`);
    el.style.setProperty("--scale-active", i === activeIdx ? String(scale) : "1");
  });
}
document.addEventListener("mouseover", (e) => {
  const item = e.target.closest?.(".t-avatar"), root = item?.closest(".t-avatar-group");
  if (root) avatarGroupShift(root, [...root.querySelectorAll(".t-avatar")].indexOf(item), "in");
});
document.addEventListener("mouseout", (e) => {
  const root = e.target.closest?.(".t-avatar-group");
  if (root && !root.contains(e.relatedTarget)) avatarGroupShift(root, null, "out");
});

/** Sign-in and sign-up are the same tap: Google says who it is, the app folder says if data exists. */
async function googleSignIn() {
  let stage = "conta do Google";
  try {
    const { profile, ...token } = await requestGoogleToken("select_account");
    stage = "perfil";
    const me = await googleProfile(token.access, profile);
    stage = "Google Drive";
    const fileId = await findDriveFile(DRIVE_FILE, token.access);
    const remoteText = fileId ? await drive(`/files/${fileId}?alt=media`, { as: "text" }, token.access) : null;
    return googleSettings({ me, token, fileId, remoteText });
  } catch (e) { if (e && typeof e === "object" && !e.stage) e.stage = stage; throw e; }
}
function googleSettings({ me, token, fileId, remoteText }) {
  return { settings: { provider: "google", sub: me.sub, email: me.email, name: me.name, picture: me.picture, fileId, token, fileScope: !!token.fileScope }, remoteText };
}

async function startGoogleSignIn(btn) {

  if (result.remoteText) {

        if (!unlocked.reset) {
          data = unlocked.result.data;
          settings = { ...settings, ...unlocked.fields, base: unlocked.result.savedAt, lastSync: Date.now() };
          repack = unlocked.repack; // a new password was set from the recovery key: the cloud's password wrap must change too
        }
      }
    } catch (e) { reset(); return toast(e.message); }
  }
  const first = settings.name.split(" ")[0];
  const finish = async (useRemote, link) => {
    const from = activeScope(); // "local": where the data made without an account lives
    const carried = link ? withoutDemo(state) : null;
    storeSync(settings); wsForcePersonal(); setLocalMode(false); syncStatus = "ok";
    // A brand-new account (nothing in the cloud yet) always gets the first-access tour, even if this device saw it for the same Google login before.
    if (!useRemote) { try { localStorage.removeItem(tourKey(scopeOf(sync))); } catch {} }
    if (useRemote) { await clearPhotos(); replaceState(data); persist(); if (repack) await pushNow(); }
    else {
      replaceState(carried || load());
      if (!state.savedAt) state.savedAt = Date.now(); persist();
      if (link && storageOk) {
        await movePhotos(from, activeScope());
        try { localStorage.removeItem(storageKey(from)); } catch { /* it stays as a copy */ }
      }
      await pushNow(); syncPhotos();
    }
    location.hash = href("painel"); render();
    const apart = !link && hasRealData(load(from)) ? " Os dados sem conta continuam só neste aparelho." : "";
    toast((useRemote ? `Bem-vindo de volta, ${first}!` : `Conta criada! Bem-vindo, ${first}.`) + apart);
  };
  reset();
  const choice = decideLink(hasRealData(state), hasRealData(data));
  if (choice === "ask") return finish(false, (await askLinkLocal(settings.email, state.transactions.length)) === "link");

// ---------- Receipt photos ----------
// Photos are shrunk on the device (max 1600px JPEG) and kept in IndexedDB. With an account, each
// one is also encrypted with the same key as the data and stored as its own file in a second gist
// ("comprovantes"), so the main data file stays small. Other devices download a photo only when it
// is opened, straight from the gist's raw URL.
const PHOTO_MAX_SIDE = 1600;
// One database per scope (see <account-scope>), so photos of two accounts never share a store.
const photoStore = (() => {
  const opened = new Map();
  const open = (name) => {
    if (!opened.has(name)) opened.set(name, new Promise((resolve, reject) => {
      const req = indexedDB.open(name, 1);
      req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "id" });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
    return opened.get(name);
  };
  const run = async (name, mode, fn) => {
    const db = await open(name);
    return new Promise((resolve, reject) => {
      const t = db.transaction("photos", mode), req = fn(t.objectStore("photos"));
      t.oncomplete = () => resolve(req?.result);
      t.onerror = () => reject(t.error);
    });
  };
  const store = (name) => ({
    get: (id) => run(name, "readonly", (st) => st.get(id)),
    all: () => run(name, "readonly", (st) => st.getAll()),
    put: (rec) => run(name, "readwrite", (st) => st.put(rec)),
    del: (id) => run(name, "readwrite", (st) => st.delete(id)),
    clear: () => run(name, "readwrite", (st) => st.clear()),
  });
  /** Removes a whole database: empties it, closes this page's connection and deletes it (best effort if another tab holds it open). */
  store.drop = async (name) => {
    try { await store(name).clear(); } catch { /* nothing to empty */ }
    try { (await opened.get(name))?.close(); } catch { /* already closed */ }
    opened.delete(name);
    await new Promise((resolve) => { const req = indexedDB.deleteDatabase(name); req.onsuccess = req.onerror = req.onblocked = () => resolve(); });
  };
  return store;
})();
const photoOwner = () => { try { return localStorage.getItem(PHOTO_OWNER_KEY); } catch { return null; } };
const photoDbFor = (scope) => photoStore(photoDbName(scope, photoOwner()));
const photoDb = {
  get: (id) => photoDbFor(activeScope()).get(id),
  all: () => photoDbFor(activeScope()).all(),
  put: (rec) => photoDbFor(activeScope()).put(rec),
  del: (id) => photoDbFor(activeScope()).del(id),
  clear: () => photoDbFor(activeScope()).clear(),
};
/** Moves the photos of one scope into another (data made without an account that is taken into the account). */
async function movePhotos(from, to) {
  try {
    const source = photoDbFor(from), target = photoDbFor(to);
    for (const rec of await source.all()) await target.put(rec);
    await source.clear();
  } catch { /* the photos stay where they were */ }
}

async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}
/** Phone photo -> JPEG of at most 1600px (usually 150 to 400 KB). */
async function compressImage(file) {
  if (file.size > 30 * 1024 * 1024) throw new Error("Foto grande demais (máximo 30 MB).");
  if (file.type && !file.type.startsWith("image/")) throw new Error("Escolha uma foto (da câmera ou da galeria).");
  let img;
  try { img = await decodeImage(file); } catch { throw new Error("Não foi possível abrir essa imagem. Tente tirar a foto de novo."); }
  const w0 = img.width, h0 = img.height, scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(w0, h0));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w0 * scale); canvas.height = Math.round(h0 * scale);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.72));
  if (!blob) throw new Error("Não foi possível processar a foto.");
  return blob;
}

const photoFile = (id) => `${id}.bin`;
async function encryptPhoto(blob) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await importKey(sync.key), await blob.arrayBuffer()));
  const out = new Uint8Array(12 + data.length); out.set(iv); out.set(data, 12);
  return toB64(out);
}
async function decryptPhoto(text) {
  const bytes = fromB64(text.trim());
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, await importKey(sync.key), bytes.subarray(12));
  return new Blob([plain], { type: "image/jpeg" });
}

/** The photo as a Blob: from this device, or downloaded and decrypted from the user's gist. */
async function getPhoto(id) {
  try { const rec = await photoDb.get(id); if (rec) return rec.blob; } catch {}
  if (isGoogle()) {
    try {
      if (!ENCRYPTED_SYNC) {
        const plainId = await findDriveFile(photoLegacyDriveName(id));
        if (plainId) {
          const blob = await drive(`/files/${plainId}?alt=media`, { as: "blob" });
          photoDb.put({ id, blob, uploaded: true }).catch(() => {});
          return blob;
        }
      }
      const encryptedId = await findDriveFile(photoDriveName(id));
      if (encryptedId) {
        if (!sync.dkey) return null;
        const sealed = await drive(`/files/${encryptedId}?alt=media`, { as: "blob" });
        const plain = await openPhotoBytes(await sealed.arrayBuffer(), id);
        const blob = new Blob([plain], { type: "image/jpeg" });
        photoDb.put({ id, blob, uploaded: true }).catch(() => {});
        return blob;
      }
      const legacyId = await findDriveFile(photoLegacyDriveName(id));
      if (!legacyId) return null;
      const blob = await drive(`/files/${legacyId}?alt=media`, { as: "blob" });
      // Kept as "not uploaded": the next photo sync stores it encrypted and removes the plain file.
      photoDb.put({ id, blob, uploaded: false, legacyFileId: legacyId }).then(() => syncPhotos()).catch(() => {});
      return blob;
    } catch { return null; }
  }
  if (!sync || !state.photosGistId) return null;
  try {
    const res = await fetch(`https://gist.githubusercontent.com/${encodeURIComponent(sync.login)}/${state.photosGistId}/raw/${photoFile(id)}`);
    if (!res.ok) return null;
    const blob = await decryptPhoto(await res.text());
    photoDb.put({ id, blob, uploaded: true }).catch(() => {});
    return blob;
  } catch { return null; }
}

/** Sends photos not uploaded yet. Returns false if something could not be sent. */
let photoSync = null;
function syncPhotos() {
  if (!sync) return Promise.resolve(true);
  return (photoSync ||= (async () => {
    try {
      const pending = (await photoDb.all()).filter((r) => !r.uploaded);
      for (const rec of pending) {
        if (isGoogle()) {
          if (!ENCRYPTED_SYNC) {
            await writeDriveFile(null, photoLegacyDriveName(rec.id), rec.blob, "image/jpeg");
            await photoDb.put({ id: rec.id, blob: rec.blob, uploaded: true });
            continue;
          }
          if (!sync.dkey) return false; // nothing leaves the device without the password
          const sealed = await sealBytes(await rec.blob.arrayBuffer(), await importDriveKey(sync.dkey), photoAad(sync.sub, rec.id));
          await writeDriveFile(null, photoDriveName(rec.id), new Blob([sealed]), "application/octet-stream");
          if (rec.legacyFileId) drive(`/files/${rec.legacyFileId}`, { method: "DELETE" }).catch(() => {});
          await photoDb.put({ id: rec.id, blob: rec.blob, uploaded: true });
          continue;
        }
        const files = { [photoFile(rec.id)]: { content: await encryptPhoto(rec.blob) } };
        if (!state.photosGistId) {
          const gist = await gh("/gists", sync.token, { method: "POST", body: JSON.stringify({ description: "Nexus Financy IA: comprovantes criptografados (não apague)", public: true, files }) });
          state.photosGistId = gist.id; save();
        } else {
          await gh(`/gists/${state.photosGistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files }) });
        }
        await photoDb.put({ ...rec, uploaded: true });
      }
      return true;
    } catch (e) {
      if (e.reauth) { setSyncStatus("reauth"); return false; }
      toast(e.message || `Não foi possível enviar a foto ao ${providerName()}.`); return false;
    }
    finally { photoSync = null; }
  })());
}
/** Removes a photo here and (best effort) from the gist. */
async function deletePhoto(id) {
  try { await photoDb.del(id); } catch {}
  if (isGoogle()) {
    for (const name of [photoDriveName(id), photoLegacyDriveName(id)]) {
      findDriveFile(name).then((fileId) => fileId && drive(`/files/${fileId}`, { method: "DELETE" })).catch(() => {});
    }
    return;
  }
  if (sync && state.photosGistId) gh(`/gists/${state.photosGistId}`, sync.token, { method: "PATCH", body: JSON.stringify({ files: { [photoFile(id)]: null } }) }).catch(() => {});
}

/** Income and expenses of a month per calendar week, Monday to Sunday, cut at the month's edges. */
function weeklySeries(entries, month) {
  const [year, monthNumber] = month.split("-").map(Number);

  const weekOf = (day) => Math.floor((day - 1 + offset) / 7);

    if (e.status === "SKIPPED" || e.day.slice(0, 7) !== month) continue;
    const week = weeks[weekOf(Number(e.day.slice(8, 10)))];

const FLOW_KEY = "mf-flow-view";

/** Chart columns in cents: the last 6 months, or the month per calendar week (stored + projected). */
function flowData(m) {
  if (flowView === "month") {
    const series = monthlySeries(m);

      points: series.map((x) => ({ label: monthShort(x.month), long: monthLabel(x.month), income: x.income, expense: x.expense })) };
  }
  const name = MONTHS[Number(m.slice(5)) - 1], today = todayISO(), day = Number(today.slice(8));
  const weeks = weeklySeries([...ofMonth(m), ...projected(m)].map((t) => ({ type: t.type, amountCents: t.amountCents, day: t.date })), m);
  return { current: today.slice(0, 7) === m ? weeks.findIndex((w) => w.firstDay <= day && day <= w.lastDay) : -1,

function startDeleteAccount() {
  const blocker = deletionBlocker({ online: navigator.onLine, hasSession: !!sync });
  if (blocker === "offline") return toast("Sem internet. Para excluir também os dados da nuvem, conecte-se e tente de novo.");
  if (blocker) return;
  openModal({

    body: `<p class="muted">Isto apaga <b>para sempre</b>:</p>

      <p class="muted">O que você criou <b>sem conta</b> neste aparelho e as preferências do aparelho (tema, por exemplo) não são apagados. Não dá para desfazer.</p>
      <p class="hint">Quer guardar uma cópia? <a href="javascript:void 0" data-act="export">Baixar backup</a> antes de continuar.</p>`,
    foot: `<button type="button" class="btn btn-secondary" data-act="close">Cancelar</button><button type="submit" class="btn btn-danger">Continuar</button>`,
    onSubmit: confirmDeleteStep,
  });
}
/** Step 2: an explicit confirmation, typed, so a stray tap cannot delete anything. */
function confirmDeleteStep() {
  openModal({
    title: "Confirme a exclusão", sub: esc(accountLabel()),
    body: `<p class="muted">Esta é a última etapa. Depois dela, a conta e os dados somem e não podem ser recuperados.</p>
      ${field(`Digite ${DELETE_PHRASE} para confirmar`, "dc", input("dc", "", `autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus`))}`,
    foot: `<button type="button" class="btn btn-secondary" data-act="close">Cancelar</button><button type="submit" class="btn btn-danger-solid" id="del-final" disabled>Excluir definitivamente</button>`,
    onSubmit: runDeleteAccount,
  });
  const typed = document.querySelector('#modal [name="dc"]');
  typed.addEventListener("input", () => { document.getElementById("del-final").disabled = !confirmationMatches(typed.value); });
}
/** Every file the app keeps in the account's hidden Drive folder (the data file and the photos). */
async function listDriveAppFiles() {
  const out = [];
  let pageToken = "";
  do {
    const r = await drive(`/files?spaces=appDataFolder&fields=nextPageToken,files(id,name)&pageSize=1000${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ""}`);
    out.push(...(r.files || []));
    pageToken = r.nextPageToken || "";
  } while (pageToken);
  return out;
}
/** Deletes the account's copy in the cloud and checks nothing is left. Throws if it could not. */
async function deleteCloudData() {
  if (isGoogle()) {
    for (const f of await listDriveAppFiles()) {
      try { await drive(`/files/${f.id}`, { method: "DELETE" }); } catch (e) { if (!e.notFound) throw e; }
    }
    if ((await listDriveAppFiles()).length) throw new Error("Ainda restam arquivos na nuvem.");
    return;
  }
  // Older GitHub accounts (dormant): the data gist and the photos gist.
  for (const id of [sync.gistId, state.photosGistId].filter(Boolean)) {
    let res;
    try { res = await fetch(`${API}/gists/${id}`, { method: "DELETE", headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${sync.token}` } }); }
    catch { throw new Error("Sem conexão com o GitHub. Verifique a internet."); }
    if (!res.ok && res.status !== 404) throw new Error("Não foi possível excluir os dados no GitHub.");
  }
}
/** Takes the app's access away from the Google account (best effort: it can also be removed at myaccount.google.com/connections). */
async function revokeGoogleAccess() {
  if (!isGoogle()) return;
  try {
    if (NATIVE && NativePlugins.SocialLogin) { await nativeSocialLogin(); await NativePlugins.SocialLogin.logout({ provider: "google" }); return; }
    const access = sync.token && sync.token.access;
    if (!access) return;
    const google = await loadGis();
    await new Promise((resolve) => { google.accounts.oauth2.revoke(access, resolve); setTimeout(resolve, 4000); });
  } catch { /* the cloud data is already gone; the access can be removed by the person */ }
}
/** Removes this account's records, photos, session and per-account marks from the device. The no-account scope and the device preferences stay. */
async function wipeAccountFromDevice(plan) {
  for (const key of plan.localStorageKeys) {
    try { localStorage.removeItem(key); } catch { /* private mode: nothing was kept */ }
    delete celebratedMemory[key]; delete noticesMemory[key];
  }
  for (const name of plan.photoDatabases) await photoStore.drop(name);
  if (plan.clearPhotoOwner) { try { localStorage.removeItem(PHOTO_OWNER_KEY); } catch { /* ignore */ } }
  try { sessionStorage.removeItem(INCOMING_KEY); } catch { /* ignore */ }
  if (NATIVE && BankNotif()) await BankNotif().takeQueue().catch(() => {}); // bank notifications still waiting in the reader
  wsWipeCaches(true);
  storeSync(null); syncStatus = "off"; setLocalMode(false);
  replaceState(load());
}
/** The deletion, in an order that never leaves the person half-deleted without knowing: cloud first, then the access, then the device. */
async function runDeleteAccount() {
  const typed = document.querySelector('#modal [name="dc"]'), btn = document.getElementById("del-final");
  if (!confirmationMatches(typed.value)) return showErrors({ dc: `Digite ${DELETE_PHRASE} para confirmar.` });
  const plan = deletionPlan(sync, photoOwner());
  if (!plan) return toast("Não há conta para excluir.");
  btn.disabled = true; btn.setAttribute("aria-busy", "true"); btn.textContent = "Excluindo…";
  const back = (msg) => { btn.disabled = false; btn.removeAttribute("aria-busy"); btn.textContent = "Excluir definitivamente"; toast(msg); };
  try {
    // Right after the tap, so the browser lets Google's window open if the access ran out.
    if (isGoogle() && !NATIVE && !(sync.token && sync.token.expiresAt > Date.now())) await reconnectGoogle();
  } catch (e) { return back(e.message); }
  // Shared panels this person created go with the account (their Drive file); the panels they only joined stay for the others.
  try {
    for (const w of readWsList().filter((x) => wsIsOwner(x, sync.sub))) {
      try { await drive(`/files/${encodeURIComponent(w.id)}`, { method: "DELETE" }); } catch (e) { if (!e.notFound) throw e; }
    }
  } catch { return back("Não foi possível excluir os painéis compartilhados que você criou. Nada foi apagado deste aparelho. Verifique a internet e tente de novo."); }
  try { await deleteCloudData(); }
  catch (e) { return back(e.reauth ? "O acesso ao Google venceu. Toque em Excluir de novo para entrar com o Google e continuar." : "Não foi possível excluir os dados na nuvem. Nada foi apagado deste aparelho. Verifique a internet e tente de novo."); }
  await revokeGoogleAccess();
  await wipeAccountFromDevice(plan);
  closeModal(); location.hash = href("entrar"); render();
  toast("Sua conta e todos os seus dados foram excluídos.");
}

// ---------- Trips ----------
const tripTx = (id) => state.transactions.filter((t) => t.tripId === id && t.status !== "SKIPPED").sort(byDateDesc);
function tripTotals(trip) {
  const list = tripTx(trip.id), spent = sum(list.filter((t) => t.type === "EXPENSE")), refunds = sum(list.filter((t) => t.type === "INCOME"));
  const days = Math.max(1, Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1);
  return { list, spent, refunds, net: spent - refunds, days, perDay: Math.round((spent - refunds) / days) };
}
function tripStatus(trip) {
  const today = todayISO();
  if (today < trip.startDate) return ["Planejada", "b-neutral"];
  if (today > trip.endDate) return ["Concluída", "b-success"];
  return ["Em andamento", "b-warning"];
}
const tripDates = (trip) => {
  const y1 = trip.startDate.slice(0, 4), y2 = trip.endDate.slice(0, 4);
  return `${dayMonth(trip.startDate)}${y1 !== y2 ? ` de ${y1}` : ""} a ${dayMonth(trip.endDate)} de ${y2}`;
};
/** Painel: how much of this month went to trips that are kept apart. */
function tripNote(month) {
  const out = state.transactions.filter((t) => t.tripId && !inMain(t) && t.status !== "SKIPPED" && t.type === "EXPENSE" && t.date.slice(0, 7) === month);
  if (!out.length) return "";
  return `<a class="card trip-note" href="${href("viagens")}"><span class="chip" style="background:var(--c-high);color:var(--primary)">${icon("plane")}</span><span style="flex:1"><b>${fmt(sum(out))}</b> em gastos de viagem neste mês ficaram <b>separados</b> desta gestão.</span><span class="t-primary" style="display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap">Ver viagens ${icon("right", 'style="width:16px;height:16px"')}</span></a>`;

function deleteTripDialog(trip) {

// A failed render must never leave a blank screen: show a way out instead (nothing is erased).
function render() {
  try { renderPage(); } catch (err) {
    console.error("render failed", err);
    document.getElementById("app").innerHTML = `<main><section class="card" role="alert" style="max-width:520px;margin:48px auto;padding:24px">
      <h1 class="h-card">Algo deu errado ao abrir esta tela</h1>

  }
}
function renderPage() {
  if (paintBeta() === "expired") return showBetaExpired(); // after the last day nothing else runs
  // Fixed items only need materializing after a change to them, a data swap or a new month.
  if (needsOccurrences || occurrencesMonth !== currentMonth()) {
    ensureOccurrences();
    needsOccurrences = false;
    occurrencesMonth = currentMonth();
  }
  monthIndex = null;
  captureIncoming();
  let r = route();
  // Logged in: the auth pages lead to the app. Not logged in and not "sem conta": show the login.
  if (AUTH_PAGES.includes(r.path) && sync) { history.replaceState(null, "", href("painel")); r = route(); }
  if (!AUTH_PAGES.includes(r.path) && !sync && !isLocalMode()) { history.replaceState(null, "", href("entrar")); r = route(); }
  if (AUTH_PAGES.includes(r.path)) {
    if (tourState.el) endTour({ save: false });
    unmountAssistant();
    document.getElementById("app").innerHTML = viewAuth();
    document.title = "Entrar · Nexus Financy IA";
    return;
  }
  document.getElementById("app").innerHTML = shell(r, VIEWS[r.path](r));
  paintReels();
  if (tabsPath !== r.path) { tabsMemory.clear(); tabsPath = r.path; } // another screen: its bars do not glide from the last one
  paintTabs(document.getElementById("app"));
  mountAssistant();
  maybeStartTour(r);
  if (drawerEl) setPageInert(true); // the redraw made new, interactive copies of what sits behind the drawer
  if (hasIncoming()) flushIncoming();
  document.title = `${(ROUTES.find((x) => x.path === r.path) || extraRoute(r.path) || PROFILE_ROUTE).label} · Nexus Financy IA`;
}

// <toast-timer> Self-contained: tests/toast-timer.test.ts loads this block from the file.
const TOAST_MIN_MS = 4000, TOAST_MAX_MS = 4500, TOAST_SHORT_CHARS = 40, TOAST_LONG_CHARS = 120;
/** 4 s for short messages, growing linearly to 4.5 s for long ones. */
function toastDuration(text) {
  const t = Math.min(Math.max((text.length - TOAST_SHORT_CHARS) / (TOAST_LONG_CHARS - TOAST_SHORT_CHARS), 0), 1);
  return Math.round(TOAST_MIN_MS + t * (TOAST_MAX_MS - TOAST_MIN_MS));
}
/** A timeout that can be paused and resumed with the time it had left. */
function pausableTimer(ms, onDone, clock = { now: () => Date.now(), set: (f, d) => setTimeout(f, d), clear: (i) => clearTimeout(i) }) {
  let left = ms, started = null, id = null, done = false;
  const run = () => { started = clock.now(); id = clock.set(() => { done = true; onDone(); }, left); };
  run();
  return {
    pause() { if (started === null || done) return; clock.clear(id); left = Math.max(left - (clock.now() - started), 0); started = null; },
    resume() { if (started !== null || done) return; run(); },
    cancel() { clock.clear(id); done = true; },
  };
}
// </toast-timer>
let toastCurrent = null;
function toast(msg) {
  if (toastCurrent) toastCurrent.dispose();
  const region = document.getElementById("toast-region");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span class="toast-icon">${icon("checkCircle")}</span><span class="toast-text t-stagger"><span class="t-stagger-line">${esc(msg)}</span></span><button type="button" class="toast-close" aria-label="Fechar notificação">${icon("x")}</button>`;
  const text = el.querySelector(".t-stagger");
  let hovered = false, focused = false, hideTimer = null;
  const timer = pausableTimer(toastDuration(msg), () => hide());
  const dispose = () => { timer.cancel(); clearTimeout(hideTimer); el.remove(); if (toastCurrent && toastCurrent.el === el) toastCurrent = null; };
  function hide() {
    timer.cancel();
    if (reduced) return dispose();
    text.classList.add("is-hiding"); text.classList.remove("is-shown"); el.classList.add("is-leaving");
    hideTimer = setTimeout(dispose, 200);
  }
  const sync = () => (hovered || focused ? timer.pause() : timer.resume());
  el.addEventListener("pointerenter", () => { hovered = true; sync(); });
  el.addEventListener("pointerleave", () => { hovered = false; sync(); });
  el.addEventListener("focusin", () => { focused = true; sync(); });
  el.addEventListener("focusout", () => { focused = false; sync(); });
  el.querySelector(".toast-close").addEventListener("click", () => dispose());
  region.appendChild(el);
  void el.offsetHeight; text.classList.add("is-shown");
  toastCurrent = { el, dispose };
}
/** Replays the shake from a clean baseline; a newer shake is not cut short by an older timer. */
function shakeInput(input) {
  input.classList.remove("is-shaking"); void input.offsetWidth; input.classList.add("is-shaking");
  clearTimeout(input._shakeTimer); input._shakeTimer = setTimeout(() => input.classList.remove("is-shaking"), 80 * 2 + 60 * 2 + 20);
}
function showErrors(errors, root = document.getElementById("modal")) {
  root.querySelectorAll(".err").forEach((e) => e.remove());
  root.querySelectorAll("[aria-invalid]").forEach((e) => e.removeAttribute("aria-invalid"));
  for (const [name, msg] of Object.entries(errors)) {
    const input = root.querySelector(`[name="${name}"]`); if (!input) continue;
    input.setAttribute("aria-invalid", "true");
    shakeInput(input);
    const p = document.createElement("p"); p.className = "err"; p.textContent = msg;
    input.closest(".field").appendChild(p);
  }
  const firstBad = root.querySelector("[aria-invalid]"); if (firstBad) firstBad.focus();
}
const field = (label, name, control, cls = "", hint = "") => `<div class="field ${cls}"><label for="f-${name}">${label}</label>${control}${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
const input = (name, value = "", attrs = "") => `<input class="input" id="f-${name}" name="${name}" value="${esc(value)}" ${attrs}>`;
// Amount fields use the card-machine mask (see maskMoneyInput): typing 5230 shows 52,30.
// With negative, typing "-" makes it a withdrawal (the goal deposit).
const moneyInput = (name, cents, { negative = false } = {}) => `<div class="money"><span>R$</span><input class="input" id="f-${name}" name="${name}" inputmode="${negative ? "text" : "numeric"}" autocomplete="off" placeholder="0,00" data-money-mask="${negative ? "neg" : ""}" value="${cents ? `${cents < 0 ? "-" : ""}${formatCentsInput(Math.abs(cents))}` : ""}"></div>`;

// Photo chosen in the open form: a new Blob, or "removed" for the existing one.
let formPhoto = { blob: null, removed: false, existingId: null };
async function renderPhotoSlot() {
  const slot = document.getElementById("photo-slot"); if (!slot) return;
  const { blob, removed, existingId } = formPhoto;
  const show = blob || (!removed && existingId ? await getPhoto(existingId) : null);
  if (!document.getElementById("photo-slot")) return;
  if (show) {
    const url = URL.createObjectURL(show);
    slot.innerHTML = `<div class="photo-row"><button type="button" class="thumb" data-act="photo-view" aria-label="Ver comprovante"><img src="${url}" alt="Comprovante"></button>
      <div class="actions"><button type="button" class="btn btn-secondary btn-sm" data-act="photo-view">Ver</button><label class="btn btn-ghost btn-sm" for="photo-input">Trocar</label><button type="button" class="btn btn-ghost btn-sm" data-act="photo-remove">${icon("trash")} Remover</button></div></div>`;
    slot.querySelector("img").addEventListener("load", () => URL.revokeObjectURL(url), { once: true });
    formPhoto.shown = show;
  } else if (!removed && existingId) {
    slot.innerHTML = `<p class="hint">Comprovante indisponível neste aparelho (sem internet ou foi removido).</p><label class="btn btn-secondary btn-sm" for="photo-input" style="margin-top:8px">${icon("camera")} Trocar foto</label>`;

const VOICE_EXAMPLE = { EXPENSE: "Ex.: “Gastei 52,30 no mercado ontem”", INCOME: "Ex.: “Recebi 2500,00 de salário hoje”" };

  let type = tx?.type || presetType || "EXPENSE";
  const preTrip = presetTrip && tripById(presetTrip);
  const defaultDate = preTrip && !(todayISO() >= preTrip.startDate && todayISO() <= preTrip.endDate) ? preTrip.startDate : todayISO();
  formPhoto = { blob: null, removed: false, existingId: tx?.attachmentId || null };

    const d = document.getElementById("modal") ? formData() : {};
    openModal({
      title: title(),
      sub: tx?.recurringId ? "Ocorrência de um gasto fixo. Alterar aqui não muda os outros meses." : "Preencha os detalhes do lançamento.",
      body: `<div class="form-grid two">
        ${tabsHtml({ kind: "radio", key: "tx-type", label: "Tipo", fill: true, cls: "full", active: type, items: [{ value: "EXPENSE", label: "Despesa", tone: "exp", attrs: 'data-act="tx-type" data-type="EXPENSE"' }, { value: "INCOME", label: "Receita", tone: "inc", attrs: 'data-act="tx-type" data-type="INCOME"' }] })}
        ${!tx && SpeechRec ? `<div class="full" id="voice-slot" aria-live="polite"></div>` : ""}
        ${field("Descrição", "description", input("description", d.description ?? tx?.description ?? "", `placeholder="${TX_DESCRIPTION_HINT[type]}" maxlength="120" autofocus`), "full")}
        ${field("Valor", "amount", moneyInput("amount", d.amount ? parseMoneyToCents(d.amount) : tx?.amountCents))}
        ${field("Data", "date", input("date", d.date ?? tx?.date ?? defaultDate, 'type="date"'))}
        ${field("Categoria", "categoryId", catSelect(type, d.categoryId ?? tx?.categoryId))}
        ${state.trips.length && !tx?.recurringId ? field("Viagem", "tripId", `<select class="input" id="f-tripId" name="tripId"><option value="">Nenhuma (gestão do mês)</option>${[...state.trips].sort((a, b) => (a.startDate < b.startDate ? 1 : -1)).map((x) => `<option value="${x.id}" ${(d.tripId ?? tx?.tripId ?? presetTrip) === x.id ? "selected" : ""}>✈ ${esc(x.name)}</option>`).join("")}</select>`, "full") : ""}
        ${field("Situação", "status", `<select class="input" id="f-status" name="status">${["PAID", "PENDING", "REVIEW"].map((v) => `<option value="${v}" ${normalizeStatus(d.status ?? tx?.status) === v ? "selected" : ""}>${statusLabel(v, type)}</option>`).join("")}</select>`)}
        ${field("Observações", "notes", `<textarea class="input" id="f-notes" name="notes" maxlength="500">${esc(d.notes ?? tx?.notes ?? "")}</textarea>`, "full")}
        <div class="field full"><span class="field-label">Comprovante (opcional)</span><div id="photo-slot"></div><input type="file" id="photo-input" accept="image/*" hidden></div>
      </div>`,
      foot: `${tx ? `<button type="button" class="btn btn-danger btn-sm left" data-act="del-tx" data-id="${tx.id}">${icon("trash")} Excluir</button>` : ""}<button type="button" class="btn btn-secondary btn-sm" data-act="close">Cancelar</button><button type="submit" class="btn btn-primary btn-sm">${icon("check")} Salvar</button>`,
      onSubmit: async () => {
        const v = formData(), errors = {}, amount = parseMoneyToCents(v.amount);
        if (!v.description.trim()) errors.description = "Informe uma descrição.";
        if (amount === null || amount <= 0) errors.amount = "Informe um valor maior que zero.";
        if (!isDate(v.date)) errors.date = "Data inválida.";
        if (Object.keys(errors).length) return showErrors(errors);
        let attachmentId = formPhoto.existingId;
        if (formPhoto.blob) {
          attachmentId = uid();
          try { await photoDb.put({ id: attachmentId, blob: formPhoto.blob, uploaded: false }); }
          catch { return toast("Este navegador não permitiu guardar a foto (modo privado?)."); }
        } else if (formPhoto.removed) attachmentId = null;
        if (formPhoto.existingId && attachmentId !== formPhoto.existingId) deletePhoto(formPhoto.existingId);
        const data = { type, description: v.description.trim(), amountCents: amount, date: v.date, categoryId: v.categoryId || null, status: normalizeStatus(v.status), notes: v.notes.trim(), attachmentId, tripId: v.tripId || null };
        if (tx) Object.assign(state.transactions.find((t) => t.id === tx.id), data);
        else state.transactions.push({ id: uid(), source: "MANUAL", recurringId: null, period: null, createdAt: Date.now(), ...data });

  // Switching the type repaints only what depends on it: no new dialog (its slide-in made it flicker),

  txForm.setType = (t) => {

    if (cat) cat.innerHTML = catOptions(type, cat.value);
    const paid = document.querySelector('#f-status option[value="PAID"]');
    if (paid) paid.textContent = type === "INCOME" ? "Recebido" : "Pago";

    renderVoiceSlot();
  };

  stopVoice();
  voiceUi = { mode: "idle", text: "" }; voiceForm = "tx";

// ---------- Native app (Capacitor) ----------
// mobile/ bundles this same file into the Android/iOS app. Everything below only switches on there;
// in a browser NATIVE is false and the site behaves as before.
const NATIVE = !!window.Capacitor?.isNativePlatform?.();
// Native plugins are reachable only through Capacitor.registerPlugin, which comes from capacitor.js; the app copy
// loads it (mobile/scripts/copy-web.mjs). Only plugins the app actually ships (PluginHeaders) are registered.
const NativePlugins = {};
// <theme>
// The saved choice is "dark" or "light"; nothing saved means dark. The head script applies it before paint.
const THEME_KEY = "mf-theme";
const THEME_COLORS = { dark: "#090d16", light: "#f8fafc" };
const themeName = (v) => (v === "light" ? "light" : "dark");
// </theme>
function setTheme(t) {
  t = themeName(t);
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  syncChrome(t);
}
// Browser address bar and, in the app, the Android status bar follow the theme. The web has no StatusBar plugin: no-op there.
function syncChrome(t) {
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = THEME_COLORS[t];
  const bar = NativePlugins.StatusBar; if (!bar) return;
  // "Dark" style means light icons, for a dark bar.
  bar.setStyle({ style: t === "dark" ? "DARK" : "LIGHT" }).catch(() => {});
  bar.setBackgroundColor({ color: THEME_COLORS[t] }).catch(() => {});
}
if (NATIVE) {
  const cap = window.Capacitor, register = cap.registerPlugin || window.capacitorExports?.registerPlugin;
  const shipped = new Set((cap.PluginHeaders || []).map((h) => h.name));
  // BankNotifications is only registered with the flag on: without it BankNotif() is undefined, so nothing below
  // (status, queue, the "enable" prompt, the listener) ever reaches the native side or asks for access.
  for (const name of ["App", ...(ENABLE_BANK_NOTIFICATIONS ? ["BankNotifications"] : []), "Browser", "Filesystem", "Share", "SocialLogin", "SpeechRecognition", "StatusBar"]) {
    if (register && shipped.has(name)) NativePlugins[name] = register(name);
  }
}

// The app's WebView has no SpeechRecognition, so the native plugin stands in with the same small interface.
// Partial results show the words while the person speaks, but the Android plugin has two quirks in that mode:
// it reports "stopped" before the final text, and its errors (nothing heard, no network) never reach us because
// start() already resolved. So: wait a moment after "stopped" for the final text, stop by ourselves after a
// silence, and always end within a hard limit, so the button never stays on "Ouvindo".
const SPEECH_SILENCE_MS = 2500;      // quiet after the last words: done
const SPEECH_NOTHING_MS = 7000;      // no words at all since the start: give up
const SPEECH_FINAL_GRACE_MS = 1500;  // after stopping, wait this long for the final text
class NativeSpeech {
  start() {
    const P = NativePlugins.SpeechRecognition, handles = [];
    let heard = false, stopping = false, quiet = 0, grace = 0;
    this._end = () => {
      if (this._ended) return;
      this._ended = true; clearTimeout(quiet); clearTimeout(grace);
      handles.forEach((h) => h.remove?.());
      P.stop().catch(() => {});
      this.onend?.();
    };
    // Ends shortly after stopping; a final text arriving meanwhile ends it sooner.
    this._finishSoon = (ms = SPEECH_FINAL_GRACE_MS) => { stopping = true; clearTimeout(quiet); clearTimeout(grace); grace = setTimeout(() => this._end(), ms); };
    const waitQuiet = () => { clearTimeout(quiet); quiet = setTimeout(() => this.stop(), heard ? SPEECH_SILENCE_MS : SPEECH_NOTHING_MS); };
    (async () => {
      try {
        const perm = await P.requestPermissions();
        if (perm.speechRecognition !== "granted") { this.onerror?.({ error: "not-allowed" }); return this._end(); }
        handles.push(await P.addListener("partialResults", (d) => {
          const t = d.matches?.[0];
          if (!t || this._aborted || this._ended) return;
          heard = true;
          this.onresult?.({ results: [[{ transcript: t }]] });
          if (stopping) this._finishSoon(400); else waitQuiet();
        }));
        handles.push(await P.addListener("listeningState", (d) => {
          if (d.status === "stopped" && !stopping) this._finishSoon();
        }));
        await P.start({ language: "pt-BR", maxResults: 1, partialResults: true, popup: false });
        if (!this._ended) waitQuiet();
      } catch (e) {
        const msg = String(e?.message || e);
        this.onerror?.({ error: /permission/i.test(msg) ? "not-allowed" : /network/i.test(msg) ? "network" : /audio/i.test(msg) ? "audio-capture" : "no-speech" });
        this._end();
      }
    })();
  }
  stop() {
    if (this._ended) return;
    NativePlugins.SpeechRecognition.stop().catch(() => {});
    this._finishSoon?.();
  }
  abort() { this._aborted = true; this._end?.(); }
}

// Files (backup) cannot be downloaded from the WebView: save to the app cache and open the share sheet.
async function shareFile(name, text) {
  const { uri } = await NativePlugins.Filesystem.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
  await NativePlugins.Share.share({ title: name, url: uri, dialogTitle: "Salvar ou enviar o backup" });
}

// App updates: CI publishes every Android build as the pre-release "app-latest", with "<!-- build:N -->" in its
// notes. Every time the app opens, and on return to it at most once an hour, we compare N with the installed versionCode.
const APP_RELEASE_API = "https://api.github.com/repos/gabrielmacsantos/sistema_gestao/releases/tags/app-latest";
const UPDATE_KEY = "mf-app-update";
const UPDATE_EVERY = 3600 * 1000;
let appUpdate = null; // { build, url, notes } while a newer build is waiting
let appVersion = ""; // "1.0.0 (build 8)" inside the app

function readUpdateState() { try { return JSON.parse(localStorage.getItem(UPDATE_KEY) || "{}"); } catch { return {}; } }
function writeUpdateState(s) { try { localStorage.setItem(UPDATE_KEY, JSON.stringify(s)); } catch {} }

async function checkAppUpdate(onOpen = false) {
  if (!NATIVE || !NativePlugins.App?.getInfo) return;
  const info = await NativePlugins.App.getInfo().catch(() => null);
  const installed = Number(info?.build) || 0;
  if (info?.version) appVersion = `${info.version} (build ${info.build})`;
  let s = readUpdateState();
  if (onOpen || !s.checkedAt || Date.now() - s.checkedAt > UPDATE_EVERY) {
    try {
      const res = await fetch(APP_RELEASE_API, { headers: { Accept: "application/vnd.github+json" } });
      if (res.ok) {
        const rel = await res.json(), body = rel.body || "";
        const url = (rel.assets || []).find((a) => a.name === "minhas-financas.apk")?.browser_download_url;
        const notes = body.split("\n").filter((l) => /^- /.test(l)).slice(0, 5).map((l) => l.slice(2).trim());
        s = { ...s, checkedAt: Date.now(), build: Number(/build:(\d+)/.exec(body)?.[1]) || 0, url, notes };
        writeUpdateState(s);
      }
    } catch { /* offline: try again next time */ }
  }
  const next = s.build > installed && s.url && s.dismissed !== s.build ? { build: s.build, url: s.url, notes: s.notes || [] } : null;
  if ((next?.build || 0) !== (appUpdate?.build || 0)) { appUpdate = next; render(); }
}
function updateBanner() {
  if (!appUpdate) return "";
  return `<div class="notice" style="margin-bottom:16px"><span class="t-primary" style="display:flex">${icon("down")}</span>
    <div style="flex:1;min-width:180px"><p><b>Nova versão do app disponível</b></p>${appUpdate.notes.length ? `<ul class="hint" style="margin:4px 0 0;padding-left:18px">${appUpdate.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
    <span class="actions"><button class="btn btn-ghost btn-sm" data-act="update-later">Agora não</button><button class="btn btn-primary btn-sm" data-act="update-app">Atualizar</button></span></div>`;
}

if (NATIVE) {
  // Links to other sites open in the in-app browser instead of replacing the app.
  document.addEventListener("click", (e) => {
    const a = e.target.closest?.("a[href]");
    if (!a || !/^https?:/.test(a.href) || a.origin === location.origin) return;
    e.preventDefault(); NativePlugins.Browser?.open({ url: a.href });
  }, true);
  // Android back button: close what is open first, then go back, then leave the app.
  NativePlugins.App?.addListener("backButton", ({ canGoBack }) => {
    const viewer = document.querySelector(".viewer");
    if (viewer) viewer.click();
    else if (drawerEl) closeDrawer();
    else if (document.querySelector(".overlay")) closeModal();
    else if (canGoBack) history.back();
    else NativePlugins.App.exitApp();
  });
  NativePlugins.App?.addListener("resume", () => { checkAppUpdate(); onAppForeground(); });
  // A bank notification arrived while the app is open: bring it in right away.
  NativePlugins.BankNotifications?.addListener("queued", () => pullNativeNotifications());
}

  "audio-capture": "Nenhum microfone encontrado neste aparelho.",

  "language-not-supported": "Este navegador não reconhece fala em português.",

let voiceUi = { mode: "idle", text: "" }; // idle | consent | listening | done

function renderVoiceSlot() {
  const slot = document.getElementById("voice-slot"); if (!slot) return;
  const { mode, text } = voiceUi;
  if (mode === "consent") {
    slot.innerHTML = `<div class="voice-note"><p><b>Antes de falar:</b> quem transforma sua fala em texto é o serviço de voz do navegador (Google no Chrome e no Android, Apple no Safari), que recebe o áudio. Os campos são só preenchidos: nada é salvo sem você conferir.</p>
      <div class="actions"><button type="button" class="btn btn-secondary btn-sm" data-act="voice-cancel">Agora não</button><button type="button" class="btn btn-primary btn-sm" data-act="voice-accept">${icon("mic")} Entendi, falar</button></div></div>`;
    return;
  }
  const fixed = voiceForm === "rec", income = (fixed ? recForm : txForm).getType?.() === "INCOME";
  paintVoiceCard(slot, {
    listening: mode === "listening", text, micAttr: 'data-act="voice"',
    bubble: fixed ? (income ? "Qual receita fixa você quer cadastrar?" : "Qual gasto fixo você quer cadastrar?") : income ? "Qual receita você quer lançar?" : "Qual gasto você quer lançar?",

    caption: mode === "listening" ? "Ouvindo… toque para parar" : mode === "done" ? "Toque para falar de novo" : "Toque para falar",
  });
}

// The "Assistente de voz" card, shared by the transaction form and the quick assistant's chat.
function paintVoiceCard(slot, { listening, bubble, meta, caption, text, micAttr }) {
  let card = slot.querySelector(".va-card");
  if (!card) {
    slot.innerHTML = `<div class="va-card">
      <div class="va-glow" aria-hidden="true"></div>
      <div class="va-content">
        <header class="va-top"><span class="va-av" aria-hidden="true">${icon("mic")}</span>
          <div class="va-top-text"><span class="va-name">Assistente de voz</span><span class="va-meta"></span></div></header>
        <div class="va-divider" aria-hidden="true"></div>
        <div class="va-body">
          <div class="va-bubble-row"><p class="va-bubble"><span></span></p></div>
          <p class="va-transcript" aria-live="polite"></p>
        </div>
        <div class="va-bottom">
          <span class="va-caption"><span class="va-swap" aria-live="polite"></span></span>
          <button type="button" class="va-mic" ${micAttr} aria-pressed="false"><span class="va-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>
        </div>
      </div></div>`;
    card = slot.firstElementChild;
  }
  card.classList.toggle("is-live", listening);
  const mic = card.querySelector(".va-mic");
  mic.classList.toggle("is-live", listening);
  mic.setAttribute("aria-pressed", String(listening));
  mic.setAttribute("aria-label", listening ? "Parar de falar" : "Falar o lançamento");
  card.querySelector(".va-bubble span").textContent = bubble;
  card.querySelector(".va-meta").textContent = meta;
  swapText(card.querySelector(".va-swap"), caption);
  setTranscript(card.querySelector(".va-transcript"), text);
}

// Caption swap: the old text blurs up and out, the new one comes in from below (150 ms).
function swapText(el, value) {
  if (el.textContent === "") { el.textContent = value; return; }
  if (el.dataset.next === value || (!el.dataset.next && el.textContent === value)) return;
  el.dataset.next = value;
  el.classList.add("is-exit");
  setTimeout(() => {
    el.textContent = el.dataset.next; delete el.dataset.next;
    el.classList.remove("is-exit"); el.classList.add("is-enter");
    void el.offsetHeight;
    el.classList.remove("is-enter");
  }, 150);
}

// The transcript streams in word by word: new words fade in, a corrected prefix redraws the line.
function setTranscript(el, text) {
  const words = text ? text.split(" ") : [];
  const have = Array.from(el.children);
  if (have.length > words.length || have.some((w, i) => w.textContent.trim() !== words[i])) { el.textContent = ""; have.length = 0; }
  const fresh = [];
  for (let i = el.children.length; i < words.length; i++) {
    const w = document.createElement("span");
    w.className = "va-w"; w.textContent = words[i] + (i < words.length - 1 ? " " : "");
    el.append(w); fresh.push(w);
  }
  if (el.children.length > 1) { const last = el.children[el.children.length - 2]; if (!last.textContent.endsWith(" ")) last.textContent += " "; }
  if (fresh.length) { void el.offsetHeight; fresh.forEach((w) => w.classList.add("is-in")); }
}

function voiceButton() {
  if (voice) { try { voice.rec.stop(); } catch {} return; }
  let ok = false; try { ok = localStorage.getItem(VOICE_OK_KEY) === "1"; } catch {}
  if (ok) startVoice(); else { voiceUi = { mode: "consent", text: "" }; renderVoiceSlot(); }
}

function startVoice() {
  stopAsstVoice();
  let rec;
  try { rec = new SpeechRec(); } catch { return toast("Não foi possível usar o microfone neste navegador."); }
  rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  const session = { rec, text: "", error: "" };
  rec.onresult = (e) => {
    if (voice !== session) return;
    session.text = Array.from(e.results, (r) => r[0].transcript).join(" ").replace(/\s+/g, " ").trim();
    const el = document.querySelector("#voice-slot .va-transcript"); if (el) setTranscript(el, session.text);
  };
  rec.onerror = (e) => { session.error = e.error; };
  rec.onend = () => { if (voice === session) { voice = null; finishVoice(session); } };
  voice = session;
  voiceUi = { mode: "listening", text: "" }; renderVoiceSlot();
  try { rec.start(); } catch { voice = null; voiceUi = { mode: "idle", text: "" }; renderVoiceSlot(); toast("Não foi possível usar o microfone neste navegador."); }
}

// Ends listening without filling anything (form closed or type switched by hand).
function stopVoice() {
  if (!voice) return;
  const s = voice; voice = null; voiceUi = { mode: "idle", text: "" };
  try { s.rec.abort(); } catch {}
}

function finishVoice(session) {
  if (!document.getElementById("voice-slot")) return;
  if (!session.text) {
    voiceUi = { mode: "idle", text: "" }; renderVoiceSlot();
    if (session.error !== "aborted") toast(VOICE_ERRORS[session.error] || "Não ouvi nada. Toque no microfone e fale de novo.");
    return;
  }
  const p = parseSpokenTransaction(session.text, state.categories, todayISO());
  voiceUi = { mode: "done", text: session.text };
  const fill = (name, value) => {
    const el = document.querySelector(`#modal [name="${name}"]`); if (!el || value == null) return;
    el.value = value; el.classList.add("voice-filled"); el.removeAttribute("aria-invalid");
    el.closest(".field")?.querySelector(".err")?.remove();
  };
  if (voiceForm === "rec") {
    // A fixed expense has no date: the spoken "dia 5" becomes the due day, and "todo mês" is not part of the name.
    if (p.type !== recForm.getType()) recForm.setType(p.type); else renderVoiceSlot();
    const day = /\bdia\s+(\d{1,2})\b/i.exec(session.text), n = day ? Number(day[1]) : 0;
    fill("description", (p.description || "").replace(/\s+(todo|toda|todos|todas)(\s+(m[eê]s|dia))?$/i, "").trim() || null);
    fill("amount", p.amountCents ? formatCentsInput(Math.min(p.amountCents, 99999999999)) : null);
    fill("day", n >= 1 && n <= 31 ? n : null);
    fill("categoryId", p.categoryId);
    return;
  }
  if (p.type !== txForm.getType()) txForm.setType(p.type); else renderVoiceSlot();
  fill("description", p.description);
  fill("amount", p.amountCents ? formatCentsInput(Math.min(p.amountCents, 99999999999)) : null);
  fill("date", p.date);
  fill("categoryId", p.categoryId);
  fill("status", p.status);
}

// ---------- Quick assistant (floating balloon: chat + calculator) ----------

const asstEl = () => document.getElementById("asst");
const asstBot = (text, chips = null) => ({ from: "bot", text, chips });
const CALC_KEYS = [

function mountAssistant() {
  if (asstEl()) return;
  document.body.insertAdjacentHTML("beforeend", assistantHtml());
  const root = asstEl();
  root.addEventListener("click", onAsstClick);
  root.addEventListener("submit", onAsstSubmit);
}
function unmountAssistant() { stopAsstVoice(); asstEl()?.remove(); asst.view = "closed"; }

// view: closed | menu | chat | calc. The layers swap by CSS (data-state); inert keeps the hidden ones out of reach.
function asstSet(view, { focus = true } = {}) {
  const root = asstEl(); if (!root) return;
  if (asst.view === "chat" && view !== "chat") stopAsstVoice();
  asst.view = view; root.dataset.state = view;
  root.querySelectorAll(".asst-layer").forEach((l) => { l.inert = l.dataset.layer !== view; });
  const trigger = root.querySelector(".asst-trigger");
  trigger.setAttribute("aria-expanded", String(view !== "closed"));
  trigger.inert = view !== "closed";
  if (view === "chat") {
    if (!asst.greeted) {
      asst.greeted = true;
      asst.msgs.push(asstBot("Oi! Diga ou escreva um lançamento, seja uma despesa (“Gastei 45,90 no almoço hoje”) ou uma receita (“Recebi 2.500 de salário”). Eu preencho Descrição, Valor, Categoria, Data e Situação. Se faltar algo, eu pergunto.", [
        ...asstOptionChips(),
      ]));
    }

  if (view === "calc") paintCalc();
  if (!focus) return;
  setTimeout(() => {
    const layer = root.querySelector(`[data-layer="${view}"]`);
    const target = view === "closed" ? trigger : view === "chat" && matchMedia("(min-width: 768px)").matches ? layer.querySelector('input[name="text"]') : layer.querySelector("button");
    target?.focus({ preventScroll: true });
  }, 0);
}

// ----- Chat -----
/** The composer's hint follows what the chat is waiting for. */

  const log = asstEl()?.querySelector(".asst-log"); if (!log) return;
  log.innerHTML = asst.msgs.map((m, i) => m.from === "card" ? asstCardHtml(m, i)

function paintComposer() {
  const mic = asstEl()?.querySelector(".asst-mic"); if (!mic) return;

}
function asstCardHtml(m, i) {

// The page behind redraws after the chat has painted, so the answer never waits for a full render.
let renderTimer = null;
function renderSoon() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 160); }

function asstCancel(text = "Tudo bem, cancelei. Quando quiser, é só falar de novo.") {
  asst.draft = null; asst.awaiting = null; asst.preType = null;
  asst.msgs.push(asstBot(text, asstOptionChips())); paintChat();
}
function asstSubmit(raw) {
  const text = String(raw).trim().slice(0, 200); if (!text) return;
  const last = asst.msgs[asst.msgs.length - 1]; if (last?.chips) last.chips = null;
  asst.msgs.push({ from: "user", text });
  if (/^cancel/i.test(text.normalize("NFD").replace(/[̀-ͯ]/g, ""))) return asstCancel();
  const ctx = { categories: state.categories, today: todayISO(), parse: parseSpokenTransaction, parseMoney: parseMoneyToCents };
  if (asst.awaiting && asst.draft) {
    const next = assistantReply(asst.draft, asst.awaiting, text, ctx);
    const understood = asst.awaiting === "amount" ? next.amountCents !== asst.draft.amountCents : next.categoryId !== asst.draft.categoryId;
    const fresh = assistantDraft(parseSpokenTransaction(text, state.categories, ctx.today));
    if (understood) asst.draft = next;
    else if (asst.awaiting === "category" && fresh.amountCents) asst.draft = fresh; // a whole new sentence instead of a category
    else if (asst.awaiting === "amount") { asst.msgs.push(asstBot("Não entendi o Valor. Diga ou escreva, por exemplo, 45,90.", [{ label: "Cancelar", kind: "cancel", muted: true }])); return paintChat(); }
    else { asst.msgs.push(asstBot("Não achei essa Categoria. Escolha uma das opções:")); return asstAsk(); }
  } else {
    const parsed = parseSpokenTransaction(text, state.categories, ctx.today);
    asst.draft = assistantDraft(assistantForceType(parsed, asst.preType, (type) => parseSpokenTransaction.guessCategory(text, state.categories, type)));
    asst.preType = null;
  }
  asst.awaiting = null;
  asstAdvance();
}
// Asks for what is missing, or saves when nothing is.
function asstAdvance() {
  const d = asst.draft;
  if (assistantMissing(d) === "category" && !state.categories.some((c) => c.type === d.type)) d.categoryId = "";
  if (assistantMissing(d)) return asstAsk();
  const t = assistantTransaction(d, todayISO(), catById(d.categoryId)?.name);
  const tx = { id: uid(), source: "MANUAL", recurringId: null, period: null, notes: "", createdAt: Date.now(), ...t };
  state.transactions.push(tx); save(); renderSoon();
  asst.draft = null; asst.awaiting = null;
  asst.msgs.push(asstBot((t.type === "INCOME" ? "Receita lançada." : "Despesa lançada.") + " Toque em Editar para ajustar."), { from: "card", id: tx.id, editing: false, confirmDel: false });
  paintChat();
}
function asstAsk() {
  const d = asst.draft, cancel = { label: "Cancelar", kind: "cancel", muted: true }, back = { label: "Voltar ao início", kind: "restart", muted: true };
  if (assistantMissing(d) === "amount") {
    asst.awaiting = "amount";
    asst.msgs.push(asstBot(`Valor: qual foi o valor${d.description ? ` de “${d.description}”` : ""}? Escreva ou diga, por exemplo, 45,90.`, [back, cancel]));
  } else {
    asst.awaiting = "category";
    const cats = state.categories.filter((c) => c.type === d.type).sort((a, b) => a.name.localeCompare(b.name));
    const income = d.type === "INCOME";
    asst.msgs.push(asstBot(`Categoria: em qual categoria entra ${income ? "esta receita" : "este gasto"}?${d.description ? `
Descrição: ${d.description}` : ""}
Valor: ${fmt(d.amountCents)}`, [
      ...cats.map((c) => ({ label: c.name, kind: "cat", value: c.id })),
      { label: income ? "É uma despesa" : "É uma receita", kind: "type", muted: true },
      { label: "Sem categoria", kind: "cat", value: "", muted: true }, back, cancel,
    ]));
  }
  paintChat();
}
function asstChip(m, c) {
  const msg = asst.msgs[m], chip = msg?.chips?.[c]; if (!chip) return;
  msg.chips = null;
  if (chip.kind === "cancel") return asstCancel();
  if (chip.kind === "type-set") {
    asst.preType = chip.value;
    asst.msgs.push({ from: "user", text: chip.label });
    asst.msgs.push(asstBot(chip.value === "INCOME" ? "Receita: diga ou escreva, por exemplo, “Recebi 2.500 de salário hoje”." : "Despesa: diga ou escreva, por exemplo, “Gastei 45,90 no almoço hoje”.", [{ label: "Voltar e escolher outra opção", kind: "restart", muted: true }]));
    return paintChat();
  }
  if (chip.kind === "restart") {
    asst.preType = null; asst.draft = null; asst.awaiting = null;
    asst.msgs.push({ from: "user", text: "Voltar" });
    asst.msgs.push(asstBot("Sem problema. O que você quer registrar?", asstOptionChips()));
    return paintChat();
  }
  if (!asst.draft) return paintChat();
  asst.msgs.push({ from: "user", text: chip.label });
  if (chip.kind === "type") { asst.draft.type = asst.draft.type === "INCOME" ? "EXPENSE" : "INCOME"; asst.draft.categoryId = null; }
  else asst.draft.categoryId = chip.value;
  asst.awaiting = null;
  asstAdvance();
}
function asstSaveEdit(form) {
  const msg = asst.msgs[Number(form.dataset.m)], tx = state.transactions.find((t) => t.id === msg?.id); if (!tx) return;
  const f = new FormData(form), description = String(f.get("description")).trim(), cents = parseMoneyToCents(f.get("amount")), date = String(f.get("date")), categoryId = String(f.get("categoryId") || "");
  if (!description) return toast("Informe uma descrição.");
  if (cents === null || cents <= 0 || cents > ASSISTANT_MAX_CENTS) return toast("Informe um valor maior que zero.");
  if (!isDate(date)) return toast("Data inválida.");
  Object.assign(tx, { description: description.slice(0, 120), amountCents: cents, date, categoryId: catById(categoryId)?.type === tx.type ? categoryId : null, status: normalizeStatus(f.get("status")) });
  save(); renderSoon(); msg.editing = false; paintChat();
}

// ----- Voice: the same "Assistente de voz" card, service and notice as the transaction form -----
const asstPrompt = () => (asst.awaiting === "amount" ? "Qual foi o valor?" : asst.awaiting === "category" ? "Em qual categoria entra?" : "O que você quer lançar?");
function paintAsstVoice() {
  const layer = asstEl()?.querySelector('[data-layer="chat"]'); if (!layer) return;
  const slot = layer.querySelector(".asst-voice"), mode = asst.voiceMode;

  if (mode === "idle") { slot.innerHTML = ""; const log = layer.querySelector(".asst-log"); log.scrollTop = log.scrollHeight; return; }
  if (mode === "consent") {
    slot.innerHTML = `<div class="voice-note"><p><b>Antes de falar:</b> quem transforma sua fala em texto é o serviço de voz do navegador (Google no Chrome e no Android, Apple no Safari), que recebe o áudio. Depois, o lançamento é salvo na hora e você pode editar ou excluir no cartão.</p>
      <div class="actions"><button type="button" class="btn btn-secondary btn-sm" data-asst="voice-no">Agora não</button><button type="button" class="btn btn-primary btn-sm" data-asst="voice-ok">${icon("mic")} Entendi, falar</button></div></div>`;
    return;
  }
  paintVoiceCard(slot, {
    listening: true, text: asst.voice?.text || "", micAttr: 'data-asst="mic"',
    bubble: asstPrompt(), meta: asst.awaiting ? "Fale a resposta." : "Ex.: “Gastei 52,30 no mercado” ou “Recebi 2500 de salário”", caption: "Ouvindo… toque para parar",
  });
}
function asstVoiceButton() {
  if (asst.voice) { try { asst.voice.rec.stop(); } catch {} return; }
  if (asst.voiceMode === "consent") return;
  let ok = false; try { ok = localStorage.getItem(VOICE_OK_KEY) === "1"; } catch {}
  if (ok) return startAsstVoice();
  asst.voiceMode = "consent"; paintAsstVoice();
}
function startAsstVoice() {
  stopVoice();
  let rec;
  try { rec = new SpeechRec(); } catch { asst.voiceMode = "idle"; paintAsstVoice(); return toast("Não foi possível usar o microfone neste navegador."); }
  rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  const session = { rec, text: "", error: "" };
  rec.onresult = (e) => {
    if (asst.voice !== session) return;
    session.text = Array.from(e.results, (r) => r[0].transcript).join(" ").replace(/\s+/g, " ").trim();
    const el = asstEl()?.querySelector(".asst-voice .va-transcript"); if (el) setTranscript(el, session.text);
  };
  rec.onerror = (e) => { session.error = e.error; };
  rec.onend = () => {
    if (asst.voice !== session) return;
    asst.voice = null; asst.voiceMode = "idle"; paintAsstVoice(); paintComposer();
    if (session.text) asstSubmit(session.text);
    else if (session.error !== "aborted") toast(VOICE_ERRORS[session.error] || "Não ouvi nada. Toque no microfone e fale de novo.");
  };
  asst.voice = session; asst.voiceMode = "listening"; paintAsstVoice(); paintComposer();
  try { rec.start(); } catch { asst.voice = null; asst.voiceMode = "idle"; paintAsstVoice(); paintComposer(); toast("Não foi possível usar o microfone neste navegador."); }
}
function stopAsstVoice() {
  const s = asst.voice; asst.voice = null;
  if (!s && asst.voiceMode === "idle") return;
  asst.voiceMode = "idle";
  try { s?.rec.abort(); } catch {}
  paintAsstVoice(); paintComposer();
}

}

function onAsstClick(e) {
  const el = e.target.closest("[data-asst]"); if (!el) return;
  const k = el.dataset.asst, m = Number(el.dataset.m);
  if (k === "toggle") asstSet("menu");
  else if (k === "open") asstSet(el.dataset.view);
  else if (k === "back") asstSet("menu");
  else if (k === "close") asstSet("closed");
  else if (k === "chip") asstChip(m, Number(el.dataset.c));
  else if (k === "mic") asstVoiceButton();
  else if (k === "voice-ok") { try { localStorage.setItem(VOICE_OK_KEY, "1"); } catch {} startAsstVoice(); }
  else if (k === "voice-no") { asst.voiceMode = "idle"; paintAsstVoice(); }
  else if (k === "key") { asst.calc = calcPress(asst.calc, el.dataset.key); paintCalc(); }
  else if (k === "use") calcUse();
  else if (["edit", "edit-cancel", "del", "del-no", "del-yes"].includes(k)) {
    const msg = asst.msgs[m]; if (!msg) return;
    if (k === "del-yes") {
      state.transactions = state.transactions.filter((t) => t.id !== msg.id);
      save(); renderSoon();
    } else { msg.editing = k === "edit"; msg.confirmDel = k === "del"; }

/** Removes the drawer at once and gives the page back (scroll, focus, inert). No animation. */
function teardownDrawer() {

/** Slides the drawer back up behind the header, then tears it down. `restoreFocus` is false when a link is navigating away. */

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return done();
